<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5f8a">
<title>جولة في البوابة · IDO tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#eef3f7;--bg2:#f4f2ec;--card:#ffffff;--ink:#1b1d1f;--mut:#6b6f76;--line:#dfe6ee;
 --blue:#1d5f8a;--sky:#3ea3dc;--navy:#163a5c;--gold:#c29a4b;--gold2:#b8862f;--grey:#c9d3dc;
 --ban:linear-gradient(135deg,#1d5f8a,#3ea3dc);
 --fnt:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fnt);-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}

/* the portal's four-colour strip, as in every page header */
#strip{position:fixed;left:0;right:0;top:0;height:4px;z-index:9;display:flex;pointer-events:none}
#strip i{flex:1}#strip i:nth-child(1){background:var(--grey)}#strip i:nth-child(2){background:var(--blue)}#strip i:nth-child(3){background:var(--sky)}#strip i:nth-child(4){background:var(--gold)}

/* the atlas: one continuous world */
#stage{position:fixed;inset:0;overflow:hidden;
 background:radial-gradient(900px 480px at 100% -80px,#dcefe3 0,transparent 62%),radial-gradient(800px 420px at 0 -100px,#fbe4e6 0,transparent 58%),radial-gradient(1200px 700px at 50% 120%,#dbe9f4 0,transparent 60%),var(--bg)}
#grid{position:absolute;inset:-50%;opacity:.9;pointer-events:none;will-change:transform;
 background-image:linear-gradient(rgba(29,95,138,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(29,95,138,.06) 1px,transparent 1px),linear-gradient(rgba(29,95,138,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(29,95,138,.03) 1px,transparent 1px);
 background-size:240px 240px,240px 240px,48px 48px,48px 48px}
#world{position:absolute;inset:0;direction:ltr;overflow:hidden}
.pn{position:absolute;left:0;top:0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(22,58,92,.18),0 0 0 1px rgba(22,58,92,.08);transition:opacity .7s ease,filter .7s ease;opacity:.35;filter:grayscale(.5)}
.pn.on{opacity:1;filter:none}
.pn.near{opacity:.75;filter:none}
.pn img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.pn.phone{border-radius:46px;box-shadow:0 0 0 12px #1b1d1f,0 0 0 13px #3a3f45,0 34px 80px rgba(22,58,92,.3)}
#path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#path .base{fill:none;stroke:rgba(29,95,138,.22);stroke-linecap:round}
#path .done{fill:none;stroke:var(--gold);stroke-linecap:round}
#path .stop{fill:#fff;stroke:var(--gold)}
.cnum{position:absolute;left:0;top:0;font-family:var(--fnt);font-weight:800;color:rgba(29,95,138,.06);line-height:1;pointer-events:none;white-space:nowrap}

/* spotlight + arrow live in screen space */
#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#fx .dim{fill:rgba(22,58,92,.5)}
#fx .ring{fill:none;stroke:var(--gold);stroke-width:3}
#fx .glow{fill:none;stroke:rgba(194,154,75,.45);stroke-width:12;filter:blur(7px)}
#fx .arw{fill:none;stroke:var(--gold);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#fx .arh{fill:var(--gold)}

/* caption: the portal's blue banner */
#cap{position:fixed;inset-inline-start:clamp(16px,5vw,72px);bottom:clamp(58px,9vh,96px);max-width:min(620px,calc(100vw - 32px));pointer-events:none;z-index:5;color:#fff}
#cap.top{bottom:auto;top:clamp(24px,6vh,64px)}
#cap .k{font-size:14px;color:#ffe7b0;font-weight:700;margin-bottom:2px;min-height:1.2em}
#cap h2{margin:0;font-weight:800;font-size:clamp(24px,3.6vw,46px);line-height:1.2;text-wrap:wrap}
#cap p{margin:.35em 0 0;font-size:clamp(15px,1.5vw,19px);line-height:1.6;color:#eaf4fb;text-wrap:wrap}
#cap .w{display:inline-block;will-change:transform,opacity;opacity:0;transform:translateY(.45em);filter:blur(5px);transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),filter .55s}
#cap.in .w{opacity:1;transform:none;filter:none}
#cap .plate{position:absolute;inset:-18px -26px;border-radius:22px;background:radial-gradient(circle at 0 0,rgba(255,255,255,.14) 0,rgba(255,255,255,.14) 120px,transparent 121px),var(--ban);box-shadow:0 14px 34px rgba(29,95,138,.32);z-index:-1;opacity:0;transform:scale(.96);transition:opacity .4s,transform .5s cubic-bezier(.2,.7,.2,1)}
html[dir=ltr] #cap .plate{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.14) 0,rgba(255,255,255,.14) 120px,transparent 121px),var(--ban)}
#cap.in .plate{opacity:1;transform:none}

/* chapter title moments */
#ttl{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;pointer-events:none;z-index:4}
#ttl .bk{position:absolute;inset:0;background:radial-gradient(ellipse 78% 62% at 50% 50%,rgba(238,243,247,.97) 0,rgba(238,243,247,.94) 55%,rgba(238,243,247,.6) 80%,rgba(238,243,247,0) 100%);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .8s}
#ttl.in .bk{opacity:1}
#ttl>*:not(.bk){position:relative}
#ttl .n{font-weight:800;font-size:clamp(90px,19vw,250px);line-height:.9;color:transparent;-webkit-text-stroke:2px rgba(29,95,138,.35);opacity:0;transform:scale(1.08);transition:opacity 1s,transform 1.4s cubic-bezier(.2,.7,.2,1)}
#ttl h1{margin:.05em 0 0;font-weight:800;font-size:clamp(30px,6vw,86px);line-height:1.2;color:var(--navy);max-width:16em;text-wrap:wrap}
#ttl p{margin:.4em 0 0;font-size:clamp(17px,2vw,26px);color:var(--blue);max-width:30em;font-weight:600}
#ttl .w{display:inline-block;opacity:0;transform:translateY(.6em);filter:blur(8px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),filter .7s}
#ttl.in .w{opacity:1;transform:none;filter:none}
#ttl.in .n{opacity:1;transform:none}
#ttl .go{pointer-events:auto;margin-top:28px;display:inline-flex;gap:10px;opacity:0;transition:opacity .6s 1s;flex-wrap:wrap;justify-content:center}
#ttl.in .go{opacity:1}
#ttl .go a{background:var(--ban);color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:999px;font-size:17px;box-shadow:0 10px 24px rgba(29,95,138,.28)}
#ttl .go a.g{background:#fff;color:var(--blue);border:1px solid var(--line);box-shadow:none}
#ttl .logo{height:58px;margin-bottom:10px;opacity:0;transition:opacity .8s .2s}
#ttl.in .logo{opacity:1}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:8}
body.idle #hud .fade{opacity:0}
.fade{transition:opacity .5s}
#prog{position:fixed;left:0;right:0;bottom:0;height:16px;display:flex;gap:3px;align-items:flex-end;pointer-events:auto;direction:ltr}
#prog .sg{position:relative;height:5px;flex:1;background:rgba(29,95,138,.14);cursor:pointer;transition:height .2s}
#prog:hover .sg{height:9px}
#prog .sg i{position:absolute;inset:0;width:0;background:var(--ban);transition:width .6s cubic-bezier(.2,.7,.2,1)}
#prog .sg b{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600;font-size:12px;background:#fff;color:var(--blue);border:1px solid var(--line);padding:3px 10px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
#prog .sg:hover b{opacity:1}
body[dir=rtl] #prog{flex-direction:row-reverse}
body[dir=rtl] #prog .sg i{left:auto;right:0}
#bar{position:fixed;inset-inline-end:14px;bottom:26px;display:flex;gap:6px;align-items:center;pointer-events:auto}
#bar button,#tl button{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:999px;min-width:42px;height:42px;padding:0 14px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(22,58,92,.08)}
#bar button:hover,#tl button:hover{border-color:var(--sky)}
#bar #bNext{background:var(--ban);color:#fff;border:0;font-size:20px}
#pg{font-variant-numeric:tabular-nums}
#tl{position:fixed;inset-inline-end:14px;top:16px;display:flex;gap:6px;pointer-events:auto}
#chl{position:fixed;inset-inline-start:16px;top:18px;font-size:15px;color:var(--mut);pointer-events:none;display:flex;align-items:center;gap:10px}
#chl img{height:38px}
#chl b{color:var(--blue);font-weight:700}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;background:rgba(238,243,247,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:auto;padding:clamp(16px,4vw,56px)}
.ov.on{display:block}
.ov h3{font-weight:800;font-size:clamp(24px,3vw,34px);margin:0 0 16px;color:var(--navy)}
.ov .x{position:fixed;inset-inline-end:16px;top:16px;width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:18px;color:var(--navy)}
#help .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 40px;max-width:1100px}
#help .r{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
kbd{font-family:var(--fnt);background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:1px 8px;font-size:13px;white-space:nowrap;color:var(--navy);font-weight:700}
#help .lead,#keys .lead{max-width:62ch;line-height:1.8;color:var(--ink);margin:0 0 22px}
#ovw .ch{font-size:20px;font-weight:800;margin:26px 0 10px;color:var(--blue)}
#ovw .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
#ovw .c{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:start;padding:0;display:block;width:100%;box-shadow:0 4px 14px rgba(22,58,92,.06)}
#ovw .c:hover,#ovw .c.cur{border-color:var(--sky);box-shadow:0 0 0 3px rgba(62,163,220,.25)}
#ovw .th,#pv .th{aspect-ratio:16/10;background-color:#fff;background-repeat:no-repeat;position:relative;overflow:hidden}
.th.tt{background:var(--ban)!important;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;padding:12px;text-align:center}
.th .bx{position:absolute;border:2px solid var(--gold);border-radius:6px;box-shadow:0 0 0 999px rgba(22,58,92,.25)}
#ovw .m{padding:8px 10px;font-size:13px;line-height:1.45;display:flex;gap:8px;font-weight:600}
#ovw .m span{color:var(--sky);font-variant-numeric:tabular-nums}
#tops .sr{width:100%;max-width:560px;font:inherit;font-size:17px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);margin-bottom:10px}
#tops .grp{max-width:760px;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px 8px}
#tops .grp>b{display:block;font-size:19px;font-weight:800;color:var(--blue);margin:8px 0 4px;cursor:pointer}
#tops .it{display:flex;gap:12px;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:9px 4px;cursor:pointer;line-height:1.5;font-weight:600}
#tops .it:hover{background:#f3f8fc}
#tops .it span{color:var(--sky);min-width:2.2em;font-variant-numeric:tabular-nums}
#tops .it small{display:block;color:var(--mut);font-weight:400}
#keys .log{max-width:720px;display:flex;flex-direction:column;gap:6px;margin-top:14px}
#keys .lr{display:grid;grid-template-columns:150px 150px 1fr;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;align-items:center}
#keys .lr em{font-style:normal;color:var(--blue);font-weight:700}
#jump{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(22,58,92,.35)}
#jump.on{display:flex}
#jump form{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;gap:10px;align-items:center;font-size:18px;box-shadow:0 20px 50px rgba(22,58,92,.25);color:var(--navy);font-weight:700}
#jump input{width:110px;font:inherit;font-size:28px;text-align:center;border-radius:12px;border:1px solid var(--line);padding:4px}
#jump button{background:var(--ban);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:700;padding:10px 18px;border-radius:999px;z-index:41;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 20px rgba(22,58,92,.15)}
#digits{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:84px;font-weight:800;color:var(--blue);z-index:41;pointer-events:none;text-shadow:0 0 30px #fff}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:var(--bg);transition:opacity .6s}
#load img{height:70px;opacity:.9}

/* presenter view */
body.pres #stage,body.pres #hud,body.pres #cap,body.pres #ttl,body.pres #fx,body.pres #strip{display:none}
#pv{display:none}
body.pres #pv{display:grid;position:fixed;inset:0;grid-template-columns:1.4fr 1fr;grid-template-rows:auto 1fr auto;gap:14px;padding:18px;background:var(--bg);overflow:auto}
#pv .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(22,58,92,.06)}
#pv .now{grid-row:1/3}
#pv .lbl{color:var(--mut);font-size:14px;margin-bottom:6px;font-weight:600}
#pv .now h2{font-size:clamp(28px,3.2vw,44px);margin:0;color:var(--navy);line-height:1.2;font-weight:800}
#pv .now .sub{font-size:20px;margin:6px 0 16px;color:var(--blue);font-weight:600}
#pv .notes{font-size:clamp(18px,1.7vw,24px);line-height:1.8;color:var(--ink);border-top:1px solid var(--line);padding-top:12px;white-space:pre-wrap}
#pv .next h3{font-size:22px;margin:0;color:var(--navy);font-weight:800}
#pv .next .th{margin-top:12px;border-radius:12px;border:1px solid var(--line)}
#pv .clock{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
#pv .tm{font-size:clamp(42px,5vw,72px);font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
#pv .tm.run{color:var(--blue)}
#pv .now-time{color:var(--mut);font-size:18px;font-weight:600}
#pv .ctl{grid-column:1/3;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#pv .ctl button{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:999px;padding:12px 20px;font-size:17px;font-weight:700;cursor:pointer}
#pv .ctl button.p{background:var(--ban);color:#fff;border:0;min-width:130px}
#pv .ctl .cnt{font-size:24px;font-weight:800;color:var(--navy);margin-inline-start:auto}
@media (max-width:760px){
 body.pres #pv{grid-template-columns:1fr;grid-template-rows:auto}
 #pv .now{grid-row:auto}#pv .ctl{grid-column:auto}
 #bar .opt,#tl #bOvw,#chl img{display:none}
 #cap{bottom:80px;inset-inline:26px;max-width:none}
 #cap .plate{inset:-14px -16px}
 #cap.top{top:64px}
}
@media (prefers-reduced-motion:reduce){#cap .w,#ttl .w,#ttl .n,.pn{transition-duration:.01s!important}}
#bar #bAuto{position:relative;padding:0 12px 0 14px;display:inline-flex;align-items:center;gap:6px}#bAuto svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}#bAuto .rg{fill:none;stroke:var(--sky,#3b9ad9);stroke-width:2.5;stroke-dasharray:94.3;stroke-dashoffset:94.3;transform:rotate(-90deg);transform-origin:50% 50%}#bAuto.on{background:var(--ban);color:#fff;border-color:transparent}#bAuto.on svg{opacity:1}#bAuto.on .rg{stroke:#ffe7b0}body.auto.idle #hud #bar{opacity:1}
</style>
</head>
<body>
<div id="load"><img src="logo.png" alt=""></div><div id="strip"><i></i><i></i><i></i><i></i></div>
<div id="stage" aria-hidden="true"><div id="grid"></div><div id="world"><svg id="path"></svg></div></div>
<svg id="fx" aria-hidden="true">
 <defs><mask id="hole"><rect x="0" y="0" width="100%" height="100%" fill="#fff"/><rect id="hr" rx="14" fill="#000"/></mask>
 <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="arh" d="M0 0 L10 5 L0 10 z"/></marker></defs>
 <rect class="dim" id="dim" x="0" y="0" width="100%" height="100%" mask="url(#hole)" opacity="0"/>
 <rect class="glow" id="gl" rx="14" opacity="0"/><rect class="ring" id="rg" rx="14" opacity="0"/>
 <path class="arw" id="aw" marker-end="url(#ah)" opacity="0"/>
</svg>
<div id="ttl" aria-live="polite"></div>
<div id="cap" aria-live="polite"></div>
<div id="hud">
 <div id="chl" class="fade"></div>
 <div id="tl" class="fade">
  <button id="bTop" title=""></button><button id="bOvw" title=""></button><button id="bLang"></button><button id="bHelp" title="">?</button><button id="bExit" title="">✕</button>
 </div>
 <div id="bar" class="fade">
  <button id="bAuto" aria-pressed="false"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="rg" cx="18" cy="18" r="15"/></svg><span></span></button><button id="bPrev" aria-label=""></button><button id="pg"></button><button id="bNext" aria-label=""></button>
  <button id="bPres" class="opt" title=""></button><button id="bSnap" class="opt" title=""></button><button id="bFs" class="opt" title="">⛶</button>
 </div>
 <div id="prog"></div>
</div>
<div class="ov" id="help" role="dialog" aria-modal="true"><button class="x" data-close>✕</button><div class="in"></div></div>
<div class="ov" id="ovw" role="dialog" aria-modal="true"><button class="x" data-close>✕</button><div class="in"></div></div>
<div class="ov" id="tops" role="dialog" aria-modal="true"><button class="x" data-close>✕</button><div class="in"></div></div>
<div class="ov" id="keys" role="dialog" aria-modal="true"><button class="x" data-close>✕</button><div class="in"></div></div>
<div id="jump"><form><label id="jl"></label><input id="ji" type="number" min="1" inputmode="numeric"><button id="jb"></button></form></div>
<div id="flash"></div><div id="toast"></div><div id="digits"></div>
<div id="pv"></div>
<script src="scenes.js?v=9"></script>
<script src="steps.js?v=5"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const PRES=Q.has('presenter');
let LANG=(Q.get('lang')||(()=>{try{return localStorage.getItem('lang')}catch(_){return null}})()||'ar')=='en'?'en':'ar';
const L=()=>LANG=='ar'?0:1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEPS=window.STEPS,CH=window.CHAPTERS,SC=window.SCENES;
const N=STEPS.length;
const UI={
 prev:['السابق','Previous'],next:['التالي','Next'],topics:['المواضيع','Topics'],overview:['كل اللقطات','All clicks'],help:['المساعدة','Help'],exit:['خروج إلى البوابة','Back to the portal'],
 auto:['تشغيل تلقائي','Autoplay'],autoOff:['إيقاف التشغيل التلقائي','Stop autoplay'],pres:['عرض المقدّم','Presenter view'],snap:['حفظ لقطة','Save snapshot'],fs:['ملء الشاشة','Full screen'],
 jumpL:['انتقل إلى','Go to'],jumpB:['انتقال','Go'],search:['ابحث عن موضوع…','Find a topic…'],
 now:['الآن','Now'],nextS:['التالي','Next'],notes:['ملاحظات','Notes'],start:['ابدأ','Start'],pause:['إيقاف','Pause'],reset:['تصفير','Reset'],
 noNotes:['لا ملاحظات لهذه اللقطة.','No notes for this click.'],end:['نهاية الجولة','End of the tour'],
 keysT:['اختبار المفاتيح','Key tester'],keysL:['اضغط أي زر في جهاز التحكم أو لوحة المفاتيح لترى ما يفعله. Esc للإغلاق.','Press any button on your clicker or keyboard to see what it does. Esc to close.'],
 keysNone:['— لا شيء','— nothing'],saved:['حُفظت اللقطة','Snapshot saved'],openPortal:['افتح البوابة','Open the portal'],openHelp:['صفحة المساعدة','Help page'],

/* ───────── overlays ───────── */
function openOv(id){closeOv();const o=$(id);fillOv(id);o.classList.add('on');document.body.classList.remove('idle');const f=o.querySelector('input,button.c.cur,button.it,button');setTimeout(()=>{(id=='tops'?o.querySelector('.sr'):o.querySelector('.c.cur')||o.querySelector('.x')).focus();if(id=='ovw'){const c=o.querySelector('.c.cur');c&&c.scrollIntoView({block:'center'})}},30)}
function closeOv(){document.querySelectorAll('.ov.on').forEach(o=>o.classList.remove('on'));$('jump').classList.remove('on')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();closeOv()});
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>e.stopPropagation()));
function thumbStyle(st){if(st.title)return '';const g=SC[st.s][LANG];const b=st.t&&g.t[st.t]?g.t[st.t]:null;
 // frame the target (or whole screen) inside a 16:10 thumbnail
 const W=g.w,H=g.h;let fx=0,fy=0,fw=W,fh=H;if(b){fw=Math.max(b.w+80,W*.45);fh=fw*10/16;fx=Math.max(0,Math.min(W-fw,b.x+b.w/2-fw/2));fy=Math.max(0,Math.min(H-fh,b.y+b.h/2-fh/2))}else{fh=Math.min(H,W*10/16);fw=fh*16/10;fx=(W-fw)/2}
 const sc=100/fw; // % of thumb width per screen px
 return {bg:`background-image:url(${g.img});background-size:${W*sc}% auto;background-position:${fx/(W-fw||1)*100}% ${fy/(H-fh||1)*100}%`,box:b?`left:${(b.x-fx)*sc}%;top:${(b.y-fy)/fh*100}%;width:${b.w*sc}%;height:${b.h/fh*100}%`:''}}
function thumb(st){if(st.title)return `<div class="th tt">${esc(tt(st.c))}</div>`;const t=thumbStyle(st);return `<div class="th" style="${t.bg}">${t.box?`<span class="bx" style="${t.box}"></span>`:''}</div>`}
function fillOv(id){const o=$(id).querySelector('.in');
 if(id=='help'){const K=[[['→ ← ↓ ↑','PageDown / PageUp','Space · Enter'],ACT.next[L()]+' / '+ACT.prev[L()]],[['Home','End'],ACT.first[L()]+' / '+ACT.last[L()]],[['1 2 3 … Enter','G'],tt(ACT.jump)],[['O'],tt(ACT.ovw)],[['T'],tt(ACT.tops)],[['P'],tt(ACT.pres)],[['S'],tt(ACT.snap)],[['K'],tt(ACT.keys)],[['L'],tt(ACT.lang)],[['F'],tt(ACT.fs)],[['H','?'],tt(ACT.help)],[['Esc'],tt(ACT.close)]];
  o.innerHTML=`<h3>${tt(UI.helpT)}</h3><p class="lead">${tt(UI.helpLead)} ${LANG=='ar'?'في العربية: السهم الأيسر للتالي والأيمن للسابق.':'In English, the right arrow moves forward.'}</p><div class="cols">${K.map(k=>`<div class="r"><span>${k[1]}</span><span>${k[0].map(x=>`<kbd>${x}</kbd>`).join(' ')}</span></div>`).join('')}</div>`}
 if(id=='ovw'){o.innerHTML=`<h3>${tt(UI.overview)}</h3>`+CH.map(c=>{const idx=STEPS.map((s,j)=>s.ch==c.id?j:-1).filter(j=>j>=0);return `<div class="ch">${esc(tt(c.t))}</div><div class="gr">${idx.map(j=>`<button class="c${j==cur?' cur':''}" data-go="${j}">${thumb(STEPS[j])}<div class="m"><span>${j+1}</span>${esc(tt(STEPS[j].c))}</div></button>`).join('')}</div>`}).join('')}
 if(id=='tops'){o.innerHTML=`<h3>${tt(UI.topics)}</h3><input class="sr" placeholder="${tt(UI.search)}" aria-label="${tt(UI.search)}"><div class="lst"></div>`;
  const draw=q=>{q=(q||'').trim().toLowerCase();o.querySelector('.lst').innerHTML=CH.map(c=>{const idx=STEPS.map((s,j)=>s.ch==c.id?j:-1).filter(j=>j>=0).filter(j=>{const s=STEPS[j];return !q||[tt(s.c),tt(s.d||['','']),tt(s.n||['','']),tt(c.t)].join(' ').toLowerCase().includes(q)});if(!idx.length)return '';
   return `<div class="grp"><b data-go="${idx[0]}">${esc(tt(c.t))}</b>${idx.map(j=>`<button class="it" data-go="${j}"><span>${j+1}</span><div>${esc(tt(STEPS[j].c))}${STEPS[j].d?`<small>${esc(tt(STEPS[j].d))}</small>`:''}</div></button>`).join('')}</div>`}).join('')};
  draw('');const sr=o.querySelector('.sr');sr.oninput=()=>draw(sr.value);sr.onkeydown=e=>{if(e.key=='Enter'){const f=o.querySelector('.it');f&&f.click()}}}
 if(id=='keys'){o.innerHTML=`<h3>${tt(UI.keysT)}</h3><p class="lead">${tt(UI.keysL)}</p><div class="log"></div>`}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.stopPropagation();closeOv();go(+g.dataset.go)}},true);
function openJump(){closeOv();$('jump').classList.add('on');$('ji').value='';$('ji').max=N;setTimeout(()=>$('ji').focus(),20)}
$('jump').querySelector('form').onsubmit=e=>{e.preventDefault();const v=parseInt($('ji').value);$('jump').classList.remove('on');if(v)go(v-1)};
$('jump').addEventListener('click',e=>{e.stopPropagation();if(e.target.id=='jump')$('jump').classList.remove('on')});
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1800)}
function fullscreen(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}}
function switchLang(){LANG=LANG=='ar'?'en':'ar';try{const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u)}catch(_){}buildHud();buildWorld();go(cur,{instant:true});bc&&bc.postMessage({k:'at',i:cur,lang:LANG})}

/* ───────── snapshot: draws exactly what is on screen into a PNG ───────── */
async function snapshot(){while(FLY)await new Promise(r=>setTimeout(r,60));const dpr=Math.min(2,devicePixelRatio||1),W=VW(),H=VH();const cv=document.createElement('canvas');cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 x.fillStyle='#eef3f7';x.fillRect(0,0,W,H);
 const st=STEPS[cur];
 for(const id of order){const p=POS[id],r=w2s(p);if(r.x>W||r.y>H||r.x+r.w<0||r.y+r.h<0)continue;const im=PANEL[id].querySelector('img');try{await im.decode()}catch(_){}
  x.save();x.globalAlpha=parseFloat(getComputedStyle(PANEL[id]).opacity)||1;const rad=SC[id].m?46*r.w/p.w:14*r.w/p.w;x.beginPath();x.roundRect(r.x,r.y,r.w,r.h,rad);x.clip();x.drawImage(im,r.x,r.y,r.w,r.h);x.restore()}
 if(spot.r&&spot.o>0){const s=w2s(spot.r);x.save();x.fillStyle=`rgba(22,58,92,${.5*spot.o})`;x.beginPath();x.rect(0,0,W,H);x.roundRect(s.x,s.y,s.w,s.h,Math.min(16,s.h/4));x.fill('evenodd');x.strokeStyle='#c29a4b';x.lineWidth=3;x.beginPath();x.roundRect(s.x,s.y,s.w,s.h,Math.min(16,s.h/4));x.stroke();x.restore()}
 x.direction=LANG=='ar'?'rtl':'ltr';x.textAlign='start';x.fillStyle='#fff';
 if(st.title){x.textAlign='center';x.fillStyle='#163a5c';let fz=Math.round(Math.min(86,W*.06));x.font=`800 ${fz}px "Cairo"`;while(fz>20&&x.measureText(tt(st.c)).width>W*.9){fz-=2;x.font=`800 ${fz}px "Cairo"`}x.fillText(tt(st.c),W/2,H/2);x.font=`600 ${Math.round(Math.min(26,W*.02))}px "Cairo"`;x.fillStyle='#1d5f8a';x.fillText(tt(st.d),W/2,H/2+50)}
 else{const c=$('cap').getBoundingClientRect(),h2=$('cap').querySelector('h2'),pp=$('cap').querySelector('p'),k=$('cap').querySelector('.k');const X=LANG=='ar'?c.right:c.left;
  const gr=x.createLinearGradient(c.left,c.top,c.right,c.bottom);gr.addColorStop(0,'#1d5f8a');gr.addColorStop(1,'#3ea3dc');x.fillStyle=gr;x.beginPath();x.roundRect(c.left-26,c.top-18,c.width+52,c.height+36,22);x.fill();
  const fs=parseFloat(getComputedStyle(h2).fontSize);x.fillStyle='#ffe7b0';x.font=`700 14px "Cairo"`;x.fillText(k.textContent,X,c.top+14);
  x.fillStyle='#fff';x.font=`800 ${fs}px "Cairo"`;x.fillText(h2.textContent,X,h2.getBoundingClientRect().top+fs*.95);
  if(pp){const f2=parseFloat(getComputedStyle(pp).fontSize);x.fillStyle='#eaf4fb';x.font=`400 ${f2}px "Cairo"`;x.fillText(pp.textContent,X,pp.getBoundingClientRect().top+f2*1.1)}
  const a=$('aw');if(a.getAttribute('opacity')=='1'){x.strokeStyle='#c29a4b';x.lineWidth=3.5;x.lineCap='round';x.stroke(new Path2D(a.getAttribute('d')))}}
 x.textAlign='start';x.direction='ltr';x.font='700 13px "Cairo"';x.fillStyle='#6b6f76';x.fillText((cur+1)+' / '+N,16,H-16);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ido-tour-${String(cur+1).padStart(2,'0')}-${LANG}.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},'image/png');
 const f=$('flash');f.style.transition='none';f.style.opacity=.7;f.getBoundingClientRect();f.style.transition='opacity .5s';f.style.opacity=0;toast(tt(UI.saved))}

/* ───────── presenter view (second window, kept in sync) ───────── */
let bc=null;try{bc=new BroadcastChannel('ido-tour')}catch(_){}
function openPresenter(){const u=new URL(location.href);u.searchParams.set('presenter','1');u.searchParams.set('lang',LANG);u.hash='';const w=window.open(u.toString(),'ido-presenter','width=1100,height=720');if(!w)toast(tt(UI.popup))}
if(bc&&!PRES)bc.onmessage=e=>{const m=e.data||{};if(m.k=='go')go(m.i);if(m.k=='hello')bc.postMessage({k:'at',i:cur,lang:LANG});if(m.k=='key')handle(m.e)};

/* ───────── keys, clicks, swipes ───────── */
function actionFor(e){const k=e.key,rtl=LANG=='ar';
 if(/^[0-9]$/.test(k))return 'digit';
 if(k=='PageDown'||k=='ArrowDown'||(k==' '&&!e.shiftKey)||k=='Enter'||k=='MediaTrackNext'||(k=='ArrowLeft'&&rtl)||(k=='ArrowRight'&&!rtl)||k=='n'||k=='N')return 'next';
 if(k=='PageUp'||k=='ArrowUp'||(k==' '&&e.shiftKey)||k=='Backspace'||k=='MediaTrackPrevious'||(k=='ArrowRight'&&rtl)||(k=='ArrowLeft'&&!rtl))return 'prev';
 if(k=='Home')return 'first';if(k=='End')return 'last';
 if(k=='o'||k=='O')return 'ovw';if(k=='t'||k=='T'||k=='m'||k=='M')return 'tops';if(k=='p'||k=='P')return 'pres';
 if(k=='g'||k=='G')return 'jump';if(k=='s'||k=='S')return 'snap';if(k=='l'||k=='L')return 'lang';if(k=='f'||k=='F')return 'fs';
 if(k=='k'||k=='K')return 'keys';if(k=='h'||k=='H'||k=='?')return 'help';if(k=='Escape')return 'close';if(k=='F5')return 'first';return null}
let DIG='';
function handle(e){const a=actionFor(e);
 if(DIG&&e.key=='Enter'){const v=parseInt(DIG);DIG='';$('digits').textContent='';if(v)go(v-1);return true}
 switch(a){
  case 'digit':DIG=(DIG+e.key).slice(-3);$('digits').textContent=DIG;clearTimeout(handle.t);handle.t=setTimeout(()=>{DIG='';$('digits').textContent=''},2500);return true;
  case 'next':next();return true;case 'prev':prev();return true;case 'first':go(0);return true;case 'last':go(N-1);return true;
  case 'ovw':openOv('ovw');return true;case 'tops':openOv('tops');return true;
  case 'help':openOv('help');return true;case 'pres':openPresenter();return true;case 'jump':openJump();return true;case 'snap':snapshot();return true;
  case 'lang':switchLang();return true;case 'fs':fullscreen();return true;case 'keys':openOv('keys');return true;case 'close':closeOv();return true}
 return false}
addEventListener('keydown',e=>{if(PRES)return;wake();
 const ko=$('keys');if(ko.classList.contains('on')){e.preventDefault();if(e.key=='Escape'){closeOv();return}const a=actionFor(e);const lg=ko.querySelector('.log');const r=document.createElement('div');r.className='lr';r.innerHTML=`<span><kbd>${esc(e.key==' '?'Space':e.key)}</kbd></span><span>${esc(e.code)}</span><em>${a?esc(tt(ACT[a])):tt(UI.keysNone)}</em>`;lg.prepend(r);while(lg.children.length>12)lg.lastChild.remove();return}
 const open=document.querySelector('.ov.on')||$('jump').classList.contains('on');
 if(open){if(e.key=='Escape'){closeOv();e.preventDefault()}return}
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(handle(e))e.preventDefault()});
/* on phones act on the finger lift itself, so a tap after a pause never needs a second tap */
let TNAV=0,PD=null;addEventListener('pointerdown',e=>{if(e.pointerType=='touch')PD={x:e.clientX,y:e.clientY,t:Date.now()}},true);
addEventListener('pointerup',e=>{if(e.pointerType!='touch'||PRES||!PD)return;const mv=Math.hypot(e.clientX-PD.x,e.clientY-PD.y),lg=Date.now()-PD.t;PD=null;if(mv>12||lg>800)return;
 const t=e.target;if(t.closest('#bNext')){TNAV=Date.now();next()}else if(t.closest('#bPrev')){TNAV=Date.now();prev()}
 else if(!t.closest('#hud button,#prog,#ttl a,.ov,#jump,a,input')&&!document.querySelector('.ov.on')&&!$('jump').classList.contains('on')){TNAV=Date.now();next()}},true);
$('stage').parentNode.addEventListener('click',e=>{if(PRES)return;if(Date.now()-TNAV<700)return;if(e.target.closest('#hud button,#prog,#ttl a,.ov,#jump'))return;if(document.querySelector('.ov.on'))return;next()});
addEventListener('contextmenu',e=>{if(PRES||e.target.closest('.ov'))return;e.preventDefault();prev()});
let tx0=null,ty0=null;addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY},{passive:true});
addEventListener('touchend',e=>{if(tx0==null||PRES)return;const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;tx0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){if(document.querySelector('.ov.on'))return;const fwd=LANG=='ar'?dx>0:dx<0;fwd?next():prev();e.preventDefault()}});
addEventListener('resize',()=>{go(cur,{instant:true})});
addEventListener('hashchange',()=>{const v=parseInt(location.hash.slice(1));if(v&&v-1!=cur)go(v-1)});

/* ───────── presenter screen ───────── */
function presenter(){document.body.classList.add('pres');const pv=$('pv');let i=0,run=false,acc=0,t0=0;
 document.documentElement.lang=LANG;document.documentElement.dir=LANG=='ar'?'rtl':'ltr';document.title=tt(UI.pres);
 const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
 const el=()=>acc+(run?Date.now()-t0:0);
 function draw(){const st=STEPS[i],nx=STEPS[i+1];const ch=CH[chIndex(st.ch)];
  pv.innerHTML=`<div class="card now"><div class="lbl">${tt(UI.now)} · ${esc(tt(ch.t))}</div><h2>${esc(tt(st.c))}</h2><div class="sub">${esc(tt(st.d||['','']))}</div><div class="lbl">${tt(UI.notes)}</div><div class="notes">${esc((st.n&&tt(st.n))||tt(UI.noNotes))}</div></div>
  <div class="card next"><div class="lbl">${tt(UI.nextS)}</div>${nx?`<h3>${esc(tt(nx.c))}</h3>${thumb(nx)}`:`<h3>${tt(UI.end)}</h3>`}</div>
  <div class="card"><div class="clock"><div class="tm${run?' run':''}" id="ptm">${fmt(el())}</div><div class="now-time" id="pclk"></div></div></div>
  <div class="ctl"><button id="pPrev">${LANG=='ar'?'›':'‹'} ${tt(UI.prev)}</button><button class="p" id="pNext">${tt(UI.next)} ${LANG=='ar'?'‹':'›'}</button><button id="pRun">${run?tt(UI.pause):tt(UI.start)}</button><button id="pRst">${tt(UI.reset)}</button><span class="cnt">${i+1} / ${N}</span></div>`;
  $('pPrev').onclick=()=>send(i-1);$('pNext').onclick=()=>send(i+1);$('pRun').onclick=()=>{if(run){acc+=Date.now()-t0;run=false}else{t0=Date.now();run=true}draw()};$('pRst').onclick=()=>{acc=0;t0=Date.now();draw()};tickC()}
 function tickC(){const a=$('ptm'),b=$('pclk');if(a)a.textContent=fmt(el());if(b)b.textContent=new Date().toLocaleTimeString(LANG=='ar'?'ar-AE':'en-GB',{hour:'2-digit',minute:'2-digit'})}
 setInterval(tickC,500);
 function send(j){j=Math.max(0,Math.min(N-1,j));if(!run&&acc==0){t0=Date.now();run=true}i=j;draw();bc&&bc.postMessage({k:'go',i:j})}
 if(bc){bc.onmessage=e=>{const m=e.data||{};if(m.k=='at'){i=m.i;if(m.lang&&m.lang!=LANG){LANG=m.lang;document.documentElement.dir=LANG=='ar'?'rtl':'ltr'}draw()}};bc.postMessage({k:'hello'})}
 addEventListener('keydown',e=>{const a=actionFor(e);if(a=='next'){e.preventDefault();send(i+1)}else if(a=='prev'){e.preventDefault();send(i-1)}else if(a=='first')send(0);else if(a=='last')send(N-1);else if(a&&a!='digit'&&bc){bc.postMessage({k:'key',e:{key:e.key,shiftKey:e.shiftKey}})}});
 draw()}

/* ───────── start ───────── */
if(PRES){$('load').remove();presenter();return}
buildHud();buildWorld();
const h=parseInt(location.hash.slice(1));const start=h&&h<=N?h-1:0;
apply(viewFor({title:1,ch:'open'}));cur=start;
const imgs=[...world.querySelectorAll('img')];let ld=0;const done=()=>{const l=$('load');if(!l)return;l.style.opacity=0;setTimeout(()=>l.remove(),600);go(start)};
const first=PANEL[STEPS[start].s];Promise.race([Promise.all(imgs.slice(0,4).map(i=>i.decode().catch(()=>{}))),new Promise(r=>setTimeout(r,2500))]).then(done);
wake();
})();
</script>
