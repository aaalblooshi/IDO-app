function vGantt(rs){

  const L=p.rs.filter(r=>r.leaf&&ids.has(r.id)&&(MODE=='me'||!FST||(FST=='open'?!isDone(r):FST=='late'?lateD(r)>0:isDone(r)))).sort((a,b)=>(a.s==null)-(b.s==null)||a.s-b.s);
  L.forEach(r=>rows.push({r,s:r.s,e:r.e,a:r.a.a,ex:r.a.ex,n:r.x.n,late:lateD(r),ms:r.x.ms,k:p.pid+'|'+r.id}))});

 let hd='',gl='';const d0=new Date(m0*DAY);let y=d0.getUTCFullYear(),mo=d0.getUTCMonth();
 for(;;){const st=Date.UTC(y,mo,1)/DAY;if(st>m1)break;const nx=Date.UTC(y,mo+1,1)/DAY,x=Math.round((Math.max(st,m0)-m0)*PXD),w=Math.round((Math.min(nx-1,m1)-Math.max(st,m0)+1)*PXD);
  hd+=`<div class="gm" style="left:${x}px;width:${w}px">${String(mo+1).padStart(2,'0')}/${y}</div>`;gl+=`<div class="gv" style="left:${x}px"></div>`;mo++;if(mo>11){mo=0;y++}}
 const tx=Math.round((TODAY-m0)*PXD);
 const bars=rows.map((r,i)=>{if(r.s==null||r.e==null)return '';const x=Math.round((r.s-m0)*PXD),w=Math.max(r.ms||r.proj?6:4,Math.round((r.e-r.s+1)*PXD)),col=r.proj?'#23272b':'#3D96C7',lt=r.late;
  const oc=r.k?`onclick="openSheet('${r.k}')"`:'';
  if(r.ms)return `<div class="gd" ${oc} style="left:${x+w/2-7}px;top:${i*RH+8}px;background:${lt?'#d1101d':col}"></div>`;
  return `<div class="gb ${lt?'lt':''}" ${oc} style="left:${x}px;width:${w}px;top:${i*RH+7}px;background:${col}22;border-color:${col}"><i style="width:${clamp(r.a,0,100)}%;background:${col}"></i></div><div class="gp" style="left:${x}px;top:${i*RH+22}px;width:${Math.round(w*clamp(r.ex,0,100)/100)}px"></div>`}).join('');

(function(){
