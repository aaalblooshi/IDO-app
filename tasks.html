<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#23272b">
<title>مهامي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--ch:#23272b;--fnt:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:15px/1.65 var(--fnt);background:var(--bg)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.top b{font-size:16px}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
h2{margin:0 0 4px;font-size:17px}h2 small{display:block;font-weight:400;color:var(--mut);font-size:13px}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;color:var(--ink)}
button.p{background:var(--g);border-color:var(--g);color:#fff}button.r{color:var(--r);border-color:#f3b9be}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:430px){.g2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--g2);color:var(--g);font-size:12px;font-weight:700}
#toast{position:fixed;inset-inline:14px;bottom:18px;background:var(--ch);color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:9;text-align:center}
.lock{max-width:420px;margin:60px auto;text-align:center}

.pwr{position:relative}.eye{position:absolute;right:6px;left:auto;top:50%;transform:translateY(-50%);border:0!important;background:none!important;font-size:19px;padding:4px 8px!important;line-height:1}input[type=password]{direction:ltr;text-align:left;padding-right:48px!important;padding-left:12px!important}
.it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}.it .tp{display:flex;gap:8px;align-items:center;justify-content:space-between}.it b{overflow-wrap:anywhere}
.pill.d{background:#fdecee;color:var(--r)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button.on{background:var(--g);border-color:var(--g);color:#fff}.sb{position:sticky;top:50px;z-index:4;background:var(--bg);padding:6px 0 8px}.hgrp{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end;min-width:0}@media(max-width:480px){.hgrp .hbtn{padding:6px 9px;font-size:12.5px}}.hbtn{padding:6px 11px!important;border-radius:99px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}.top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:520px){.top{gap:4px;padding:8px 8px}.hbtn{padding:5px 8px!important;font-size:12px}}:root{--g:#3D96C7;--g2:#e6f2f9;--gold:#B39A6B;--gry:#949594}
.top{border-bottom:3px solid var(--gold)}
.pj{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff;overflow:hidden}
.pj.hid{opacity:.6}.pj.arc{background:#f3f2ee}
.ph{padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.ph b{overflow-wrap:anywhere;font-size:15.5px}
.bd{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-inline-end:4px;background:#eee;color:#555}
.bd.s{background:#f3ecdc;color:#7a6740}.bd.o{background:#e6f2f9;color:#2a6a90}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 12px}@media(min-width:620px){.st{grid-template-columns:repeat(4,1fr)}}
.sv{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;min-width:0;background:#fbfaf6}
.sv h4{margin:0 0 2px;font-size:12.5px;color:var(--mut);font-weight:700}
.sv a{color:var(--ink);text-decoration:none;display:block;overflow-wrap:anywhere}.sv .na{color:#aaa}
.sv .ok{color:#1c7a45}.sv .wa{color:#a8761a}.sv .bad{color:var(--r)}
.adm{border-top:1px dashed var(--line);padding:10px 14px;background:#faf8f2}
.adm summary{cursor:pointer;font-weight:700;color:#7a6740}
.gr{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;background:#fff;font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.ck{display:flex;gap:10px;flex-wrap:wrap}.ck label{display:flex;gap:5px;align-items:center;margin:4px 0;font-weight:600}.ck input{width:auto}

.top{border-bottom:3px solid #B39A6B}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:620px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fbfaf6}.kp b{display:block;font-size:22px;direction:ltr;text-align:start}.kp span{font-size:12.5px;color:var(--mut)}
.bar{height:10px;border-radius:9px;background:#e9e6dd;position:relative;overflow:hidden;margin:4px 0}.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:#3D96C7;border-radius:9px}.bar u{position:absolute;inset-block:-2px;width:2px;background:#B39A6B;text-decoration:none}
.bad{color:#d1101d}.ok{color:#1c7a45}.wa{color:#a8761a}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.tk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}.tk.dn{opacity:.65}.tk.lt{border-color:#f3b9be;background:#fff8f8}
.tk b{overflow-wrap:anywhere}.pb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pb button{padding:4px 12px;font-size:13px}
.pb2{margin:4px 0}.pr2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}.pr2 span{width:42px;flex:none}.pr2 .bar{flex:1;height:8px;margin:2px 0}.pr2 b{width:38px;text-align:end;color:var(--ink);font-weight:700;direction:ltr}.bar.pl{background:#e9e6dd}.bar.pl i{background:#23272b}
.stp{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:6px 0}.stp span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;background:var(--c);vertical-align:-1px}
.tk{border-inline-start:5px solid var(--sc,#ccc)}.tk.dn{opacity:1;background:#f1f8f3}
.tkg{border-inline-start:3px solid #d9d4c7;margin:8px 0;padding-inline-start:10px}.tkg>.gh2{font-size:13px;color:var(--mut);margin-bottom:2px}.tkg .tk{margin-inline-start:0}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stt button{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;background:#fff;padding:8px 6px;text-align:start;display:block;min-width:0}.stt button b{display:block;font-size:22px;direction:ltr;text-align:start}.stt button span{font-size:12.5px;color:var(--mut);font-weight:600}.stt button.on{background:#f4f2ec;box-shadow:0 0 0 2px var(--c) inset}
.tkp .sb{position:static!important}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1200px;margin:0 auto;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{height:44px;width:auto;display:block}
.hgrp{display:flex;gap:6px;align-items:center}.hbtn{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}
.stripe{display:flex;height:4px}.stripe i{flex:1}.stripe i:nth-child(1){background:#d1101d}.stripe i:nth-child(2){background:#0a6b3d}.stripe i:nth-child(3){background:#1b1d1f}.stripe i:nth-child(4){background:#a8a7a7}
.ttl{max-width:1200px;margin:0 auto;padding:4px 14px 7px;font-weight:800;font-size:17px;color:#23272b;display:flex;align-items:center;gap:8px}.ttl:before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(#d1101d 0 50%,#0a6b3d 50% 100%)}
.tabs button.on{background:#23272b!important;border-color:#23272b!important;color:#fff!important}button.p{background:#0a6b3d!important;border-color:#0a6b3d!important;color:#fff!important}
.top{display:none}.wide{max-width:1200px!important}

.sov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sbx{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 22px;-webkit-overflow-scrolling:touch}
.sbx h3{margin:0 0 2px;font-size:17px;overflow-wrap:anywhere}.sbx textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:70px}
.chp{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eee;color:#555;margin-inline-end:4px;white-space:nowrap}
.chp.r{background:#fdecee;color:#d1101d}.chp.o{background:#fbf0d9;color:#8a5a00}.chp.g{background:#e5f2ea;color:#1c7a45}.chp.b{background:#e6f2f9;color:#2a6a90}
.tl{margin-inline-start:0}.nd{padding:5px 0;border-top:1px dashed var(--line)}.nd .h{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.wb{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:#fff}.wb.l0{background:#f7f5ee;border-color:#B39A6B}.wb .wk{margin-inline-start:14px}
.ut{position:fixed;inset-inline:14px;bottom:18px;background:#23272b;color:#fff;padding:10px 14px;border-radius:12px;z-index:99;display:flex;gap:10px;align-items:center;justify-content:space-between}.ut button{padding:3px 14px}
.gwrap{display:flex;overflow-x:auto;direction:ltr}.gl0{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line);flex:none}.gl{display:flex;gap:4px;align-items:center;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #f0ede4;direction:auto;padding-inline-end:6px}.gl.pj{background:#f7f5ee}.gcan{position:relative;flex:none}.gh{position:absolute;top:0;height:26px;border-bottom:1px solid var(--line);background:#faf8f2}.gm{position:absolute;top:0;height:26px;border-left:1px solid var(--line);font-size:11.5px;padding:3px 5px;color:var(--mut);overflow:hidden}.gv{position:absolute;top:0;bottom:0;border-left:1px solid #f0ede4}.gt{position:absolute;width:2px;background:#d1101d;z-index:2}.gb{position:absolute;height:14px;border:1px solid;border-radius:5px;overflow:hidden;cursor:pointer}.gb.lt{box-shadow:0 0 0 2px #d1101d55}.gb i{position:absolute;inset-block:0;left:0}.gp{position:absolute;height:3px;background:#B39A6B}.gd{position:absolute;width:14px;height:14px;transform:rotate(45deg);cursor:pointer}
@media print{.top,.sb,.noprint,#toast{display:none!important}body{background:#fff}main{max-width:none;padding:0}.pgb{page-break-before:always}.card{border:0;padding:0}}

 const an=analyze(tasks,p.wm),kids=an.kids;
 const pr={pid:p.id,pcode:p.pcode||p.code||'',pname:p.pname||p.code||'',sc:+p.sc||0,pt:p.pt,pm:p.pm||'',cb:p.cb,wm:p.wm,tasks,m,an,kids};
 pr.rs=tasks.map(x=>{const a=an.t[x.id]||{a:0,ex:0,late:0,leaf:1},ch=(kids[x.id]||[]);
  const path=[];let c=x,g=0;while(c&&c.p&&m[c.p]&&g++<10){c=m[c.p];path.unshift(c.n)}
  const mine=ownerChain(m,x);
  const preds=(x.dep||[]).map(d=>({x:m[d.t],y:d.y||'FS',l:+d.l||0})).filter(d=>d.x);
  const r={pr,x,id:x.id,a,leaf:!ch.length,path,mine,edit:ADM||pr.cb==ME.id||mine,preds,s:dn(x.s),e:dn(x.e),pc:a.a,own:x.w||''};
  r.pcr=Math.round(+x.pc||0);return r});
 const byId={};pr.rs.forEach(r=>byId[r.id]=r);pr.byId=byId;
 pr.rs.forEach(r=>{r.succ=0;});
 pr.rs.forEach(r=>r.preds.forEach(d=>{const q=byId[d.x.id];if(q&&r.a.a<100)q.succ++}));
 pr.rs.forEach(r=>{r.waits=r.preds.filter(d=>{const q=byId[d.x.id];return q&&q.a.a<100});r.blocked=r.a.a<100&&r.waits.length>0});

function prio(r){if(isDone(r))return 0;const l=lateD(r),due=r.e==null?999:r.e-TODAY;
 if(l>0||due<=2||(r.succ>0&&due<=7))return 3;if(due<=7)return 2;return 1}
function relT(r){if(isDone(r))return `<span class="ok">${t('rDone')}${r.x.ae?' '+dtx(dn(r.x.ae)):''}</span>`;

 if(r.s!=null&&r.s>TODAY){const d=r.s-TODAY;return `<span class="mut">${t('rStart')} ${dayP(d)}</span>`}
 const d=r.e-TODAY;if(d==0)return `<b class="wa">${t('rToday')}</b>`;if(d==1)return `<b class="wa">${t('rTom')}</b>`;return `<span>${t('rIn')} ${dayP(d)}</span>`}

<script>/*fmtfix*/
(function(){
 var AR={'٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9,'۰':0,'۱':1,'۲':2,'۳':3,'۴':4,'۵':5,'۶':6,'۷':7,'۸':8,'۹':9};
 var RA=/[٠-٩۰-۹]/g,RI=/(\d{4})-(\d{2})-(\d{2})/g;
 function fixTxt(s){if(!s)return s;var o=s.replace(RA,function(c){return AR[c]});o=o.replace(RI,function(m,y,mo,d){return (+mo>=1&&+mo<=12&&+d>=1&&+d<=31)?d+'/'+mo+'/'+y:m});return o}
 function walk(root){try{var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode;if(!p)return NodeFilter.FILTER_REJECT;var g=p.nodeName;return(g=='SCRIPT'||g=='STYLE'||g=='TEXTAREA'||g=='OPTION'&&0)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),n,L=[];while(n=w.nextNode())L.push(n);L.forEach(function(n){var v=n.nodeValue,f=fixTxt(v);if(f!==v)n.nodeValue=f})}catch(e){}}
 function ph(){return document.documentElement.lang=='ar'?'يوم/شهر/سنة':'dd/mm/yyyy'}
 function dfmt(v){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''}
 function enh(i){if(i._dt)return;i._dt=1;var w=document.createElement('span');w.className='dtw';var s=document.createElement('span');s.className='dtv';i.parentNode.insertBefore(w,i);w.appendChild(s);w.appendChild(i);i.classList.add('dtx');i._s=s;sync(i);
  var f=function(){sync(i)};i.addEventListener('input',f);i.addEventListener('change',f)}

 function scan(r){(r.querySelectorAll?r.querySelectorAll('input[type=date]'):[]).forEach(enh);if(r.nodeName=='INPUT'&&r.type=='date')enh(r)}
 var st=document.createElement('style');st.textContent='.dtw{position:relative;display:block;min-width:0}.dtv{display:block;box-sizing:border-box;width:100%;padding:9px 11px;border:1px solid var(--line,#ddd);border-radius:10px;background:#fff;color:var(--ink,#111);font:inherit;direction:ltr;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.4em}.dtv.em{color:#999;font-size:.85em}.dtv.ds{background:#f1efe8;color:#777}input.dtx{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0;margin:0!important;padding:0!important;border:0!important;cursor:pointer}';document.head.appendChild(st);
 var q=0;function run(){q=0;walk(document.body);scan(document.body);document.querySelectorAll('input.dtx').forEach(sync)}
