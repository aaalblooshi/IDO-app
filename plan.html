<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--r2:#fdecee;--am:#b7791f;--am2:#fdf3df;--ch:#23272b;--fnt:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:14.5px/1.6 var(--fnt);background:radial-gradient(800px 380px at 100% -60px,#dcefe3 0,transparent 62%),radial-gradient(700px 340px at 0 -80px,#fbe4e6 0,transparent 58%),var(--bg);background-attachment:fixed;min-height:100vh}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}@media(max-width:480px){.hgrp .hbtn{padding:6px 9px;font-size:12.5px}}.hbtn{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}.hbtn[hidden]{display:none}
.fwr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}.fwr:last-child{border:0}.fwr .fn{flex:1;min-width:120px;overflow-wrap:anywhere}.fwe{display:none;width:100%}.fwe.on{display:block}.fwe label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13.5px}.fwe label input{width:auto}
.hin{max-width:900px;margin:0 auto;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}

 const maxD=(d.levels||3)-1;
 ts.forEach(x=>{if(x.p&&(!by[x.p]||x.p==x.id))x.p='';if(!Array.isArray(x.dep))x.dep=[]});
 const kids={};ts.forEach(x=>{(kids[x.p||'']=kids[x.p||'']||[]).push(x)});
 const out=[],seen={};M={};
 const walk=(p,dp,pw)=>{(kids[p]||[]).forEach((x,i)=>{if(seen[x.id])return;seen[x.id]=1;x.p=p;const w=pw?pw+'.'+(i+1):String(i+1);M[x.id]={x,d:dp,w,kids:kids[x.id]||[],par:p?by[p]:null};out.push(x);walk(x.id,dp+1,w)})};

 ts.forEach(x=>{if(!seen[x.id]){x.p='';M[x.id]={x,d:0,w:String(out.length+1),kids:[],par:null};out.push(x)}});

  let idx=ts.length;if(after){idx=ts.indexOf(after)+1;while(idx<ts.length&&isDesc(ts[idx],after.id))idx++}else if(par){const pi=ts.indexOf(byId(par));idx=pi+1;while(idx<ts.length&&isDesc(ts[idx],par))idx++}

function subtree(id){const ts=T(),i=ts.findIndex(x=>x.id==id);let j=i+1;while(j<ts.length&&isDesc(ts[j],id))j++;return[i,j]}
function moveTask(id,dir){mut(()=>{const ts=T(),x=byId(id),sib=ts.filter(z=>(z.p||'')==(x.p||'')),k=sib.indexOf(x),o=sib[k+dir];

   const par=x.p?byId(x.p):null;if(!par)return msg(t(dir<0?'pl_atTop':'pl_atBot'));
   const [i,j]=subtree(id),blk=ts.splice(i,j-i);x.p=par.p||'';const [pi,pj]=subtree(par.id);ts.splice(dir<0?pi:pj,0,...blk);return}
  const [i,j]=subtree(id),blk=ts.splice(i,j-i);let at;const [oi,oj]=subtree(o.id);at=dir<0?oi:oj;ts.splice(at,0,...blk)},true)}
function indentTask(id){const ts=T(),x=byId(id),sib=ts.filter(z=>(z.p||'')==(x.p||'')),k=sib.indexOf(x);if(k<1)return msg(t('pl_noIndent'));

 const path=cr.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+ext;

 if(up.error)throw up.error;
 const ins=await sb.from('plan_attachments').insert({cr_id:cr.id,title:title,path:path,size:f.size,mime:f.type||'',uploaded_by:me.id});
