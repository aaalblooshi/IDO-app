<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--r2:#fdecee;--am:#b7791f;--am2:#fdf3df;--ch:#23272b;--fnt:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:14.5px/1.6 var(--fnt);background:radial-gradient(800px 380px at 100% -60px,#dcefe3 0,transparent 62%),radial-gradient(700px 340px at 0 -80px,#fbe4e6 0,transparent 58%),var(--bg);background-attachment:fixed;min-height:100vh}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}@media(max-width:480px){.hgrp .hbtn{padding:6px 9px;font-size:12.5px}}.hbtn{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}.hbtn[hidden]{display:none}
.fwr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}.fwr:last-child{border:0}.fwr .fn{flex:1;min-width:120px;overflow-wrap:anywhere}.fwe{display:none;width:100%}.fwe.on{display:block}.fwe label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13.5px}.fwe label input{width:auto}
.hin{max-width:900px;margin:0 auto;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

 const lo=Math.min(...lv.map(x=>dn(x.s))),hi=Math.max(...lv.map(x=>dn(x.e)))+400,IX={};let c=0;
 for(let n=lo;n<=hi;n++){IX[n]=c;if(!isOff(n)&&!isHol(n))c++}
 const wi=n=>{if(IX[n]!=null)return IX[n];return n<lo?0:c};
 const ES={},EF={},du={};lv.forEach(x=>{ES[x.id]=wi(nextWork(dn(x.s)));du[x.id]=Math.max(1,durOf(x));EF[x.id]=ES[x.id]+du[x.id]});

 for(let i=order.length-1;i>=0;i--){const x=byId(order[i]),id=x.id;let lf=end,ls=null;
  (mp[id]||[]).forEach(e=>{if(!ids.has(e.to))return;const l=e.l;
   if(e.y=='FS')lf=Math.min(lf,LS[e.to]-l);else if(e.y=='FF')lf=Math.min(lf,LF[e.to]-l);else if(e.y=='SS'){const v=LS[e.to]-l;ls=ls==null?v:Math.min(ls,v)}else{const v=LF[e.to]-l;ls=ls==null?v:Math.min(ls,v)}});
  let s2=lf-du[id];if(ls!=null&&ls<s2)s2=ls;LS[id]=s2;LF[id]=s2+du[id]}

function smartChecks(){if(!S.tree)return [];const out=[],st=startDay(),sc=schedule(S.tree,st),en=dn(cr.data.edate);
 if(sc.hi!=null&&!isNaN(en)&&sc.hi>en)out.push(['🏁',L('الخطة المقترحة تنتهي '+fmt(sc.hi)+' بعد نهاية الميثاق '+fmt(en)+' بـ '+ad(wdays(en+1,sc.hi))+' يوم عمل.','The plan ends '+fmt(sc.hi)+', after the charter end '+fmt(en)+'.'),'fit',L('ملاءمة المدد','Fit durations')]);
 if(sc.lo!=null&&sc.lo<st)out.push(['⏪',L('بعض المهام تبدأ قبل '+fmt(st)+' (بداية '+(MG()?'المهام الجديدة':'الخطة')+') لأن موعد أحد المتطلبات التي أدخلتها في المساعد قريب جدًا ولا يكفي لإنجاز خطواته.','Some tasks start before '+fmt(st)+' because a requirement date you entered is too close.'),'','']);
 (S.items||[]).forEach((it,ix)=>{if(!S.qa||!S.qa[it.k])return;const f=feas(it);if(f&&!f.ok)out.push(['⚠️',feasWhy(it,f),'itfix:'+ix,L('اعتماد الموعد الواقعي','Use realistic date')])});
 const lf=[];const w=(a)=>a.forEach(n=>{if(n.off)return;if(n.ch)w(n.ch);else lf.push(n)});w(S.tree);
 const noW=lf.filter(n=>!n.w&&!n.ms).length;if(noW)out.push(['👤',L(arC(noW,['مهمة واحدة','مهمتان','مهام','مهمة'],['task','tasks'])+' بلا مكلّف. اضغط 👤 بجانب أي مهمة لتعيينه.',noW+' tasks without an assignee.'),'','']);
 const byW={};lf.forEach(n=>{if(!n.w||n.ms)return;const r=sc.R.get(n);if(r)(byW[n.w]=byW[n.w]||[]).push(r)});
 Object.keys(byW).forEach(u=>{const R=byW[u];let mx=0,at=null;R.forEach(a=>{const c=R.filter(b=>b[0]<=a[0]&&b[1]>=a[0]).length;if(c>mx){mx=c;at=a[0]}});if(mx>=3){const nm=users[u]?users[u].full_name:'';out.push(['🔥',L('«'+nm+'» مكلّف بـ '+ad(mx)+' مهام في نفس الوقت (حول '+fmt(at)+'). وزّع بعضها أو باعد بينها.','“'+nm+'” has '+mx+' overlapping tasks around '+fmt(at)+'.'),'',''])}});
 if(MG()){const ex=keepT().filter(t=>!t.p).map(t=>t.n);const dup=S.tree.filter(n=>!n.off&&ex.some(e=>nk(e)==nk(n.n)));if(dup.length)out.push(['♻️',L('مراحل موجودة مسبقًا في خطتك وستتكرر: '+dup.map(n=>'«'+n.n+'»').join('، '),'Phases already in your plan: '+dup.map(n=>n.n).join(', ')),'dupoff',L('استبعادها','Exclude them')])}
 sc.E.forEach(e=>{const c=calNote(e.s);if(c&&(!e.auto||e.main||String(e.i)[0]=='i'))out.push(['📅',L('«'+e.n.replace(/^◆\s*/,'').replace(/^جاهزية: /,'')+'» في '+fmt(e.s)+': ','“'+e.n+'” on '+fmt(e.s)+': ')+c.replace(/^\S+\s/,''),'',''])});
 Object.keys(byW).forEach(u=>{const R2=byW[u];const lo=Math.min(...R2.map(r=>r[0])),hi=Math.max(...R2.map(r=>r[1])),X=extLoad(u,lo,hi),tot=X.reduce((a,b)=>a+b[1],0);if(tot>=3){const nm=users[u]?users[u].full_name:'';out.push(['🧭',L('لدى «'+nm+'» '+ad(tot)+' مهمة مفتوحة في مشاريع أخرى خلال نفس الفترة: '+X.slice(0,3).map(z=>z[0]+' ('+ad(z[1])+')').join('، ')+'. تأكد من توفره أو وزّع العمل.','“'+nm+'” has '+tot+' open tasks in other projects in the same period.'),'',''])}});
 const hasMs=lf.some(n=>n.ms)||sc.E.length;if(!hasMs&&S.det!='full')out.push(['◆',L('لا توجد معالم لقياس التقدم. يُنصح بمعلم عند نهاية كل مرحلة.','No milestones to measure progress.'),'msful',L('إضافة المعالم','Add milestones')]);
