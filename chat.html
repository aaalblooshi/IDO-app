<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--ch:#23272b;--fnt:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:15px/1.65 var(--fnt);background:var(--bg)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.top b{font-size:16px}
main{max-width:980px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
h2{margin:0 0 4px;font-size:17px}h2 small{display:block;font-weight:400;color:var(--mut);font-size:13px}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;color:var(--ink)}
button.p{background:var(--g);border-color:var(--g);color:#fff}button.r{color:var(--r);border-color:#f3b9be}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:430px){.g2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--g2);color:var(--g);font-size:12px;font-weight:700}
#toast{position:fixed;inset-inline:14px;bottom:18px;background:var(--ch);color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:9;text-align:center}
.lock{max-width:420px;margin:60px auto;text-align:center}

.pwr{position:relative}.eye{position:absolute;right:6px;left:auto;top:50%;transform:translateY(-50%);border:0!important;background:none!important;font-size:19px;padding:4px 8px!important;line-height:1}input[type=password]{direction:ltr;text-align:left;padding-right:48px!important;padding-left:12px!important}
.ur{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}

<div class="top"><button onclick="location.href='index.html'">⬅ <span data-i="home"></span></button><b data-i="title"></b><span class="hgrp"><a class="hbtn" href="account.html" data-i="hacc"></a><button class="hbtn" id="lb" onclick="toggleLang()">EN</button><button class="hbtn" data-i="hso" onclick="sb.auth.signOut().then(()=>{location.href='./'})"></button></span></div>
<main id="app"></main><div id="toast"></div>
<script>
const SUPABASE_URL="https://nbrunwkcncgwvzynhzjo.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5icnVud2tjbmNnd3Z6eW5oempvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTA1MjksImV4cCI6MjEwNzk2NjUyOX0.Pp4gqszu_98Lnt_ZnLKl1IG7048l_LiyQI-bQM7bwA8";
let sb=null;try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let lang='ar';try{lang=localStorage.getItem('lang')||'ar'}catch(_){}
const t=k=>(D[k]||[k,k])[lang=='ar'?0:1];
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function toggleLang(){lang=lang=='ar'?'en':'ar';try{localStorage.setItem('lang',lang)}catch(_){}draw()}
function gate(k){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('app').innerHTML='<div class="card lock"><p>'+t(k)+'</p><button class="p" onclick="location.href=\'cr.html\'">'+t('signin')+'</button></div>'}
async function run(fn,ok){try{await fn();toast(ok||t('saved'))}catch(e){toast(t('err')+(e.message||e))}}
const D={hacc:['👤 حسابي','👤 My account'],hso:['تسجيل الخروج','Sign out'],home:['الرئيسية','Home'],title:['التواصل والأفكار','Chat & ideas'],
 needLogin:['سجّل الدخول أولًا.','Please sign in first.'],off:['خاصية التواصل غير مفعّلة حاليًا. يفعّلها الأدمن من الإعدادات.','Chat is currently disabled. An admin can enable it in Settings.'],signin:['تسجيل الدخول','Sign in'],
 err:['تعذّر التنفيذ: ','Failed: '],saved:['تم','Done'],tm:['الرسائل','Messages'],ti:['لوحة الأفكار','Ideas board'],
 srch:['ابحث عن زميل…','Find a colleague…'],pick:['اختر زميلًا لبدء المحادثة','Pick a colleague to start chatting'],send:['إرسال','Send'],ph:['اكتب رسالة…','Type a message…'],
 back:['رجوع','Back'],noc:['لا توجد رسائل بعد.','No messages yet.'],
 kidea:['💡 فكرة','💡 Idea'],knote:['📝 ملاحظة','📝 Note'],kkudos:['🌟 شكر وتقدير','🌟 Kudos'],post:['نشر','Post'],pph:['شارك فكرة أو ملاحظة أو شكرًا لزميل…','Share an idea, note or kudos…'],
 pcode:['رمز مشروع (اختياري)','Project code (optional)'],pin:['تثبيت','Pin'],unpin:['إلغاء التثبيت','Unpin'],del:['حذف','Delete'],pinned:['📌 مثبّت','📌 Pinned'],noi:['لا توجد منشورات بعد، كن أول من يشارك.','No posts yet — be the first.'],ask:['حذف هذا المنشور؟','Delete this post?']};
let ME=null,UN={},ON=false,TAB='m',PEER=null,MSGS=[],UNR={},POSTS=[],LK={},KF='',Q='';
const nm=id=>(UN[id]||{}).full_name||'—';
const ft=x=>{const d=new Date(x),n=new Date(),a=lang=='ar';return d.toDateString()==n.toDateString()?d.toLocaleTimeString(a?'ar':'en-GB',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString(a?'ar':'en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(a?'ar':'en-GB',{hour:'2-digit',minute:'2-digit'})};
async function load(){
 if(!sb)return gate('needLogin');
 const {data:{session}}=await sb.auth.getSession();if(!session)return gate('needLogin');
 const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();ME=p;
 const {data:us}=await sb.from('profiles').select('id,full_name,job_title');(us||[]).forEach(u=>UN[u.id]=u);
 const r=await sb.rpc('chat_on');ON=!!r.data;
 try{const h=location.hash.match(/to=([0-9a-f-]{36})/);if(h&&UN[h[1]]){PEER=h[1]}}catch(_){}
 await refresh();setInterval(()=>{if(document.visibilityState=='visible'&&!document.activeElement.matches('textarea:focus,#q'))refresh(true)},20000)}
async function refresh(quiet){
 if(!ON)return draw();
 const [u,m,p,l]=await Promise.all([sb.rpc('chat_unread'),sb.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(400),sb.from('idea_posts').select('*').order('created_at',{ascending:false}).limit(150),sb.from('idea_likes').select('*')]);
 UNR={};(u.data||[]).forEach(x=>UNR[x.from_user]=+x.n);MSGS=(m.data||[]).reverse();POSTS=p.data||[];LK={};(l.data||[]).forEach(x=>(LK[x.post_id]=LK[x.post_id]||[]).push(x.user_id));
 if(PEER&&UNR[PEER]){await sb.rpc('chat_read',{p_from:PEER});delete UNR[PEER]}
 if(quiet&&TAB=='m'&&PEER){const b=$('msgs');if(b){const near=b.scrollHeight-b.scrollTop-b.clientHeight<60;b.innerHTML=bubbles();if(near)b.scrollTop=b.scrollHeight;return}}
 draw()}
function draw(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';$('lb').textContent=lang=='ar'?'EN':'ع';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 if(!ON){$('app').innerHTML=`<div class="card lock"><p>${t('off')}</p></div>`;return}
 const tot=Object.values(UNR).reduce((a,b)=>a+b,0);
 const tabs=[['m',t('tm')+(tot?` <span class="bd">${tot}</span>`:'')],['i',t('ti')]].map(([k,l])=>`<button class="${TAB==k?'p':''}" onclick="TAB='${k}';draw()">${l}</button>`).join('');
 $('app').innerHTML=`<div class="row" style="margin:0 0 10px">${tabs}</div>`+(TAB=='m'?vChat():vIdeas());
 const b=$('msgs');if(b)b.scrollTop=b.scrollHeight}
function peers(){const last={};MSGS.forEach(m=>{const o=m.from_user==ME.id?m.to_user:m.from_user;last[o]=m});
 const q=Q.trim().toLowerCase();let ids=Object.keys(UN).filter(i=>i!=ME.id&&(!q||(nm(i)+' '+(UN[i].job_title||'')).toLowerCase().includes(q)));
 ids.sort((a,b)=>(last[b]?+new Date(last[b].created_at):0)-(last[a]?+new Date(last[a].created_at):0)||nm(a).localeCompare(nm(b)));return {ids,last}}
function bubbles(){const L=MSGS.filter(m=>(m.from_user==PEER&&m.to_user==ME.id)||(m.from_user==ME.id&&m.to_user==PEER));
 return L.length?L.map(m=>`<div class="bb2 ${m.from_user==ME.id?'me':''}"><div>${esc(m.body).replace(/\n/g,'<br>')}</div><small>${ft(m.created_at)}${m.from_user==ME.id&&m.read_at?' ✓✓':''}</small></div>`).join(''):`<div class="mut" style="text-align:center;margin-top:30px">${t('noc')}</div>`}
function vChat(){const {ids,last}=peers();
 const list=`<div class="pl ${PEER?'hm':''}"><input id="q" placeholder="${t('srch')}" value="${esc(Q)}" oninput="Q=this.value;draw();const q=$('q');q.focus();q.setSelectionRange(99,99)">${ids.map(i=>`<div class="pr ${PEER==i?'on':''}" onclick="openP('${i}')"><div class="av">${esc((nm(i)||'?').trim()[0])}</div><div class="tx"><b>${esc(nm(i))}</b><span>${last[i]?esc(last[i].body.slice(0,40)):esc(UN[i].job_title||'')}</span></div>${UNR[i]?`<span class="bd">${UNR[i]}</span>`:''}</div>`).join('')}</div>`;
 const pane=PEER?`<div class="cp"><div class="ch2"><button class="bk" onclick="PEER=null;draw()">${lang=='ar'?'→':'←'}</button><b>${esc(nm(PEER))}</b><span class="mut">${esc((UN[PEER]||{}).job_title||'')}</span></div><div id="msgs" class="msgs">${bubbles()}</div><div class="cin"><textarea id="mt" rows="1" placeholder="${t('ph')}" onkeydown="if(event.key=='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendM()}"></textarea><button class="p" onclick="sendM()">${t('send')}</button></div></div>`:`<div class="cp em"><div class="mut">${t('pick')}</div></div>`;
 return `<div class="chat">${list}${pane}</div>`}
async function openP(i){PEER=i;if(UNR[i]){await sb.rpc('chat_read',{p_from:i});delete UNR[i]}draw();const x=$('mt');if(x&&innerWidth>899)x.focus()}
async function sendM(){const x=$('mt'),v=x.value.trim();if(!v||!PEER)return;x.disabled=true;
 const {error}=await sb.rpc('chat_send',{p_to:PEER,p_body:v});x.disabled=false;if(error)return toast(t('err')+error.message);x.value='';await refresh();const y=$('mt');if(y)y.focus()}
function vIdeas(){
 const L=POSTS.filter(p=>!KF||p.kind==KF).sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.created_at)-new Date(a.created_at)));
 const K={idea:t('kidea'),note:t('knote'),kudos:t('kkudos')};
 return `<div class="card"><textarea id="ip" rows="3" placeholder="${t('pph')}"></textarea><div class="row"><select id="ik" style="width:auto">${Object.keys(K).map(k=>`<option value="${k}">${K[k]}</option>`).join('')}</select><input id="ic" dir="ltr" style="width:160px" placeholder="${t('pcode')}"><button class="p" onclick="postI()">${t('post')}</button></div></div>
 <div class="row" style="margin:0 0 8px"><button class="${KF?'':'p'}" onclick="KF='';draw()">${lang=='ar'?'الكل':'All'}</button>${Object.keys(K).map(k=>`<button class="${KF==k?'p':''}" onclick="KF='${k}';draw()">${K[k]}</button>`).join('')}</div>`+
 (L.map(p=>{const lk=LK[p.id]||[],me=lk.includes(ME.id);return `<div class="card po ${p.pinned?'pin':''}"><div class="mut">${p.pinned?t('pinned')+' · ':''}${K[p.kind]||''} · <b>${esc(nm(p.author))}</b> · ${ft(p.created_at)}${p.pcode?` · <span dir="ltr">${esc(p.pcode)}</span>`:''}</div><div style="margin:6px 0;white-space:pre-wrap">${esc(p.body)}</div><div class="row" style="margin:0"><button class="${me?'p':''}" onclick="likeI(${p.id})">👍 ${lk.length||''}</button>${ME.role=='admin'?`<button onclick="pinI(${p.id},${!p.pinned})">${p.pinned?t('unpin'):t('pin')}</button>`:''}${(ME.role=='admin'||p.author==ME.id)?`<button class="r" onclick="delI(${p.id})">${t('del')}</button>`:''}</div></div>`}).join('')||`<div class="mut">${t('noi')}</div>`)}
const postI=async()=>{const v=$('ip').value.trim();if(!v)return;const {error}=await sb.rpc('idea_post',{p_body:v,p_kind:$('ik').value,p_pcode:$('ic').value||null});if(error)return toast(t('err')+error.message);await refresh()};
const likeI=async id=>{const {error}=await sb.rpc('idea_like',{p_id:id});if(error)return toast(t('err')+error.message);await refresh()};
const pinI=async(id,on)=>{const {error}=await sb.rpc('idea_pin',{p_id:id,p_on:on});if(error)return toast(t('err')+error.message);await refresh()};
const delI=async id=>{if(!confirm(t('ask')))return;const {error}=await sb.rpc('idea_delete',{p_id:id});if(error)return toast(t('err')+error.message);await refresh()};
load();

</script><script>/*nightnav*/
(function(){
 var st=document.createElement('style');st.textContent='body #gnav{background:#fff;border-top:3px solid var(--gold,#BF9849)}body #gnav .gnb{color:#5b6b7b}body #gnav .gnb.on{color:var(--g,#1d5f8a);background:var(--g2,#e6f2f9);box-shadow:inset 0 3px 0 var(--blue,#3EA3DC)}body #gnav .gnb.ico{flex:0 0 46px}body #gnav .gnb.ico span{display:none}body #gnav .gnb#nmb{border:0;background:none;font:inherit;cursor:pointer}body #gnav .gnb{position:relative}body #gnav .gnb .cb{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;padding:0 5px;border-radius:99px;background:#d1101d;color:#fff;font:800 11px/16px Cairo,sans-serif;text-align:center}';document.head.appendChild(st);
 var cur=(location.pathname.split('/').pop()||'index.html').replace('.html','');
 function perms(n){try{if(typeof sb==='undefined'||!sb)return;sb.rpc('my_perms').then(function(r){var pg=r&&r.data&&r.data.pages;if(!pg)return;
   if(n)n.querySelectorAll('a.gnb[href]').forEach(function(a){var f=(a.getAttribute('href')||'').replace('.html','');if(pg[f]===false)a.style.display='none'});
   if(pg[cur]===false&&cur!='index'&&cur!='account'&&cur!='help')location.replace('index.html')}).catch(function(){})}catch(e){}}
 function chat(n){try{if(typeof sb==='undefined'||!sb||document.getElementById('chb'))return;sb.rpc('chat_on').then(function(r){if(!r||r.data!==true||document.getElementById('chb'))return;
   var a=document.createElement('a');a.className='gnb ico'+(cur=='chat'?' on':'');a.id='chb';a.href='chat.html';a.innerHTML='<i>💬</i><span>chat</span>';n.insertBefore(a,document.getElementById('nmb'));
   sb.rpc('chat_unread').then(function(u){var c=((u&&u.data)||[]).reduce(function(x,y){return x+(+y.n||0)},0);if(c){var b=document.createElement('b');b.className='cb';b.textContent=c;a.appendChild(b)}})}).catch(function(){})}catch(e){}}
 function add(){var n=document.getElementById('gnav');if(!n||document.getElementById('nmb'))return !!n;var ar=true;try{ar=(localStorage.getItem('lang')||'ar')=='ar'}catch(e){}
  var b=document.createElement('a');b.className='gnb ico';b.id='nmb';b.href='#';b.title=ar?'الوضع الليلي':'Night mode';b.innerHTML='<i>🌙</i><span>night</span>';
  b.onclick=function(e){e.preventDefault();var on=document.documentElement.classList.toggle('nm');try{localStorage.setItem('nm',on?'1':'0')}catch(x){}};n.appendChild(b);chat(n);perms(n);return true}
 if(!add()){var mo=new MutationObserver(function(){if(add())mo.disconnect()});mo.observe(document.body,{childList:true,subtree:true});setTimeout(function(){mo.disconnect()},8000);perms(null)}
})();
</script>
