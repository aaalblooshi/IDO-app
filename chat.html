<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--ch:#23272b;--fnt:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:15px/1.65 var(--fnt);background:var(--bg)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.top b{font-size:16px}
main{max-width:980px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
h2{margin:0 0 4px;font-size:17px}h2 small{display:block;font-weight:400;color:var(--mut);font-size:13px}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;color:var(--ink)}
button.p{background:var(--g);border-color:var(--g);color:#fff}button.r{color:var(--r);border-color:#f3b9be}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:430px){.g2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--g2);color:var(--g);font-size:12px;font-weight:700}

#toast{position:fixed;inset-inline:14px;bottom:80px;background:var(--ch);color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:99;text-align:center}
.lock{max-width:420px;margin:60px auto;text-align:center}
main{max-width:1100px;padding:10px 12px 0}
.chat{display:grid;grid-template-columns:320px 1fr;gap:10px;height:calc(100vh - 80px);min-height:420px}
.rail,.conv{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.rh{padding:10px;border-bottom:1px solid var(--line)}.rl{flex:1;overflow:auto;padding:4px 6px 10px}

function drawPinbar(){const el=$('pinbar');if(!el)return;const L=MSGS.filter(m=>m.pinned&&!m.deleted);const m=L[L.length-1];
 el.innerHTML=m?`<div class="pb" onclick="jump(${m.id})">📌 <b>${esc(nm(m.from_user))}:</b> ${esc((m.body||'').slice(0,90))||'📎'}${L.length>1?` <span class="mut">(+${L.length-1})</span>`:''}</div>`:''}
function jump(id){PANEL=null;drawSide();const e=document.querySelector('[data-m="'+id+'"]');if(e){e.scrollIntoView({block:'center',behavior:'smooth'});e.classList.add('fl2');setTimeout(()=>e.classList.remove('fl2'),1600)}}
function msgHtml(m,prev){const mine=m.from_user==ME.id,grp=CUR.t=='ch'&&!mine,first=!prev||prev.from_user!=m.from_user||(new Date(m.created_at)-new Date(prev.created_at))>3e5||new Date(prev.created_at).toDateString()!=new Date(m.created_at).toDateString();
 let tx=esc(m.body||'').replace(/\n/g,'<br>');const refs=m.refs||[];
 refs.forEach(r=>{if(r.tk){const e=esc(r.tk);tx=tx.split(e).join('<b class="tk">'+e+'</b>')}});
 const chips=refs.filter(r=>r.k!='user').map(r=>{const h=refHref(r);return `<a class="rf" ${h?`href="${h}" target="_top"`:''}>${KI[r.k]||'🔗'} ${esc(r.label||'')}</a>`}).join('');
 const atts=(m.attachments||[]).map(a=>/^image\//.test(a.type||'')?`<img class="ai" data-p="${esc(a.path)}" alt="${esc(a.name)}" onclick="openAtt('${esc(a.path)}')">`:`<a class="fl" href="#" onclick="openAtt('${esc(a.path)}');return false">📎 ${esc(a.name)}${a.size?' <small>'+sz(a.size)+'</small>':''}</a>`).join('');
 const body=m.deleted?`<i class="mut">${T2('تم حذف هذه الرسالة','This message was deleted')}</i>`:`${tx?`<div class="tx2">${tx}</div>`:''}${chips?`<div class="rfs">${chips}</div>`:''}${atts?`<div class="ats">${atts}</div>`:''}`;
 const act=m.deleted?'':`<div class="ac"><button onclick="pinMsg(${m.id},${!m.pinned})">📌 ${m.pinned?T2('إلغاء التثبيت','Unpin'):T2('تثبيت','Pin')}</button><button onclick="cpMsg(${m.id})">⧉ ${T2('نسخ','Copy')}</button>${mine||ME.role=='admin'?`<button class="r" onclick="delMsg(${m.id})">🗑 ${T2('حذف','Delete')}</button>`:''}</div>`;
 return (!prev||new Date(prev.created_at).toDateString()!=new Date(m.created_at).toDateString()?`<div class="dsep"><span>${fmtD(m.created_at)}</span></div>`:'')+
 `<div class="mg ${mine?'me':''} ${first?'first':''}" data-m="${m.id}" onclick="selMsg(${m.id},event)">${grp?`<div class="av sm">${first?esc(ini(nm(m.from_user))):''}</div>`:''}<div class="bb ${SEL==m.id?'sel':''}">${grp&&first?`<div class="nm">${esc(nm(m.from_user))}</div>`:''}${m.pinned?'<span class="pn">📌</span>':''}${body}<small>${fmtT(m.created_at)}${mine&&CUR.t=='dm'&&m.read_at?' ✓✓':''}</small>${SEL==m.id?act:''}</div></div>`}
async function drawMsgs(scroll){const b=$('msgs');if(!b||!CUR)return;const near=scroll||b.scrollHeight-b.scrollTop-b.clientHeight<80;
 b.innerHTML=MSGS.length?MSGS.map((m,i)=>msgHtml(m,MSGS[i-1])).join(''):`<div class="empty"><div style="font-size:38px">${CUR.t=='dm'?'👋':'💬'}</div><b>${T2('ابدأ المحادثة','Start the conversation')}</b><div class="mut">${CUR.pcode?T2('يرى هذه الرسائل كل أعضاء المشروع.','All project members see these messages.'):''}</div></div>`;
 if(near)b.scrollTop=b.scrollHeight;
 const imgs=[...b.querySelectorAll('img.ai')];const need=imgs.map(i=>i.dataset.p).filter(p=>!URLC[p]);
 if(need.length){try{const r=await sb.storage.from('chat').createSignedUrls(need,3600);(r.data||[]).forEach(x=>{if(x.signedUrl)URLC[x.path]=x.signedUrl})}catch(_){}}
 imgs.forEach(i=>{if(URLC[i.dataset.p])i.src=URLC[i.dataset.p]});if(near)b.scrollTop=b.scrollHeight}
function selMsg(id,e){if(e.target.closest('a,button,img'))return;SEL=SEL==id?null:id;drawMsgs(false)}
async function openAtt(p){try{let u=URLC[p];if(!u){const r=await sb.storage.from('chat').createSignedUrl(p,3600);u=r.data&&r.data.signedUrl;URLC[p]=u}if(u)window.open(u,'_blank')}catch(e){toast(e.message||e)}}
async function pinMsg(id,on){const r=await sb.rpc('chat_pin_msg',{p_id:id,p_on:on});if(r.error)return toast(r.error.message);SEL=null;SIG='';await loadMsgs(false)}
async function delMsg(id){if(!confirm(T2('حذف هذه الرسالة؟','Delete this message?')))return;const r=await sb.rpc('chat_delete_msg',{p_id:id});if(r.error)return toast(r.error.message);SEL=null;SIG='';await loadMsgs(false)}
function cpMsg(id){const m=MSGS.find(x=>x.id==id);if(m){try{navigator.clipboard.writeText(m.body||'');toast(T2('تم النسخ','Copied'))}catch(_){}}SEL=null;drawMsgs(false)}
/* ---- المحرّر ---- */
function drawCmp(){const el=$('cmp');if(!el||!CUR)return;const canRef=!!CUR.pcode,canAt=CUR.t=='ch';
 el.innerHTML=`<div id="qref"></div><div id="achips" class="achips"></div><div id="menpop"></div><div class="cin"><button class="ib" title="${T2('إرفاق ملف','Attach file')}" onclick="$('fi').click()">📎</button>${canRef?`<button class="ib" title="${T2('إشارة إلى مهمة أو طلب أو أي عنصر في المشروع','Mention a task, request or any project item')}" onclick="menBtn('#')">#</button>`:''}${canAt?`<button class="ib" title="${T2('إشارة إلى شخص','Mention a person')}" onclick="menBtn('@')">@</button>`:''}<textarea id="mt" rows="1" placeholder="${T2('اكتب رسالة…  ( # لمهمة أو طلب · @ لشخص )','Type a message…  ( # task/request · @ person )')}"></textarea><button class="p snd" onclick="sendM()">${T2('إرسال','Send')}</button></div><input type="file" id="fi" multiple style="display:none">`;
 const ta=$('mt');ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,130)+'px';menCheck()};
 ta.onkeydown=e=>{if(MEN&&['ArrowDown','ArrowUp','Enter','Escape','Tab'].includes(e.key)){e.preventDefault();menKey(e.key);return}if(e.key=='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendM()}};
 $('fi').onchange=e=>upFiles([...e.target.files]).then(()=>{e.target.value=''});
 ta.addEventListener('paste',e=>{const f=[...(e.clipboardData||{}).files||[]];if(f.length){e.preventDefault();upFiles(f)}});
 drawChips();drawQref()}
function drawQref(){const el=$('qref');if(!el)return;const p=R0.split(':');if(!R0||p.length<3||!CUR||!CUR.pcode||REFS.some(r=>r.k==p[0]&&String(r.id)==p[1])){el.innerHTML='';return}
 const lb=decodeURIComponent(p.slice(2).join(':'));el.innerHTML=`<div class="qr"><span>${T2('أشر إلى هذا الطلب:','Mention this record:')} <b>${esc(lb)}</b></span><button onclick="addRef({k:'${p[0]}',id:'${p[1]}',label:${JSON.stringify(lb).replace(/"/g,'&quot;')}})">＋ ${T2('إضافة إشارة','Add mention')}</button></div>`}
function drawChips(){const el=$('achips');if(!el)return;el.innerHTML=ATT.map((a,i)=>`<span class="ac2">📎 ${esc(a.name)} <small>${sz(a.size||0)}</small><button onclick="ATT.splice(${i},1);drawChips()">✕</button></span>`).join('')}
async function upFiles(fs){if(!CUR||!fs.length)return;const base=CUR.t=='ch'?'ch/'+CUR.id:'dm/'+[ME.id,CUR.id].sort().join('_');
 for(const f of fs){if(f.size>10485760){toast(T2('الملف أكبر من 10 م.ب: ','File over 10 MB: ')+f.name);continue}if(ATT.length>=10)break;
  const ext=(f.name.match(/\.[A-Za-z0-9]{1,8}$/)||[''])[0],path=base+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+ext;
  const {error}=await sb.storage.from('chat').upload(path,f,{contentType:f.type||'application/octet-stream'});if(error){toast(T2('تعذّر رفع الملف: ','Upload failed: ')+error.message);continue}
  ATT.push({path,name:f.name,size:f.size,type:f.type||''});drawChips()}}
function addRef(r){const ta=$('mt');if(!REFS.some(x=>x.k==r.k&&String(x.id)==String(r.id))){r.tk=(r.k=='user'?'@':'#')+String(r.label).replace(/\s+/g,'_');REFS.push(r)}else r.tk=REFS.find(x=>x.k==r.k&&String(x.id)==String(r.id)).tk;
 const v=ta.value;ta.value=(v&&!/\s$/.test(v)?v+' ':v)+r.tk+' ';ta.focus();drawQref();ta.dispatchEvent(new Event('input'))}
async function menItems(mode){if(mode=='@'){const ids=CUR.pcode?MEM.map(m=>m.user_id):Object.keys(UN);return ids.filter(i=>i!=ME.id).map(i=>({k:'user',id:i,label:nm(i),sub:(UN[i]||{}).job_title||''}))}
 if(!CUR.pcode)return [];if(!MENC[CUR.pcode]){try{const r=await sb.rpc('chat_mentions',{p_pcode:CUR.pcode});MENC[CUR.pcode]=r.error?[]:(r.data||[])}catch(_){MENC[CUR.pcode]=[]}}return MENC[CUR.pcode]}
function menBtn(mode){const ta=$('mt');ta.focus();const v=ta.value;ta.value=v+(v&&!/\s$/.test(v)?' ':'')+mode;ta.dispatchEvent(new Event('input'))}
async function menCheck(){const ta=$('mt'),pos=ta.selectionStart,m=/(^|\s)([#@])([^\s#@]*)$/.exec(ta.value.slice(0,pos));
 if(!m){MEN=null;$('menpop').innerHTML='';return}
 const mode=m[2],q=m[3];if(mode=='#'&&!CUR.pcode||mode=='@'&&CUR.t!='ch'){MEN=null;$('menpop').innerHTML='';return}
 const all=await menItems(mode);MEN={mode,q,from:pos-q.length-1,pos,all,i:0};menDraw()}
function menList(){const q=norm((MEN.q||'').replace(/_/g,' '));let L=MEN.all.filter(x=>!q||norm(x.label+' '+(x.sub||'')+' '+(x.k||'')).includes(q));
 if(MEN.mode=='#'){const ord={task:0,cr:1,plan:2,charter:3,closure:4};L=L.slice().sort((a,b)=>(ord[a.k]??9)-(ord[b.k]??9))}return L.slice(0,30)}
function menDraw(){const el=$('menpop');if(!MEN){el.innerHTML='';return}const L=MEN.list=menList();if(MEN.i>=L.length)MEN.i=0;
 const KN={task:T2('مهمة','Task'),plan:T2('خطة','Plan'),charter:T2('ميثاق','Charter'),cr:T2('طلب تغيير','Change req.'),closure:T2('تقرير ختامي','Closure'),user:T2('شخص','Person')};
 el.innerHTML=L.length?`<div class="mp">${L.map((x,i)=>`<div class="mi ${i==MEN.i?'on':''}" onmousedown="event.preventDefault();menPick(${i})"><span class="mk">${KI[x.k]||'🔗'}</span><div class="tx"><b>${esc(x.label)}</b><span>${KN[x.k]||''}${x.sub&&x.k!='user'?' · '+esc(x.sub):x.k=='user'?esc(x.sub||''):''}</span></div></div>`).join('')}</div>`:`<div class="mp"><div class="mut" style="padding:10px">${T2('لا نتائج','No results')}</div></div>`}
function menKey(k){const L=MEN.list||[];if(k=='Escape'){MEN=null;$('menpop').innerHTML='';return}if(k=='ArrowDown'){MEN.i=(MEN.i+1)%Math.max(L.length,1)}else if(k=='ArrowUp'){MEN.i=(MEN.i-1+L.length)%Math.max(L.length,1)}else{menPick(MEN.i);return}menDraw()}
function menPick(i){const x=(MEN.list||[])[i];if(!x)return;const ta=$('mt'),r={k:x.k,id:x.id,label:x.label};r.tk=(r.k=='user'?'@':'#')+String(r.label).replace(/\s+/g,'_');
 if(!REFS.some(q=>q.k==r.k&&String(q.id)==String(r.id)))REFS.push(r);
 ta.value=ta.value.slice(0,MEN.from)+r.tk+' '+ta.value.slice(MEN.pos);const p=MEN.from+r.tk.length+1;ta.setSelectionRange(p,p);MEN=null;$('menpop').innerHTML='';ta.focus();drawQref();ta.dispatchEvent(new Event('input'))}
async function sendM(){if(BUSY||!CUR)return;const ta=$('mt'),v=ta.value.trim();if(!v&&!ATT.length)return;BUSY=true;
 const refs=REFS.filter(r=>v.includes(r.tk)).map(r=>({k:r.k,id:String(r.id),label:r.label,tk:r.tk}));
 const {error}=await sb.rpc('chat_post',{p_to:CUR.t=='dm'?CUR.id:null,p_cid:CUR.t=='ch'?CUR.id:null,p_body:v,p_refs:refs,p_att:ATT});BUSY=false;
 if(error)return toast(T2('تعذّر الإرسال: ','Could not send: ')+(error.message||error));
 ta.value='';ta.style.height='auto';ATT=[];REFS=[];delete DR[keyOf(CUR)];MEN=null;$('menpop').innerHTML='';drawChips();drawQref();SIG='';await loadMsgs(true);ta.focus();
 if(CUR.t=='dm'){DMS[CUR.id]=MSGS[MSGS.length-1];drawRail()}else{const p=PROJ.find(x=>x.channel_id==CUR.id);if(p){p.last_at=new Date().toISOString();drawRail()}}}

 const [u,p,d]=await Promise.all([sb.rpc('chat_unread'),sb.rpc('chat_my_projects'),sb.from('chat_messages').select('id,from_user,to_user,body,deleted,created_at').is('channel_id',null).order('created_at',{ascending:false}).limit(300)]);
 UNR={};(u.data||[]).forEach(x=>{const k=x.channel_id?'ch:'+x.channel_id:'dm:'+x.from_user;UNR[k]=+x.n});
 if(!p.error)PROJ=p.data||[];
 DMS={};(d.data||[]).forEach(m=>{const o=m.from_user==ME.id?m.to_user:m.from_user;if(!DMS[o])DMS[o]=m});
 if(CUR){delete UNR[keyOf(CUR)]}drawRail()}

 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('lb').textContent=lang=='ar'?'EN':'ع';

 try{const g=await sb.from('chat_channels').select('id').eq('kind','general').limit(1);GEN=(g.data||[])[0]||null}catch(_){}
 try{const p=await sb.from('chat_pins').select('k');PINS=new Set((p.data||[]).map(x=>x.k))}catch(_){}
 shell();await refreshLists();
 if(P0){const p=PROJ.find(x=>x.pcode==P0);if(p)await openItem('ch',p.channel_id?String(p.channel_id):'p:'+P0);else toast(T2('لا تملك صلاحية محادثة هذا المشروع.','You do not have access to this project chat.'))}
 setInterval(async()=>{if(document.visibilityState!='visible')return;try{await refreshLists();if(CUR){await loadMsgs(false);if(CUR.t=='ch'&&CUR.pcode&&PANEL!='mem')loadMem();if(UNR[keyOf(CUR)]!==undefined||true)markRead2()}}catch(_){}},7000)}
let _mr=0;function markRead2(){if(!CUR||Date.now()-_mr<6000)return;_mr=Date.now();(CUR.t=='ch'?sb.rpc('chat_read_ch',{p_cid:CUR.id}):sb.rpc('chat_read',{p_from:CUR.id})).then(()=>{})}

load();

if(EMB){document.body.classList.add("emb");if(P0)document.body.classList.add("pj")}
</script></script><script>/*nightnav*/
(function(){
 var st=document.createElement('style');st.textContent='body #gnav{background:#fff;border-top:3px solid var(--gold,#BF9849)}body #gnav .gnb{color:#5b6b7b}body #gnav .gnb.on{color:var(--g,#1d5f8a);background:var(--g2,#e6f2f9);box-shadow:inset 0 3px 0 var(--blue,#3EA3DC)}body #gnav .gnb.ico{flex:0 0 46px}body #gnav .gnb.ico span{display:none}body #gnav .gnb#nmb{border:0;background:none;font:inherit;cursor:pointer}body #gnav .gnb{position:relative}body #gnav .gnb .cb{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;padding:0 5px;border-radius:99px;background:#d1101d;color:#fff;font:800 11px/16px Cairo,sans-serif;text-align:center}';document.head.appendChild(st);
 var cur=(location.pathname.split('/').pop()||'index.html').replace('.html','');

  var b=document.createElement('a');b.className='gnb ico';b.id='nmb';b.href='#';b.title=ar?'الوضع الليلي':'Night mode';b.innerHTML='<i>🌙</i><span>night</span>';

 if(!add()){var mo=new MutationObserver(function(){if(add())mo.disconnect()});mo.observe(document.body,{childList:true,subtree:true});setTimeout(function(){mo.disconnect()},8000);perms(null)}
