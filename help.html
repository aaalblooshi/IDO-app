<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--ch:#23272b;--fnt:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:15px/1.65 var(--fnt);background:var(--bg)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.top b{font-size:16px}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
h2{margin:0 0 4px;font-size:17px}h2 small{display:block;font-weight:400;color:var(--mut);font-size:13px}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;color:var(--ink)}
button.p{background:var(--g);border-color:var(--g);color:#fff}button.r{color:var(--r);border-color:#f3b9be}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:430px){.g2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--g2);color:var(--g);font-size:12px;font-weight:700}
#toast{position:fixed;inset-inline:14px;bottom:calc(var(--gnh,0px) + 18px);background:var(--ch);color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:40;text-align:center}

 pill:()=>'<div class="vrow"><span class="vact" style="--k:#2e8b57">'+(lang=='ar'?'اعتماد ›':'Approve ›')+'</span><span class="vact" style="--k:#3EA3DC">'+(lang=='ar'?'مراجعة ›':'Review ›')+'</span><span class="vact" style="--k:#7a6740">'+(lang=='ar'?'إكمال وتقديم ›':'Complete & submit ›')+'</span><span class="vact" style="--k:#d9534f">'+(lang=='ar'?'تعديل وإعادة إرسال ›':'Edit & resubmit ›')+'</span><span class="vact" style="--k:#BF9849">'+(lang=='ar'?'تنفيذ المهمة ›':'Work on task ›')+'</span><span class="vact" style="--k:#8e6bbf">'+(lang=='ar'?'مشاركة بالتخطيط ›':'Group planning ›')+'</span></div>',
 date:()=>'<div class="vrow"><span class="dr">01/10/2026<i>→</i>20/10/2026</span><span class="mut">'+(lang=='ar'?'كل تاريخ «من → إلى» يظهر داخل إطار مظلل ليسهل قراءته.':'Every “from → to” date range appears in a shaded box.')+'</span></div>',
 rag:()=>'<div class="vrow"><span class="vrag" style="--c:#2e8b57">'+(lang=='ar'?'ملتزم':'On track')+'</span><span class="vrag" style="--c:#e9a23b">'+(lang=='ar'?'يحتاج متابعة':'Needs attention')+'</span><span class="vrag" style="--c:#d9534f">'+(lang=='ar'?'حرج':'Critical')+'</span></div>',
 metrics:()=>'<div class="vmet"><div><small>'+(lang=='ar'?'المخطط حتى اليوم':'Planned to date')+'</small><b>27%</b></div><div><small>'+(lang=='ar'?'الفعلي':'Actual')+'</small><b>15%</b></div><div><small>'+(lang=='ar'?'الفارق':'Gap')+'</small><b style="color:#d9534f">−12</b></div></div><div class="vbar"><i style="width:15%"></i><u style="inset-inline-start:27%"></u></div>',

 seq:()=>'<div class="vseq"><div><span>1</span> '+(lang=='ar'?'التحليل':'Analysis')+'</div><div style="margin-inline-start:18px"><span>1.2</span> '+(lang=='ar'?'كتابة المتطلبات':'Write requirements')+'</div></div>',
 zoom:()=>'<div class="vrow"><span class="vbtn">−</span><span class="vbtn">100%</span><span class="vbtn">+</span><span class="vbtn">⤢</span><span class="vbtn">⛶</span><span class="mut">'+(lang=='ar'?'تصغير · الحجم · تكبير · عرض الكل · ملء الشاشة':'Out · size · in · fit all · fullscreen')+'</span></div>'
};

/* ---------- المحتوى ---------- */
/* كل قسم: id, ic, t:[ع,E], lead:[ع,E], who:'all|pm|pmo|adm', go:[href,ع,E], items:[{h:[ع,E], p:[ع,E], v:'اسم الرسم'}] */
const SEC=[
{id:'start',ic:'🚀',who:'all',t:['البداية السريعة','Quick start'],lead:['ثلاث خطوات تكفي لتبدأ العمل.','Three steps are enough to get going.'],go:['./','افتح الصفحة الرئيسية','Open the home page'],items:[
 {h:['1) سجّل الدخول وافتح «لوحتي»','1) Sign in and open “My board”'],p:['الصفحة الرئيسية تجمع كل ما يخصك: ما ينتظر إجراءك، وما تأخّر، وطلباتك الجارية. الأرقام في أعلى الصفحة قابلة للضغط لتصفية اللوحة.','The home page gathers everything about you: what awaits your action, what is late and your running requests. The numbers at the top are clickable filters.']},
 {h:['2) اضغط زر الإجراء على البطاقة','2) Press the action button on a card'],p:['كل بطاقة بانتظار إجرائك تحمل زرًا ملوّنًا باسم الإجراء المطلوب (اعتماد، مراجعة، تنفيذ المهمة…). يفتح نافذة تُكمل منها العمل دون مغادرة الصفحة.','Every card awaiting your action carries a coloured button naming the action (approve, review, work on task…). It opens a window where you finish the work without leaving the page.'],v:'pill'},
 {h:['3) ابدأ من مشاريعي لترى صورة كاملة','3) Use My projects for the full picture'],p:['«مشاريعي» تعرض كل مشروع لك فيه دور وأين وصل، وتفتح «ملف المشروع» بخطته ومهامه وطلباته ووثائقه.','“My projects” shows every project you have a role in and where it stands, and opens the “project file” with its plan, tasks, requests and documents.']}]},

{id:'home',ic:'🏠',who:'all',t:['الصفحة الرئيسية (لوحتي)','Home page (My board)'],lead:['لوحة شخصية تتبدّل بحسب دورك، وتظهر عند فتح الصفحة بعد لحظة تحميل قصيرة.','A personal board that adapts to your role.'],go:['./','افتح الصفحة الرئيسية','Open the home page'],items:[
 {h:['الشريط الأزرق والمؤشرات','The blue banner and counters'],p:['يحيّيك باسمك ويلخّص «كم بانتظار إجرائك وكم منها متأخر». الأزرار تحته: <b>بانتظار إجرائي</b>، <b>متأخرة</b>، <b>مرجعة لي</b>، <b>طلباتي الجارية</b>، <b>أتابعها</b>. اضغط أي زر لتُصفّي اللوحة، واضغطه ثانية للإلغاء. القائمة المنسدلة «كل أدواري» تعرض لوحة دور واحد (مدير مشروع، معتمد، مراجع…).','It greets you and summarises “how many await your action and how many are late”. The buttons below: <b>Awaiting my action</b>, <b>Late</b>, <b>Returned to me</b>, <b>My open requests</b>, <b>I follow</b>. Press one to filter the board, press it again to clear. The “All my roles” list shows one role only.']},
 {h:['البحث والأوامر','Search and commands'],p:['اضغط <b>/</b> أو اكتب في خانة البحث: اسم مشروع أو رقم طلب فتظهر كل النتائج (يمكنك التمرير داخلها)، أو اكتب أمرًا مثل «ميثاق جديد» و«خطة جديدة» للانتقال مباشرة.','Press <b>/</b> or type in the search box: a project name or request number lists all matches (scrollable), or type a command such as “new charter” or “new plan” to jump straight there.']},
 {h:['رحلتي: أعمدة الخدمات','My journey: service columns'],p:['لكل خدمة عمود: المواثيق، الخطط، مهامي، طلبات التغيير، التقرير الختامي. يظهر في كل عمود عدد ثابت من البطاقات (٤)، وبإمكانك <b>التمرير داخل العمود</b> لرؤية الباقي، أو الضغط على «عرض المزيد» لتكبير الصندوق، و«عرض أقل» لإرجاعه.','Each service has a column: charters, plans, my tasks, change requests, closure reports. A fixed number of cards (4) shows per column; <b>scroll inside the column</b> to see the rest, or press “Show more” to enlarge the box and “Show less” to shrink it back.']},
 {h:['على البطاقة','On a card'],p:['اسم المشروع أو الطلب (ضع الماوس عليه لقراءته كاملًا)، وحالته، وموعد الاستحقاق إن وُجد (⏳ متبقٍ أو ⏱ متأخر). في أسفلها <b>زر الإجراء</b> وبجانبه الأيقونة 📂 لفتح «ملف المشروع». الضغط على البطاقة نفسها يفتح الوثيقة في صفحتها.','The project or request name (hover to read it in full), its status and due time if any (⏳ left or ⏱ late). At the bottom is the <b>action button</b> and beside it the 📂 icon that opens the “project file”. Clicking the card itself opens the document on its own page.']},
 {h:['نافذة الإجراء','The action window'],p:['<b>للطلبات</b> (ميثاق، خطة، طلب تغيير، تقرير ختامي): يفتح النموذج نفسه داخل نافذة فتوقّع أو تعتمد أو تعدّل منها، وفيها زر «فتح في صفحة كاملة». عند إغلاقها تتحدّث اللوحة.<br><b>للمهام</b>: تعرض النافذة تسلسل المهمة داخل الخطة (المرحلة ← المهمة)، وموعدها المخطط، ونسبة الإنجاز، وزر «إنجاز المهمة» الذي يضبطها ١٠٠٪ بتاريخ اليوم، مع روابط ملف المشروع وصفحة مهامي.','<b>Requests</b> (charter, plan, change request, closure report): the form itself opens inside the window so you can sign, approve or edit there; it has an “Open full page” button. The board refreshes when you close it.<br><b>Tasks</b>: the window shows the task’s sequence in the plan (phase → task), its planned dates, progress and a “Mark as done” button that sets it to 100% as of today, with links to the project file and My tasks.'],v:'seq'},
 {h:['المواعيد (مطوية افتراضيًا)','Deadlines (collapsed by default)'],p:['الزر «إظهار المواعيد» يفتح عمودًا جانبيًا فيه <b>مواعيد الطلبات</b> و<b>مواعيد المهام</b> بدائرة تبيّن الأيام المتبقية (أحمر = متأخر)، و«إنجاز مهامي» (المخطط مقابل الفعلي). عند طيّه تتسع الأعمدة. اختيارك يُحفظ لمتصفحك.','The “Show deadlines” button opens a side column with <b>request deadlines</b> and <b>task deadlines</b> as rings showing days left (red = late), plus “My task progress” (planned vs actual). Collapsing it widens the columns. Your choice is remembered by your browser.']},
 {h:['التقويم','Calendar'],p:['تبويب «التقويم» يعرض بدايات المهام ونهاياتها ومواعيد الطلبات على شهر كامل، مع تصفية بنوع الحدث، وتفاصيل اليوم المحدد.','The “Calendar” tab shows task starts and ends and request deadlines across a month, filterable by event type, with the selected day’s details.']},
 {h:['إنشاء جديد','Create new'],p:['الزر العائم «＋ إنشاء جديد» يفتح قائمة: ميثاق مشروع، خطة، طلب تغيير، تقرير ختامي.','The floating “＋ Create new” button lists: project charter, plan, change request, closure report.']},
 {h:['كل الخدمات ورحلة المتعامل','All services and the client journey'],p:['«كل الخدمات» أسفل اللوحة بالترتيب: المواثيق ← الخطط ← مشاريعي ← مهامي ← طلبات التغيير ← التقرير الختامي. وزر «العودة إلى العرض السابق» أسفل الصفحة يرجع للتصميم القديم إن أردت.','“All services” below the board, in order: charters → plans → My projects → My tasks → change requests → closure report. The “Back to the previous layout” link at the bottom returns to the old design if you wish.']}]},

{id:'life',ic:'🧭',who:'all',t:['رحلة المشروع من الفكرة إلى الإغلاق','The project journey, idea to closure'],lead:['خمس محطات، لكل محطة وثيقتها ومن يعمل عليها.','Five stations, each with its document and the people who work on it.'],items:[
 {h:['المحطات','The stations'],p:['<b>الميثاق</b> يُعدّه مدير المشروع ويُعتمد ← <b>الخطة</b> تُبنى من مهام ومكلّفين وتواريخ وتُعتمد ← <b>التنفيذ</b> يسجّل فيه المكلّفون إنجازهم في «مهامي» ← <b>التغيير</b> عند الحاجة لطلب تغيير في النطاق أو التكلفة أو الزمن ← <b>الإغلاق</b> بتقرير ختامي.','The <b>charter</b> is prepared by the project manager and approved → the <b>plan</b> is built from tasks, assignees and dates and approved → <b>execution</b>, where assignees record progress in “My tasks” → <b>changes</b>, a change request when scope, cost or time change → <b>closure</b> with a closure report.'],v:'life'},
 {h:['مسار الاعتماد','The approval path'],p:['كل وثيقة تمرّ: مسودة ← مراجعة المكتب ← بانتظار الاعتماد ← معتمد. لكل مرحلة مهلة افتراضية <b>٣ أيام عمل</b> (يضبطها المسؤول من الإعدادات)، ويظهر الموعد المتبقي على البطاقات والتنبيهات.','Each document goes: draft → office review → awaiting approval → approved. Each stage has a default <b>3-working-day</b> window (set by the admin in Settings) and the remaining time shows on cards and alerts.'],v:'flow'},
 {h:['الاستعادة والإرجاع','Returns'],p:['إن رأى المراجع أو المعتمد ملاحظات أعاد الوثيقة <b>«معادة للتعديل»</b> فتظهر في لوحة مدير المشروع بزر «تعديل وإعادة إرسال». الملاحظات تكون على حقول محددة داخل النموذج.','If the reviewer or approver has notes they return the document as <b>“Returned for edits”</b>; it appears on the project manager’s board with an “Edit & resubmit” button. Notes are attached to specific fields in the form.']},
 {h:['قواعد تسمية وعمل مهمة','Good to know'],p:['الخدمة المنتهية تسمّى «مكتملة»، والمهمة المنتهية «منجزة». لكل مشروع تقرير ختامي واحد فعّال. «المهام» غير «الطلبات»: المهام ضمن الخطة، والطلبات هي الوثائق (ميثاق، خطة، تغيير، تقرير).','A finished service is “completed”, a finished task is “done”. Each project has one active closure report. “Tasks” are not “requests”: tasks live inside the plan, requests are the documents (charter, plan, change, report).']}]},

{id:'myp',ic:'📂',who:'all',t:['مشاريعي','My projects'],lead:['كل مشروع لك فيه دور، وأين وصل بالضبط، وملف كامل لكل مشروع.','Every project you have a role in, where it stands, and a full file for each.'],go:['myprojects.html','افتح مشاريعي','Open My projects'],items:[
 {h:['القائمة والأدوار','The list and your roles'],p:['تُصفّي بالشرائح: <b>الكل</b>، <b>مدير مشروع</b>، <b>مالك</b>، <b>مكلّف بمهام</b>، <b>متابع</b>، <b>مشارك بالتخطيط</b>، <b>تحتاج إجراء</b>، <b>متأخرة</b>، <b>حرجة</b>، <b>متعثرة</b>. وتغيّر العرض بين <b>بطاقات</b> و<b>قائمة</b> و<b>خارطة طريق</b> (جدول زمني يمكن فتح مراحله ومهامه بمستويات).','Filter with chips: <b>All</b>, <b>Project manager</b>, <b>Owner</b>, <b>Task assignee</b>, <b>Follower</b>, <b>Planning participant</b>, <b>Needs action</b>, <b>Late</b>, <b>Critical</b>, <b>Stuck</b>. Switch the view between <b>cards</b>, <b>list</b> and <b>roadmap</b> (a timeline whose phases and tasks expand by level).'],v:'roles'},
 {h:['«الوضع الآن»: أين وصل المشروع','“Now”: where the project stands'],p:['كل بطاقة تكتب بجملة واضحة وضع المشروع: الميثاق ناقص ولم يُرسل؛ الميثاق بانتظار المراجعة؛ الخطة معتمدة والمهمة الأولى لم تبدأ؛ التنفيذ جارٍ وكذا متأخرة؛ المشروع بانتظار التقرير الختامي… وتحدد من ينتظر منه الإجراء إن كان لك أو لغيرك.','Each card states in a clear sentence where the project stands: charter incomplete and not sent; charter awaiting review; plan approved and the first task not started; execution running and N late; awaiting closure report… and says whom the action waits on, you or someone else.']},
 {h:['المخطط – الفعلي – الفارق','Planned – Actual – Gap'],p:['<b>المخطط حتى اليوم</b>: النسبة التي كان يجب أن تُنجز حتى اليوم بحسب تواريخ الخطة. <b>الفعلي</b>: ما سُجّل فعلًا من إنجاز. <b>الفارق</b>: الفعلي ناقص المخطط (السالب = متأخر عن المخطط). والشريط يبيّن الفعلي بالتعبئة وخط اليوم بالعلامة السوداء. مثال: مخطط ٢٧٪، فعلي ١٥٪، فارق −١٢ نقطة.','<b>Planned to date</b>: the share that should be done by today according to plan dates. <b>Actual</b>: the progress really recorded. <b>Gap</b>: actual minus planned (negative = behind plan). The bar fills to actual and the black tick marks planned. Example: planned 27%, actual 15%, gap −12 points.'],v:'metrics'},
 {h:['مؤشر الصحة','Health indicator'],p:['<b>أخضر</b> ملتزم. <b>أصفر</b> يحتاج متابعة (فارق ٨ نقاط فأكثر أو وجود مهام متأخرة). <b>أحمر</b> حرج (مهام متأخرة مع فارق ١٥ نقطة فأكثر).','<b>Green</b> on track. <b>Amber</b> needs attention (gap of 8 points or more, or late tasks). <b>Red</b> critical (late tasks together with a gap of 15 points or more).'],v:'rag'},
 {h:['ملف المشروع','The project file'],p:['اضغط على أي مشروع لتفتح ملفه: رأس بالرحلة (الميثاق ← الخطة ← التنفيذ ← التغيير ← الإغلاق)، ثم جملة «الوضع الآن»، ثم التبويبات: <b>نظرة عامة</b> («ما الذي يحتاج انتباهك الآن»، الفريق والأدوار، آخر الأحداث)، <b>الخطة</b>، <b>المهام</b>، <b>الطلبات والتغييرات</b>، <b>الوثائق والسجل</b> (بزر «فتح» لكل وثيقة). أعلى الصفحة زر <b>العودة إلى مشاريعي</b> وقائمة <b>تغيير المشروع</b> للانتقال لمشروع آخر مباشرة.','Click any project to open its file: a journey header (charter → plan → execution → changes → closure), the “Now” sentence, then tabs: <b>Overview</b> (“what needs your attention”, team and roles, latest events), <b>Plan</b>, <b>Tasks</b>, <b>Requests & changes</b>, <b>Documents & log</b> (with an “Open” button for each document). At the top: <b>Back to my projects</b> and a <b>Switch project</b> list.']},
 {h:['عرض الخطة بخمس طرق','Five ways to view the plan'],p:['<b>الجدول الزمني</b> (جانت)، <b>الهيكل (WBS)</b> رسم هرمي بالبطاقات، <b>حسب المكلّف</b>، <b>قائمة</b>، <b>لوحة (كانبان)</b>. فوقها مرشحات: المرحلة، المكلّف، الحالة، «مهامي فقط»، «المتأخرة فقط»، وبحث. ويعرض الملف أيضًا الاعتمادات والمسار الحرج، وحمل المكلّفين، والمقارنة بالخط الأساسي.','<b>Timeline</b> (Gantt), <b>Structure (WBS)</b> as a hierarchy of cards, <b>By assignee</b>, <b>List</b>, <b>Board (Kanban)</b>. Filters above: phase, assignee, status, “My tasks only”, “Late only” and search. The file also shows dependencies and the critical path, assignee load, and comparison with the baseline.']},
 {h:['الهيكل القابل للتكبير','The zoomable structure'],p:['رسم الهيكل يُفتح <b>كاملًا</b> داخل الشاشة. كبّر وصغّر بأزرار + و − أو بعجلة الفأرة أو بإصبعين على الهاتف، واسحب لتحريك الرسم، و⤢ لعرضه كاملًا، و⛶ لملء الشاشة. نفس الأدوات في صفحة الخطة وصفحة المحفظة.','The structure diagram opens <b>in full</b> within the screen. Zoom with + and − buttons, the mouse wheel or two fingers on the phone; drag to pan, ⤢ to fit all and ⛶ for fullscreen. The same tools exist on the plan page and the portfolio page.'],v:'zoom'},
 {h:['المشاريع السرية','Confidential projects'],p:['إن حوّل مكتب التطوير المشروع إلى «سري» فلا يراه أصحاب الوحدات، ومن أُضيف إليه (بمهمة مثلًا) يرى مهامه فقط بأسمائها، أما بقية الصفوف وتفاصيل المشروع (الفريق والأحداث والمؤشرات) فتظهر مموّهة: الخانات والتواريخ والنسب موجودة لكن دون الأسماء والمكلّفين. ويُطبَّق ذلك من الخادم لا من الشاشة فقط.','If the office marks a project “confidential (own tasks only)”, anyone with tasks in it sees only their own tasks by name; other rows appear blurred: boxes, dates and progress remain but names and assignees are hidden. This is enforced by the server, not just the screen.']}]},

{id:'charter',ic:'📜',who:'pm',t:['ميثاق المشروع','Project charter'],lead:['الوثيقة التأسيسية. بعد اعتمادها يظهر المشروع في بقية الخدمات.','The founding document. Once approved the project appears in the other services.'],go:['charter.html','افتح المواثيق','Open charters'],items:[
 {h:['إعداد الميثاق','Preparing the charter'],p:['«＋ ميثاق جديد» ثم عبّئ التبويبات: عام (الاسم، الوصف، النوع، الهدف، الغرض، التواريخ، المالك، القطاع والإدارة، مدير المشروع، الميزانية)، السياق، أصحاب المصلحة والأنشطة، الموارد، المخاطر. علامة * تعني حقلًا إلزاميًا، وعلامة (؟) بجانب العنوان تشرح الحقل.','“＋ New charter”, then fill the tabs: General (name, description, type, goal, purpose, dates, owner, sector and department, project manager, budget), Context, Stakeholders and activities, Resources, Risks. A * means mandatory and the (?) next to a title explains the field.']},
 {h:['المالك ومدير المشروع','Owner and project manager'],p:['خانتا <b>مالك المشروع</b> و<b>مدير المشروع</b> قائمتان قابلتان للبحث من المستخدمين المسجّلين (مثل المكلّف في المهام). اكتب جزءًا من الاسم واختر. لا يُقبل اسم من خارج القائمة.','The <b>project owner</b> and <b>project manager</b> fields are searchable lists of registered users (like the assignee of a task). Type part of the name and choose. A name outside the list is not accepted.']},
 {h:['الملاحظات والتوقيع','Notes and signing'],p:['يضع المراجع ملاحظات على حقول محددة. التوقيع بضغطة واحدة من «توقيعي المحفوظ» (من صفحة حسابي). يمكن تصدير الميثاق وطباعته.','The reviewer attaches notes to specific fields. Signing is one press using “My saved signature” (from My account). The charter can be exported and printed.']}]},

{id:'plan',ic:'🗓',who:'pm',t:['خطة المشروع','Project plan'],lead:['هيكل العمل بتواريخه ومكلّفيه، ثم الاعتماد.','The work structure with dates and assignees, then approval.'],go:['plan.html','افتح الخطط','Open plans'],items:[
 {h:['إنشاء خطة','Creating a plan'],p:['«＋ خطة جديدة» ← اختر ميثاقًا معتمدًا. وإن أردت البدء من هيكل جاهز فاختر من القائمة <b>«قالب: نسخ هيكل خطة سابقة»</b>: تُنسخ المراحل والمهام والاعتماديات وتُزاح التواريخ بحسب بداية المشروع الجديد، وتُفرَّغ المكلّفون والنسب.','“＋ New plan” → choose an approved charter. To start from a ready structure pick <b>“Template: copy structure of a previous plan”</b>: phases, tasks and dependencies are copied, dates shift to the new project’s start, and assignees and progress are cleared.']},
 {h:['بناء المهام','Building tasks'],p:['مراحل ومهام فرعية (حتى خمسة مستويات) لكل مهمة: الاسم، البداية، النهاية، المكلّف (من المستخدمين)، الوزن، الاعتماديات (تسبقها مهام بأنواع FS/SS ومدة تأخير)، ملاحظة. ويمكن الاستيراد من Excel بقالب جاهز والتصدير إليه.','Phases and sub-tasks (up to five levels). Each task: name, start, end, assignee (from users), weight, dependencies (predecessors with FS/SS types and lag) and a note. You can import from a ready Excel template and export to it.']},
 {h:['طرق العرض','Views'],p:['<b>قائمة</b> قابلة للتحرير، <b>جانت</b> مع جدول جانبي، و<b>هيكل (WBS)</b> رسم هرمي قابل للتكبير والطباعة. ويمكن إظهار <b>المسار الحرج</b> والمقارنة بالخط الأساسي.','An editable <b>list</b>, a <b>Gantt</b> with a side table, and a <b>WBS</b> tree that is zoomable and printable. You can show the <b>critical path</b> and compare with the baseline.']},
 {h:['التخطيط الجماعي (المشاورة)','Group planning (consultation)'],p:['وهي مسودة: تبويب «المشاورة» ← حدّد المدة والمدعوّين ← «نشر». يضيف المدعوّون مدخلاتهم (تعليقات وتعديلات). <b>ويستطيع أي مشارك إضافة أشخاص آخرين</b> ما دامت المشاورة مفتوحة. تظهر قائمة بمن علّق ومن لم يعلّق، ويغلقها مدير المشروع.','While the plan is a draft: “Consultation” tab → set the duration and invitees → “Publish”. Invitees add input (comments and edits). <b>Any participant can add other people</b> while the consultation is open. A list shows who has and has not commented, and the project manager closes it.']},
 {h:['الإرسال للاعتماد والإصدارات','Submitting and versions'],p:['«إرسال للاعتماد» يفحص الأخطاء ثم يبدأ المسار. بعد الاعتماد تُدار التعديلات عبر <b>مسودة تعديلات</b> بإصدار جديد تبقى معه الخطة المعتمدة سارية حتى اعتماد التعديل. وللمكتب «تجاوز المكتب» لتفعيل مشروع أو خطة قبل الاعتماد (علامة ⚡).','“Submit for approval” checks for errors then starts the path. After approval, changes go through a <b>draft of changes</b> with a new version while the approved plan keeps running until the change is approved. The office may use “Office bypass” to activate a project or plan before approval (⚡ mark).']}]},

{id:'tasks',ic:'✅',who:'all',t:['مهامي','My tasks'],lead:['كل ما أُسند إليك في الخطط المعتمدة.','Everything assigned to you in approved plans.'],go:['tasks.html','افتح مهامي','Open My tasks'],items:[
 {h:['تسجيل الإنجاز','Recording progress'],p:['افتح المهمة ← اضبط النسبة أو استعمل الأزرار السريعة. بعد البدء يظهر زر <b>«إغلاق المهمة (اليوم)»</b>. تُسجَّل تواريخ البدء والانتهاء الفعلية ويتجمّع الإنجاز تلقائيًا إلى المشروع فالقطاع فالمركز. ويمكنك أيضًا إنجازها من نافذة الإجراء في لوحتك.','Open the task → set the percentage or use quick buttons. Once started, <b>“Close the task (today)”</b> appears. Actual start and end dates are recorded and progress rolls up to project, sector and centre. You can also finish it from the action window on your board.']},
 {h:['حالات المهمة','Task states'],p:['قادمة، حان موعد بدئها، قيد التنفيذ، متأخرة، منجزة. وتبويبات: <b>مهامي</b>، <b>مهام الفريق</b> (لمدير المشروع)، وطرق العرض: قائمة، حسب المشروع، مخطط زمني، ملخص الفترة (أسبوع/شهر).','Upcoming, due to start, in progress, late, done. Tabs: <b>My tasks</b>, <b>Team tasks</b> (for project managers); views: list, by project, timeline, period digest (week/month).']},
 {h:['تأجيل مهمة أو تعديل موعدها','Postponing or re-dating'],p:['في صفحة المهمة «تعديل الموعد المخطط» ← +أسبوع / +شهر أو تاريخ ← «معاينة التأثير» لترى المهام المتأثرة ← أضِف للمسودة. بعد جمع التعديلات: «مراجعة وإرسال» من الشريط السفلي لإنشاء <b>مسودة تعديل واحدة</b> تُرسل للاعتماد.','On the task page “Edit planned dates” → +week / +month or a date → “Preview impact” to see affected tasks → add to the draft. After collecting changes: “Review & send” in the bottom bar creates <b>one change draft</b> sent for approval.']},
 {h:['مهمة تكميلية','Supplementary task'],p:['«＋ مهمة تكميلية» ← اختر المشروع والمهمة الرئيسية والتواريخ والمكلّف. تُضاف مباشرة دون طلب تغيير وتُسجَّل في سجل الخطة.','“＋ Supplementary task” → choose project, main task, dates and assignee. It is added directly without a change request and logged in the plan history.']},
 {h:['التصدير','Exporting'],p:['تصدير إلى Excel، وتصدير مواعيدك إلى التقويم (ICS)، وزر «تخصيص العرض» لتختار ما يظهر.','Export to Excel, export your deadlines to a calendar (ICS), and “Customise view” to choose what shows.']}]},

{id:'cr',ic:'🔁',who:'all',t:['طلبات التغيير والتقرير الختامي','Change requests and closure report'],lead:['عند تغيّر النطاق أو التكلفة أو الزمن، وعند الإغلاق.','When scope, cost or time change, and at closure.'],go:['cr.html','افتح طلبات التغيير','Open change requests'],items:[
 {h:['طلب التغيير','Change request'],p:['يُرفع عند الحاجة لتغيير في النطاق أو التكلفة أو الخط الزمني. تُعبَّأ بيانات المشروع من الميثاق، ثم يمرّ المسار المعتاد للمراجعة والاعتماد. أما تغيير مواعيد مهام الخطة فيتم عبر «مسودة التعديلات» في مهامي.','Raised when scope, cost or timeline must change. Project data is filled from the charter, then it follows the usual review and approval path. Changing task dates inside the plan goes through the “draft of changes” in My tasks.']},
 {h:['التقرير الختامي','Closure report'],p:['عند اكتمال المشروع ومهامه يُعدّ التقرير الختامي وتُعبَّأ التواريخ من الخطة. يوجد تقرير ختامي <b>واحد فعّال</b> لكل مشروع.','When the project and its tasks are complete the closure report is prepared and dates fill from the plan. There is <b>one active</b> closure report per project.'],go:['closure.html','افتح التقارير الختامية','Open closure reports']}]},

{id:'inbox',ic:'🔔',who:'all',t:['الإشعارات والبريد','Notifications and email'],lead:['ما يصلك داخل المنصة وعلى بريدك.','What reaches you in the platform and by email.'],go:['inbox.html','افتح الإشعارات','Open notifications'],items:[
 {h:['صندوق الإشعارات','Inbox'],p:['يجمع الوثائق التي تنتظر إجراءك، والتذكيرات التي يرسلها لك من يتابعك، وتنبيهات التأخر. يمكنك فتح الوثيقة مباشرة من الإشعار.','Gathers documents awaiting your action, reminders sent by those who follow you, and late alerts. You can open the document straight from the notification.']},
 {h:['البريد الإلكتروني','Email'],p:['يرسل النظام بريدًا عند الأحداث التي يفعّلها المسؤول (وصول وثيقة للمراجعة، الإرجاع، الاعتماد، تذكير مهمة…) ويمكنك ضبط تنبيهاتك من «حسابي».','The system emails on the events the admin enables (a document reaching review, returns, approval, task reminders…) and you can set your alerts in “My account”.']},
 {h:['الملخص الأسبوعي','Weekly digest'],p:['كل أحد صباحًا يصل مدير المشروع ملخص بعدد المهام المتأخرة وما يستحق خلال ٧ أيام لكل مشروعه. وللمسؤول زر «إرسال الملخص الآن» في الإعدادات.','Every Sunday morning each project manager receives a digest of late tasks and what falls due within 7 days for each project. The admin has a “Send digest now” button in Settings.']}]},

{id:'port',ic:'📊',who:'pmo',t:['المحفظة والتقارير','Portfolio and reports'],lead:['للإدارة والمكتب: صورة المركز كله بحسب نطاق رؤيتك.','For management and the office: the whole centre within your view scope.'],go:['portfolio.html','افتح المحفظة','Open the portfolio'],items:[
 {h:['التبويبات','Tabs'],p:['<b>تنفيذي</b>: مؤشرات رئيسية، خريطة المشاريع، القطاعات، <b>صحة المشاريع حسب القطاع</b> و<b>المشاريع الحرجة</b> (كل مشروع منها يفتح ملفه)، وأبرز المتأخرات والمعالم. ثم <b>ملخص</b>، <b>المحفظة</b>، <b>الهيكل</b> (قابل للطي والتكبير: القطاع ← المشروع ← المرحلة ← المهمة)، <b>مخطط زمني</b>، <b>سجل</b>، <b>تقارير</b>، و<b>الأوزان</b> للمسؤول. ويمكن تصفية القطاع والمشروع من الأعلى.','<b>Executive</b>: key indicators, the project map, sectors, <b>project health by sector</b> and <b>critical projects</b> (each opens its file), top delays and milestones. Then <b>Summary</b>, <b>Portfolio</b>, <b>Structure</b> (collapsible and zoomable), <b>Timeline</b>, <b>Record</b>, <b>Reports</b> and <b>Weights</b> for admins. Filter by sector and project at the top.']},
 {h:['التقارير','Reports'],p:['اختر شهري أو ربعي أو نصف سنوي أو سنوي ← تطبيق ← «تصدير الأداء (Excel)» أو «مشاركة / حفظ التقرير». المشاريع الاستراتيجية لها وزن أعلى في حساب إنجاز القطاع والمركز.','Choose monthly, quarterly, half-yearly or annual → Apply → “Export performance (Excel)” or “Share / save report”. Strategic projects carry a higher weight in sector and centre progress.']}]},

{id:'admin',ic:'🛠',who:'adm',t:['إدارة المشاريع والمستخدمين','Managing projects and users'],lead:['لمكتب التطوير المؤسسي ومسؤول النظام.','For the Institutional Development Office and the system admin.'],go:['projects.html','افتح المشاريع','Open projects'],items:[
 {h:['صفحة المشاريع (إدارة)','Projects page (manage)'],p:['لكل مشروع قسم «إدارة»: <b>إخفاء المشروع</b> عن غير المصرّح لهم، <b>سري (مهامه فقط)</b>، <b>تجاوز المكتب</b> لتفعيل المشروع قبل الاعتماد، <b>الوزن</b> في المحفظة، <b>تفعيل خطة</b>، <b>صلاحيات خاصة</b> لمستخدمين بمستوى ونطاق خدمات، <b>الأرشفة والاستعادة</b>.','Each project has a “Manage” section: <b>hide the project</b> from the unauthorised, <b>confidential (own tasks only)</b>, <b>office bypass</b> to activate before approval, the portfolio <b>weight</b>, <b>activate a plan</b>, <b>special grants</b> for users with a level and a set of services, <b>archive and restore</b>.']},
 {h:['تسليم مدير المشروع','Project-manager handover'],p:['اختر مدير المشروع الجديد من المستخدمين، واكتب ملاحظة، وحدّد إن كانت <b>المهام غير المكتملة</b> للمدير السابق تنتقل إليه. يتحدّث الميثاق والخطط ويُسجَّل التسليم في سجل يظهر أسفل القسم.','Choose the new project manager from users, add a note, and decide whether the previous manager’s <b>unfinished tasks</b> move to them. The charter and plans update and the handover is logged in a list below the section.']},
 {h:['نقل المشروع بين القطاعات والإدارات','Moving a project between sectors and departments'],p:['اختر القطاع الجديد (والإدارة إن وُجدت) ثم «نقل». يتحدّث الميثاق والخطة وطلبات التغيير والتقرير الختامي معًا، وتتغيّر بذلك نطاقات الرؤية، ويُسجَّل النقل.','Choose the new sector (and department if any) then “Move”. The charter, plan, change requests and closure report update together, view scopes change accordingly, and the move is logged.']},
 {h:['المستخدمون والأدوار','Users and roles'],p:['الأدوار: <b>مدير مشروع</b>، <b>مكتب التطوير المؤسسي</b>، <b>راعي المشروع</b>، <b>مسؤول النظام</b>. من «إدارة المستخدمين» يُغيَّر الدور والمسمى ونطاق الرؤية (المركز أو قطاع)، ومن «الأدوار» تُضبط صلاحيات كل خدمة، ومن «الأرشيف» يُستعاد المحذوف والمؤرشف، ومن «أداء المستخدمين» تُتابَع المتأخرات ويُرسَل تذكير للمستخدم ضمن نطاقك.','Roles: <b>project manager</b>, <b>Institutional Development Office</b>, <b>project sponsor</b>, <b>system admin</b>. “User management” changes role, job title and view scope (centre or a sector); “Roles” sets permissions per service; “Archive” restores deleted and archived items; “Users performance” tracks delays and lets you send a reminder to a user within your scope.']},
 {h:['الإعدادات','Settings'],p:['القوائم المنسدلة (القطاعات والإدارات والأهداف…)، مدد المراجعة والاعتماد (الافتراضي ٣ أيام عمل)، أيام العمل والإجازات، تشغيل وإيقاف الخدمات، تنبيهات البريد وإعداداته، ترتيب الصفحة الرئيسية، رحلة المتعامل وتقييم الخدمة، الملخص الأسبوعي، المرفقات.','Dropdown lists (sectors, departments, goals…), review and approval windows (default 3 working days), working days and holidays, turning services on or off, email alerts and settings, home page order, client journey and service rating, the weekly digest, attachments.']}]},

{id:'tips',ic:'💡',who:'all',t:['أدوات عامة وحيل مفيدة','Handy tools and tips'],lead:['أشياء صغيرة توفّر عليك الوقت.','Small things that save time.'],items:[
 {h:['الأسماء الطويلة','Long names'],p:['ضع الماوس على أي اسم مقصوص بنقاط (…) لتقرأه كاملًا، في المهام والطلبات والمشاريع.','Hover over any name cut off with dots (…) to read it in full, in tasks, requests and projects.']},
 {h:['التواريخ','Dates'],p:['التواريخ «من → إلى» داخل إطار مظلل، وأي نص بين قوسين (؟) يشرح الخانة.','Date ranges “from → to” sit in a shaded box; a (?) next to a title explains the field.'],v:'date'},
 {h:['القائمة والتنقل','Menu and navigation'],p:['زر «القائمة» في الأعلى يفتح كل الصفحات المتاحة لدورك، وزر EN / ع يبدّل اللغة (والاتجاه من اليمين لليسار أو العكس). على الهاتف يوجد شريط سفلي للصفحات الرئيسية، ويمكن تثبيت المنصة كتطبيق.','The “Menu” button at the top opens every page available to your role, and EN / ع switches language and direction. On the phone there is a bottom bar for the main pages, and the platform can be installed as an app.']},
 {h:['تثبيت التطبيق على الآيفون','Install on iPhone'],p:['افتح الرابط في Safari ← زر المشاركة ← «إضافة إلى الشاشة الرئيسية». سيعمل كتطبيق.','Open the link in Safari → Share → “Add to Home Screen”. It then runs like an app.']}]},

{id:'sym',ic:'🎨',who:'all',t:['دليل الألوان والرموز','Colours and symbols'],lead:['ماذا يعني كل لون ورمز.','What each colour and symbol means.'],items:[
 {h:['ألوان الحالة','Status colours'],p:['<span class="sw" style="background:#1c7a45"></span> منجزة / مكتملة &nbsp; <span class="sw" style="background:#d1101d"></span> متأخرة &nbsp; <span class="sw" style="background:#3D96C7"></span> قيد التنفيذ &nbsp; <span class="sw" style="background:#949594"></span> لم تبدأ &nbsp; <span class="sw" style="background:#ca9a3b"></span> يحتاج متابعة','<span class="sw" style="background:#1c7a45"></span> Done / completed &nbsp; <span class="sw" style="background:#d1101d"></span> Late &nbsp; <span class="sw" style="background:#3D96C7"></span> In progress &nbsp; <span class="sw" style="background:#949594"></span> Not started &nbsp; <span class="sw" style="background:#ca9a3b"></span> Needs attention']},
