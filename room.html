<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4200)}
const C={ok:'#0a6b3d',warn:'#b7791f',bad:'#d1101d',info:'#1d5f8a',sky:'#3EA3DC',gold:'#BF9849',line:'#e4dfd4',line2:'#d6ccb6',mut:'#5f646b',dim:'#8a8f96',ink:'#1b1d1f',pipe:'#3EA3DC',done:'#8fbfa3',halt:'#9aa0a6'};
const DAY=864e5;
let ME=null,D=null,OP=null,PROF=[],LENS='health',SEL=new Set(),QF='all',SECF=null,SHOW=false,SHOWT=null,LOADING=false;
const W0={s:35,k:30,r:20,a:15};
const SV={charter:'charter.html',plan:'plan.html',cr:'cr.html',closure:'closure.html'};
const SVN={charter:'ميثاق',plan:'خطة',cr:'طلب تغيير',closure:'تقرير إغلاق'};
const STN={Draft:'مسودة','Returned to PM':'معادة لمدير المشروع',Submitted:'مقدَّمة للمكتب','PMO Review':'قيد المراجعة',Reviewed:'تمت المراجعة','Awaiting Approval':'بانتظار الاعتماد',Approved:'معتمدة'};
const TODAY=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Dubai'}));
const dd=s=>s?new Date(String(s).slice(0,10)+'T00:00:00'):null;
const days=(a,b)=>Math.round((b-a)/DAY);
const fdt=d=>{if(!d)return '—';const x=d instanceof Date?d:dd(d);const o={day:'numeric',month:'long'};if(x.getFullYear()!=new Date().getFullYear())o.year='numeric';return x.toLocaleDateString('ar-AE-u-nu-latn',o)};
const lateTxt=n=>n>365?'بأكثر من سنة':'بـ '+n+' يومًا';
const ago=s=>{if(!s)return '—';const h=Math.round((Date.now()-new Date(s))/36e5);return h<1?'قبل دقائق':h<24?'قبل '+h+' ساعة':'قبل '+Math.round(h/24)+' يوم'};
const hhmm=s=>new Date(s).toLocaleTimeString('ar-AE-u-nu-latn',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Dubai'});
const cnt=(n,one,two,few,many)=>n==1?one:n==2?two:n+(n<=10?' '+few:' '+many);

/* ===================== data ===================== */
async function load(force){if(LOADING)return;LOADING=true;
 try{
  const [a,b]=await Promise.all([sb.rpc('room_overview'),sb.rpc('office_pending')]);
  if(a.error)throw a.error;D=a.data;OP=b.error?{services:[],tasks:[]}:(b.data||{services:[],tasks:[]});
  if(!PROF.length){try{const r=await sb.from('profiles').select('id,full_name,job_title,role');PROF=r.data||[]}catch(_){}}
  build();draw();$('upd').textContent='آخر تحديث '+hhmm(new Date());
  if(force)toast('تم تحديث البيانات');
 }catch(e){$('app').innerHTML='<div class="load">تعذّر تحميل البيانات: '+esc(e.message||e)+'</div>'}
 LOADING=false}

let PJ=[],SG=[],QU=[],SEC=[],H=null;
function wts(){let w=W0;try{if(D.w)w=Object.assign({},W0,JSON.parse(D.w))}catch(_){}return w}
function kAch(k,v){if(!v||v.x==null)return null;const t=v.t!=null?+v.t:(k.tg!=null?+k.tg:null),a=+v.x;if(t==null)return null;if(k.dir=='down'){if(a<=0)return t>=0?100:null;return Math.max(0,Math.min(200,t/a*100))}if(t==0)return a>=0?100:0;return Math.max(0,Math.min(200,a/t*100))}
function kOff(k){const v=(k.v||[])[0];const a=kAch(k,v);if(a==null)return null;const g=k.g!=null?+k.g:95,y=k.a!=null?+k.a:g-15;return a<y?'bad':a<g?'warn':'ok'}
function build(){const td=TODAY();td.setHours(0,0,0,0);const w=wts();
 const KP={},RK={};(D.kpis||[]).forEach(k=>(KP[k.pc]=KP[k.pc]||[]).push(k));(D.risks||[]).forEach(r=>(RK[r.pc]=RK[r.pc]||[]).push(r));
 const TK={},SVC={};(OP.tasks||[]).forEach(t=>(TK[t.pcode]=TK[t.pcode]||[]).push(t));(OP.services||[]).forEach(s=>(SVC[s.pcode]=SVC[s.pcode]||[]).push(s));
 PJ=(D.projects||[]).map(p=>{const o=Object.assign({},p);o.kp=KP[p.pc]||[];o.rk=RK[p.pc]||[];o.tk=(TK[p.pc]||[]);o.sv=SVC[p.pc]||[];
  o.appr=p.st=='Approved';o.done=o.appr&&p.act!=null&&+p.act>=100;o.halted=!!p.halt;
  o.kOff=o.kp.filter(k=>kOff(k)=='bad').length;o.kWarn=o.kp.filter(k=>kOff(k)=='warn').length;o.kPend=o.kp.reduce((s,k)=>s+(k.pend||[]).length,0);
  o.rHigh=o.rk.filter(r=>r.s>=15).length;o.rOver=o.rk.filter(r=>r.rev&&dd(r.rev)<td).length;o.rHighOver=o.rk.filter(r=>r.s>=15&&r.rev&&dd(r.rev)<td).length;
  const c={};
  c.s=o.appr&&!o.done&&p.act!=null?(+p.exp>0?Math.min(100,+p.act/ +p.exp*100):100):null;
  c.k=o.kp.length?Math.round(100*(1-(o.kOff+o.kWarn*.4)/o.kp.length)):null;
  c.r=o.rk.length?Math.max(0,100-o.rHigh*15-o.rOver*8):null;
  c.a=Math.max(0,100-Math.max(0,(+p.docmax||0)-3)*4);
  let sw=0,sv=0;[['s',w.s],['k',w.k],['r',w.r],['a',w.a]].forEach(([k,ww])=>{if(c[k]!=null){sw+=ww;sv+=c[k]*ww}});
  o.c=c;o.h=sw?Math.round(sv/sw):null;
  /* forecast */

 ['⏰','تذكير كل المكلّفين بالمهام المتأخرة','كل المشاريع',()=>{const k=(OP.tasks||[]).filter(t=>t.late>0&&t.owner).map(t=>t.key);remindSvc(k,'تذكير كل المهام المتأخرة')}],
 ['🎯','تحديد المشاريع الحرجة','للتصرف معها دفعة واحدة',()=>pick('bad')],['🎯','تحديد المشاريع التي تحتاج انتباهًا','',()=>pick('warn')],

function palClose(){$('pal').classList.remove('on')}
function palDraw(){const q=norm($('palq').value.trim());const has=s=>!q||norm(s).includes(q);PR=[];
 const G=(h,L)=>{if(L.length)PR.push({h}),L.forEach(x=>PR.push(x))};
 G('المشاريع',PJ.filter(p=>has(p.name+' '+p.pc+' '+p.pm+' '+secName(p.sec))).slice(0,q?8:5).map(p=>({ic:'🗂',t:p.name,s:p.pc+' · '+secName(p.sec)+' · '+(p.pm||'')+(p.h!=null?' · الصحة '+p.h:''),f:()=>insp(p.pc)})));
 G('القطاعات',SEC.filter(s=>q&&has(s.name)).map(s=>({ic:'🧭',t:s.name,s:s.L.length+' مشروع · الصحة '+(s.h??'—'),f:()=>secOpen(s.id)})));
 if(q)G('الوثائق',(OP.services||[]).filter(s=>has(s.pname+' '+s.code+' '+SVN[s.svc]+' '+(s.holders||[]).map(h=>h.name).join(' '))).slice(0,6).map(s=>({ic:'📄',t:SVN[s.svc]+' «'+(s.pname||s.code)+'»',s:(STN[s.status]||s.status)+' · '+s.days+' يوم'+((s.holders||[]).length?' · لدى '+s.holders.map(h=>h.name).join('، '):''),f:()=>tool(SV[s.svc]+'#o='+s.id,SVN[s.svc]+' · '+(s.pname||'')),b:s.office?null:['تذكير',()=>remindSvc([s.key],'تذكير')]})));
 if(q)G('الأشخاص',PROF.filter(u=>has(u.full_name+' '+(u.job_title||''))).slice(0,5).map(u=>({ic:'👤',t:u.full_name,s:(u.job_title||'')+' · '+PJ.filter(p=>p.pm==u.full_name).length+' مشروع يديره',f:()=>person(u)})));
 G('الأوامر',CMDS.filter(c=>has(c[1]+' '+c[2])).map(c=>({ic:c[0],t:c[1],s:c[2],f:c[3]})));
 G('الأدوات',TOOLS.filter(t=>has(t[1]+' '+t[2])).slice(0,q?8:4).map(t=>({ic:'🧰',t:t[1],s:t[2],f:()=>tool(t[0],t[1])})));
 const items=PR.filter(x=>!x.h);PS=Math.min(PS,Math.max(0,items.length-1));let k=-1;
 $('palr').innerHTML=PR.map(x=>{if(x.h)return `<div class="gh">${esc(x.h)}</div>`;k++;const i=k;return `<div class="pr${i==PS?' sel':''}" data-i="${i}" onclick="palRun(${i})"><span class="ic">${x.ic}</span><span class="tx"><b>${esc(x.t)}</b><small>${esc(x.s||'')}</small></span>${x.b?`<button class="btn" type="button" onclick="event.stopPropagation();palClose();PR.filter(z=>!z.h)[${i}].b[1]()">${esc(x.b[0])}</button>`:''}</div>`}).join('')||'<div class="empty">لا نتائج</div>'}
function palRun(i){const x=PR.filter(z=>!z.h)[i];if(!x)return;palClose();x.f()}
function person(u){const L=PJ.filter(p=>p.pm==u.full_name),docs=(OP.services||[]).filter(s=>(s.holders||[]).some(h=>h.id==u.id)),tk=(OP.tasks||[]).filter(t=>t.owner&&t.owner.id==u.id&&t.late>0);
 $('drt').innerHTML=`<small>فاحص الشخص</small><b>${esc(u.full_name)}</b><span class="dim" style="font-size:13px">${esc(u.job_title||'')}</span>`;
 $('drb').innerHTML=`<div class="kv"><div><small>مشاريع يديرها</small><b class="num">${L.length}</b></div><div><small>وثائق لديه</small><b class="num ${docs.length?'wn':''}">${docs.length}</b></div><div><small>مهام متأخرة</small><b class="num ${tk.length?'bd':''}">${tk.length}</b></div></div>
  <div class="grp"><small>إجراءات</small><div class="bs"><button class="btn pr" type="button" onclick="personMsg('${esc(u.id)}','${esc(u.full_name)}')">✉ رسالة</button>${docs.length?`<button class="btn" type="button" onclick="remindSvc(${esc(JSON.stringify(docs.map(d=>d.key)))},'تذكير ${esc(u.full_name)}')">تذكير بالوثائق</button>`:''}${tk.length?`<button class="btn" type="button" onclick="remindSvc(${esc(JSON.stringify(tk.map(d=>d.key)))},'تذكير ${esc(u.full_name)}')">تذكير بالمهام</button>`:''}<button class="btn" type="button" onclick="tool('perms.html#users','المستخدمون والصلاحيات')">الصلاحيات</button><button class="btn" type="button" onclick="tool('perf.html','أداء المستخدمين')">الأداء</button></div></div>
  ${L.length?`<div class="grp"><small>مشاريعه</small><div class="lst">${L.map(p=>`<div><span><span style="color:${colOf(p)}">●</span> <a href="#" onclick="insp('${esc(p.pc)}');return false">${esc(p.name)}</a></span><span class="dim num">${p.h??'—'}</span></div>`).join('')}</div></div>`:''}
  ${docs.length?`<div class="grp"><small>وثائق تنتظره</small><div class="lst">${docs.map(s=>`<div><span>${esc(SVN[s.svc])} «${esc(s.pname)}»</span><span class="dim num">${s.days} يوم</span></div>`).join('')}</div></div>`:''}`;drOpen('dr')}
