label{display:block;font-size:13px;color:#6b7385;margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid #d9dde5;border-radius:8px;font:inherit;background:#fff;color:#1d2330}
input[dir=ltr]{text-align:left}
textarea{min-height:60px}input:disabled,select:disabled,textarea:disabled{background:#eef0f4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.g2{grid-template-columns:1fr}}
button{font:inherit;padding:8px 13px;border-radius:8px;border:1px solid #d9dde5;background:#fff;cursor:pointer}
.p{background:#2457d6;color:#fff;border-color:#2457d6}.g{background:#1b8a4b;color:#fff;border-color:#1b8a4b}.r{background:#c23b3b;color:#fff;border-color:#c23b3b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:#2457d6;color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border-bottom:1px solid #d9dde5;padding:4px;text-align:start;font-size:13px}td input,td select{padding:5px}
.sig{border:1px dashed #c4c9d4;border-radius:10px;padding:10px;margin-bottom:8px}
.srow{display:flex;justify-content:space-between;gap:6px;padding:4px 0}.sig img{max-height:56px;display:block;margin-top:4px}
.log{font-size:12px;color:#6b7385;max-height:150px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px}.modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:14px;width:100%;max-width:420px}
canvas{width:100%;height:140px;border:1px solid #d9dde5;border-radius:8px;touch-action:none;display:block}
