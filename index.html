async function start(){
 curView=start;editing=false;
 if(!sb){app.innerHTML=`<div class="card" style="max-width:420px;margin:40px auto"><h1>${t('appTitle')}</h1><p>${t('almost')}</p></div>`;return}

 if(!session)return loginView();

 users={};ps.forEach(p=>users[p.id]=p);me=users[session.user.id];listView();
}
function loginView(){curView=loginView;editing=false;

<label>${t('fullName')}</label><input id="fn"><label>${t('email')}</label><input id="em" type="email" dir="ltr"><label>${t('password')}</label><input id="pw" type="password" dir="ltr">

 const {error}=await sb.auth.signInWithPassword({email:e,password:p});error?msg(error.message):start()}

 if(!a.data)return listView();

 const adm=me.role=='admin',fin=st=='Approved'||st=='Rejected';

 curView=()=>openCR(id);editing=ed;

 let acts='';
 if(ed)acts+=`<button onclick="save()">${t('saveDraft')}</button><button class="p" onclick="submitCR()">${t('submit')}</button>`;

 if(mine)acts+=`<button class="g" onclick="openSign(${mine.id},'${stage}')">${t('sign')}</button>`;
 if(canRet)acts+=`<button class="r" onclick="ret()">${t('returnPM')}</button>`;
 if(!arch&&st=='Awaiting Approval'&&sigs.some(s=>s.user_id==me.id&&s.stage=='approved'&&s.status=='pending'))acts+=`<button class="r" onclick="rej()">${t('reject')}</button>`;
 if(adm)acts+=`<button onclick="archiveCR(${!arch})">${arch?t('restore'):t('archive')}</button>`;
 if(cr.created_by==me.id||adm)acts+=`<button class="r" onclick="delCR()">${t('del')}</button>`;
 app.innerHTML=bar()+`<div class="card"><div class="top"><div><h1>${esc(cr.code)} · ${t('version')} ${cr.version}</h1><span class="mut">${t('createdCol')}: ${esc(users[cr.created_by]?.full_name)}</span></div><span class="pill">${esc(t('st_'+st))}</span></div>
 ${arch?`<div class="sig" style="margin-top:8px">📁 ${t('archBanner')}</div>`:''}
 ${cr.comment?`<div class="sig" style="margin-top:8px"><b>${t('latest')}</b> ${esc(cr.comment)}</div>`:''}</div>
 <div class="card"><h2>${t('projDetails')}</h2><div class="g2">${F.map(k=>`<div><label>${t('f_'+k)} *</label>${k=='prio'?`<select data-k="prio" ${dis}>${['','Low','Medium','High','Critical'].map(o=>`<option value="${o}" ${d.prio==o?'selected':''}>${o?t('p_'+o):''}</option>`).join('')}</select>`:`<input data-k="${k}" type="${k=='edate'?'date':'text'}" value="${esc(d[k])}" ${dis}>`}</div>`).join('')}</div></div>
 <div class="card"><h2>${t('changeDetails')}</h2>${T.map(k=>`<label>${t('f_'+k)} *</label><textarea data-k="${k}" ${dis}>${esc(d[k])}</textarea>`).join('')}</div>
 <div class="card"><h2>${t('stakeTitle')}</h2><div class="mut">${t('stakeNote')}</div>${cr.stakeholders.length?`<div class="scroll"><table><tr><th>${t('thName')}</th><th>${t('thType')}</th><th>${t('thImpact')}</th><th>${t('thHow')}</th><th></th></tr>${cr.stakeholders.map((x,i)=>`<tr><td><input data-i="${i}" data-s="n" value="${esc(x.n)}" ${dis}></td><td><select data-i="${i}" data-s="t" ${dis}><option value="Internal" ${x.t=='Internal'?'selected':''}>${t('Internal')}</option><option value="External" ${x.t=='External'?'selected':''}>${t('External')}</option></select></td><td><input data-i="${i}" data-s="i" value="${esc(x.i)}" ${dis}></td><td><input data-i="${i}" data-s="c" value="${esc(x.c)}" ${dis}></td><td>${ed?`<button onclick="delSh(${i})">✕</button>`:''}</td></tr>`).join('')}</table></div>`:''}${ed?`<div class="row"><button onclick="addSh()">${t('addStake')}</button></div>`:''}</div>
 <div class="card"><h2>${t('workflow')}</h2>${canAdm&&st=='Submitted'?`<div class="mut" style="margin-bottom:8px">${t('adminNote')}</div>`:''}${blk('created',ed||canAdm)}${showRA?blk('reviewed',canAdm)+blk('approved',canAdm):''}<div class="row">${acts}</div></div>
 <div class="card"><h2>${t('auditLog')}</h2><div class="log">${logs.map(l=>`<div>${fd(l.at)} · <b>${esc(l.user_name)}</b>: ${esc(logT(l.action))}</div>`).join('')}</div></div>`}
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.k)cr.data[x.dataset.k]=x.value;if(x.dataset.i!==undefined)cr.stakeholders[x.dataset.i][x.dataset.s]=x.value});
const addSh=()=>{cr.stakeholders.push({n:'',t:'Internal',i:'',c:''});save(true)};
const delSh=i=>{cr.stakeholders.splice(i,1);save(true)};
async function save(q){const {error}=await sb.from('change_requests').update({data:cr.data,stakeholders:cr.stakeholders}).eq('id',cr.id);if(error)return msg(error.message);if(q!==false)await openCR(cr.id)}
async function addSig(sg){const s=$('as_'+sg);if(!s||!s.value)return;const u=s.value;if(sigs.some(x=>x.stage==sg&&x.user_id==u))return msg(t('already'));
 if(cr.created_by==me.id&&editing)await save(false);
 await sb.from('signatories').insert({cr_id:cr.id,stage:sg,user_id:u});await lg(cr.id,'assigned|'+users[u].full_name+'|'+sg);openCR(cr.id)}
async function rmSig(id){await sb.from('signatories').delete().eq('id',id);await lg(cr.id,'removed');openCR(cr.id)}
async function setStatus(s,extra={}){await sb.from('change_requests').update({status:s,...extra}).eq('id',cr.id);await lg(cr.id,'status|'+s)}
async function delCR(){if(!confirm(t('confirmDel')))return;const {error}=await sb.from('change_requests').delete().eq('id',cr.id);if(error)return msg(error.message);listView()}
async function archiveCR(v){const {error}=await sb.from('change_requests').update({archived:v}).eq('id',cr.id);if(error)return msg(error.message);await lg(cr.id,v?'archived':'restored');showArch=false;listView()}
async function submitCR(){
 await save(false);
 const miss=[...F,...T].filter(k=>!String(cr.data[k]||'').trim());
 if(miss.length)return msg(t('complete')+miss.map(k=>t('f_'+k)).join(', '));
 const cs=sigs.filter(s=>s.stage=='created');if(!cs.length||cs.some(s=>s.status!='signed'))return msg(t('creatorsSign'));
 await setStatus('Submitted');openCR(cr.id)}
async function sendReview(){
 if(!sigs.some(s=>s.stage=='reviewed')||!sigs.some(s=>s.stage=='approved'))return msg(t('needRev'));
 await setStatus('PMO Review');openCR(cr.id)}
async function ret(){const c=prompt(t('retPrompt'));if(!c)return;
 await sb.from('signatories').update({status:'pending',signature_img:null,signed_at:null}).eq('cr_id',cr.id);
 await setStatus('Returned to PM',{comment:c,version:cr.version+1});await lg(cr.id,'returned|'+c);openCR(cr.id)}
async function rej(){const c=prompt(t('rejPrompt'));if(!c)return;await setStatus('Rejected',{comment:c});await lg(cr.id,'rejected|'+c);openCR(cr.id)}

// ---- signing ----
function openSign(id,stage){pend={id,stage};tab('d');drawn=false;upImg=null;$('prev').style.display='none';$('file').value='';$('modal').classList.add('on');
 const c=$('cv');c.width=c.offsetWidth;c.height=c.offsetHeight;ctx=c.getContext('2d');ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#111'}
function tab(m){mode=m;$('pd').style.display=m=='d'?'':'none';$('pu').style.display=m=='u'?'':'none';$('td').className=m=='d'?'p':'';$('tu').className=m=='u'?'p':''}
$('td').onclick=()=>tab('d');$('tu').onclick=()=>tab('u');
const clr=()=>{ctx.clearRect(0,0,$('cv').width,$('cv').height);drawn=false};
const pos=e=>{const r=$('cv').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const cv=$('cv');cv.onpointerdown=e=>{down=true;const p=pos(e);ctx.beginPath();ctx.moveTo(...p);cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!down)return;const p=pos(e);ctx.lineTo(...p);ctx.stroke();drawn=true};cv.onpointerup=()=>down=false;
$('file').onchange=function(){const f=this.files[0];if(!f)return;
 if(!/^image\/(png|jpeg)$/.test(f.type))return msg(t('pngjpg'));if(f.size>1048576)return msg(t('big'));
 const r=new FileReader();r.onload=()=>{upImg=r.result;$('prev').src=upImg;$('prev').style.display='block'};r.readAsDataURL(f)};
async function confirmSign(){
 let img;if(mode=='d'){if(!drawn)return msg(t('drawFirst'));img=$('cv').toDataURL('image/png')}else{if(!upImg)return msg(t('uploadFirst'));img=upImg}
 if(cr.created_by==me.id&&pend.stage=='created')await save(false);
 await sb.from('signatories').update({status:'signed',signature_img:img,signed_at:new Date().toISOString()}).eq('id',pend.id);
 await lg(cr.id,'signed|'+pend.stage);
 const {data}=await sb.from('signatories').select('*').eq('cr_id',cr.id);
 const all=s=>{const a=data.filter(x=>x.stage==s);return a.length&&a.every(x=>x.status=='signed')};
 if(cr.status=='PMO Review'&&all('reviewed'))await setStatus('Awaiting Approval');
 else if(cr.status=='Awaiting Approval'&&all('approved'))await setStatus('Approved');
 $('modal').classList.remove('on');openCR(cr.id)}
