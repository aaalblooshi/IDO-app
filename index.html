<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--r2:#fdecee;--am:#b7791f;--am2:#fdf3df;--ch:#23272b;--fnt:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.65 var(--fnt);background:radial-gradient(800px 380px at 100% -60px,#dcefe3 0,transparent 62%),radial-gradient(700px 340px at 0 -80px,#fbe4e6 0,transparent 58%),var(--bg);background-attachment:fixed;min-height:100vh}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1000px;margin:0 auto;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}
.stripe{display:flex;height:4px}.stripe i{flex:1}.stripe i:nth-child(1){background:#BF9849}.stripe i:nth-child(2){background:#3EA3DC}.stripe i:nth-child(3){background:#1d5f8a}.stripe i:nth-child(4){background:#c9d6e2}
button{font:inherit;font-weight:700;cursor:pointer}
#lb{padding:7px 16px;border-radius:99px;border:0;background:var(--ch);color:#fff;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.mine{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(35,39,43,.04),0 8px 24px rgba(35,39,43,.06)}
