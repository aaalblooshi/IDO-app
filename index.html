<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#23272b">
<title>Change Request System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--r2:#fdecee;--am:#b7791f;--am2:#fdf3df;--ch:#23272b;--fnt:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:14.5px/1.6 var(--fnt);background:radial-gradient(800px 380px at 100% -60px,#dcefe3 0,transparent 62%),radial-gradient(700px 340px at 0 -80px,#fbe4e6 0,transparent 58%),var(--bg);background-attachment:fixed;min-height:100vh}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:900px;margin:0 auto;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:44px;width:auto;display:block}
.ttl{max-width:900px;margin:0 auto;padding:0 14px 7px;font-weight:800;font-size:17px;color:var(--ch);display:flex;align-items:center;gap:8px}.ttl:before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(var(--r) 0 50%,var(--g) 50% 100%)}
.stripe{display:flex;height:4px}.stripe i{flex:1}.stripe i:nth-child(1){background:#d1101d}.stripe i:nth-child(2){background:#0a6b3d}.stripe i:nth-child(3){background:#1b1d1f}.stripe i:nth-child(4){background:#a8a7a7}
#lb{padding:6px 14px;border-radius:99px;font-size:13px;background:var(--ch);color:#fff;border-color:var(--ch)}
#app{max-width:900px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(35,39,43,.04),0 6px 18px rgba(35,39,43,.05)}
h1{font-size:20px;margin:0 0 6px;font-weight:800}h2{font-size:16px;margin:0 0 8px;font-weight:800;color:var(--ch)}.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:8px 0 3px}.rq{color:var(--r)}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(10,107,61,.15)}
input[dir=ltr]{text-align:start}
input:disabled,select:disabled{background:#f7f5ef;-webkit-text-fill-color:var(--ink);opacity:1;border-color:#ece8de}
textarea.ta{resize:none;overflow:hidden;line-height:1.65;display:block}
.ta-w{position:relative}.ta-w.clamped::after{content:"⌄";position:absolute;inset-inline:0;bottom:1px;text-align:center;height:24px;line-height:30px;color:var(--g);font-weight:800;background:linear-gradient(transparent,#fff 80%);border-radius:0 0 10px 10px;pointer-events:none}
.ro{background:#f7f5ef;border:1.5px solid #ece8de;border-radius:10px;padding:9px 11px;font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:76px;overflow:hidden;position:relative;cursor:pointer}
.ro.open{max-height:none}.ro.more::after{content:"⌄";position:absolute;inset-inline:0;bottom:0;text-align:center;height:26px;line-height:34px;color:var(--g);font-weight:800;background:linear-gradient(rgba(247,245,239,0),#f7f5ef 80%)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.fg .full{grid-column:1/-1}
button{font:inherit;font-weight:700;padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .15s}
button:active{transform:scale(.97)}
.p,.g{background:linear-gradient(135deg,#0a6b3d,#0f8d52);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(10,107,61,.25)}
.r{background:var(--r);color:#fff;border-color:transparent}
.sm{padding:4px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--ch);color:#fff;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-block}
.pill.s-d{background:#8a8f96}.pill.s-ret{background:var(--am)}.pill.s-ok{background:var(--g)}.pill.s-no{background:var(--r)}.pill.act{background:var(--r)}
.nav{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}.nav::-webkit-scrollbar{display:none}.nav>*{flex:0 0 auto}
.nv{padding:5px 13px;border-radius:99px;font-size:13.5px;background:#fff}.nv.on{background:var(--ch);color:#fff;border-color:var(--ch)}
.uchip{font-size:12.5px;color:var(--mut);font-weight:600}
.hero{border-radius:18px;padding:16px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#1b1d1f 0%,#2a3036 55%,#0a6b3d 170%);border-inline-start:6px solid var(--r);box-shadow:0 8px 24px rgba(35,39,43,.2)}
.hero h2{color:#fff;margin:0;font-size:19px}.hero .mut{color:#c9cdd2}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.k{border:1px solid var(--line);border-top:4px solid var(--g);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut);background:#fff;line-height:1.35}
.k b{display:block;font-size:26px;line-height:1.2;color:var(--ink)}.k.on{background:var(--g2);border-color:var(--g)}.k.hot{border-top-color:var(--r)}.k.hot b{color:var(--r)}
.k:nth-child(2){border-top-color:var(--ch)}.k:nth-child(3){border-top-color:var(--am)}.k:nth-child(4){border-top-color:var(--g)}.k:nth-child(5){border-top-color:var(--r)}.k:nth-child(n+6){border-top-color:#a8a7a7}
.item{border:1px solid var(--line);border-inline-start:4px solid var(--g);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.pg{display:flex;gap:3px;margin:6px 0}.pg i{flex:1;height:6px;border-radius:3px;background:#e9e5da}.pg i.on{background:linear-gradient(90deg,var(--g),#2fa569)}
.hb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.hb span{width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb div{flex:1;background:#eeeadf;border-radius:5px;height:10px}.hb i{display:block;height:10px;background:linear-gradient(90deg,var(--g),#2fa569);border-radius:5px}.hb b{min-width:22px;text-align:end}
details.acc{padding:0}details.acc>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;color:var(--ch)}
details.acc>summary::-webkit-details-marker{display:none}details.acc>summary::after{content:"⌄";color:var(--g);font-size:20px;transition:transform .2s}details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc>.in{padding:0 14px 14px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:start;font-size:13px}
.crh{border-inline-start:6px solid var(--g)}
.fp{margin:0 0 8px}.fp .bg{height:6px;border-radius:3px;background:#e9e5da;overflow:hidden}.fp .bg i{display:block;height:6px;width:0;background:linear-gradient(90deg,var(--r),var(--am),var(--g));transition:width .25s}.fp .mut{font-size:12px;margin-top:2px}
.tabs{position:sticky;top:var(--hh,90px);z-index:15;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 1px 8px;margin-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;white-space:nowrap;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mut);background:#fff}
.tb.on{background:var(--ch);color:#fff;border-color:var(--ch)}
.tb .bd{background:var(--r);color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:0 6px;margin-inline-start:6px;display:none}
.pn{display:none}.pn.on{display:block}
.sec{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--ch);margin:0 0 4px}.sec::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--r)}
.sh{border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;margin:8px 0;background:#fcfbf8;position:relative}.sh>button{position:absolute;top:8px;inset-inline-end:8px}
.sig{border:1px solid var(--line);border-inline-start:4px solid var(--ch);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fcfbf8}
.sig.st1{border-inline-start-color:var(--am)}.sig.st2{border-inline-start-color:var(--g)}
.srow{display:flex;justify-content:space-between;gap:6px;padding:4px 0}.sig img{max-height:56px;display:block;margin-top:4px}
.al{color:var(--g);font-weight:700;text-decoration:underline;word-break:break-word}.sig.att{border-inline-start-color:var(--r)}
.hr2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nw{background:#fff;color:var(--g);border-color:#fff;font-weight:800;padding:9px 16px}
.lr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.lr label{flex:1}.nbtn{padding:0 8px;font-size:13px;line-height:22px;border-radius:99px;background:#fff;margin-top:4px;flex:0 0 auto}.nbtn.has{background:var(--am2);border-color:var(--am)}
.nbox textarea{margin-top:4px;border-color:var(--am);background:var(--am2);min-height:64px;resize:vertical;line-height:1.6}
.nbar{margin:0 0 8px}.nbar .mut{margin-top:6px}
.nt{margin-top:6px;border:1.5px solid var(--r);border-inline-start-width:5px;background:var(--r2);border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.nt.ap{border-color:var(--g);background:var(--g2)}.nt.ap b{color:var(--g)}.nt b{display:block;color:var(--r);font-size:12.5px;margin-bottom:2px;white-space:normal}.nt.old{border-color:var(--am);background:var(--am2)}.nt.old b{color:var(--am)}
.nbd{background:var(--am);color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:0 6px;margin-inline-start:6px}
.log{font-size:12.5px;color:var(--mut);max-height:200px;overflow:auto}
.actbar{position:fixed;inset-inline:0;bottom:0;z-index:15;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.actbar .row{margin:0;max-width:900px;margin-inline:auto;justify-content:center}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(20,22,24,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.modal.on{display:flex}
.box{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:420px;border-top:5px solid var(--g)}
canvas{width:100%;height:150px;border:1.5px dashed #bdb8aa;border-radius:12px;touch-action:none;display:block;background:#fcfbf8}
.lcard{max-width:400px;margin:24px auto;border-top:5px solid var(--g)}
@media(max-width:380px){.fg{grid-template-columns:1fr}.logo{height:38px}}
</style></head><body>

 DB.crs.forEach(r=>DB.by[r.id]={r:r,sg:[],rel:[],act:''});
 DB.sg.forEach(s=>{if(DB.by[s.cr_id])DB.by[s.cr_id].sg.push(s)});
 DB.crs.forEach(r=>{const x=DB.by[r.id],st=r.status,my=x.sg.filter(s=>s.user_id==me.id);
  if(r.created_by==me.id)x.rel.push('created');

  if(my.some(s=>s.stage=='approved'))x.rel.push('approver');
  if(r.created_by==me.id&&st=='Draft')x.act='a_draft';
  else if(r.created_by==me.id&&st=='Returned to PM')x.act='a_edit';
  else if(st=='PMO Review'&&my.some(s=>s.stage=='reviewed'&&s.status=='pending'))x.act='a_review';

  else if(adm&&st=='Submitted')x.act='a_assignRev';
  else if(adm&&st=='Reviewed')x.act='a_assignApp';

 })}

$('td').onclick=()=>tab('d');$('tu').onclick=()=>tab('u');
const clr=()=>{ctx.clearRect(0,0,$('cv').width,$('cv').height);drawn=false};
const pos=e=>{const r=$('cv').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const cv=$('cv');cv.onpointerdown=e=>{down=true;const p=pos(e);ctx.beginPath();ctx.moveTo(...p);cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!down)return;const p=pos(e);ctx.lineTo(...p);ctx.stroke();drawn=true};cv.onpointerup=()=>down=false;
$('file').onchange=function(){const f=this.files[0];if(!f)return;
 if(!/^image\/(png|jpeg)$/.test(f.type))return msg(t('pngjpg'));if(f.size>1048576)return msg(t('big'));
 const r=new FileReader();r.onload=()=>{upImg=r.result;$('prev').src=upImg;$('prev').style.display='block'};r.readAsDataURL(f)};
async function confirmSign(){
 let img;if(mode=='d'){if(!drawn)return msg(t('drawFirst'));img=$('cv').toDataURL('image/png')}else{if(!upImg)return msg(t('uploadFirst'));img=upImg}
 if(cr.created_by==me.id&&pend.stage=='created')await save(false);
 await sb.from('signatories').update({status:'signed',signature_img:img,signed_at:new Date().toISOString()}).eq('id',pend.id);
 await lg(cr.id,'signed|'+pend.stage);
 if(pend.stage=='approved'){const tx=$('ant').value.trim();if(tx){const {data:cur}=await sb.from('change_requests').select('data').eq('id',cr.id).single();const nd={...(cur?cur.data:cr.data)};nd._anotes=[...(Array.isArray(nd._anotes)?nd._anotes:[]),{by:me.full_name,at:new Date().toISOString(),text:tx}];await sb.from('change_requests').update({data:nd}).eq('id',cr.id);await lg(cr.id,'approvenote|'+tx)}}
 const {data}=await sb.from('signatories').select('*').eq('cr_id',cr.id);
 const all=s=>{const a=data.filter(x=>x.stage==s);return a.length&&a.every(x=>x.status=='signed')};
 if(cr.status=='PMO Review'&&all('reviewed'))await setStatus('Reviewed');
 else if(cr.status=='Awaiting Approval'&&all('approved'))await setStatus('Approved');
 $('modal').classList.remove('on');openCR(cr.id)}

// ---- admin ----
function adminView(){curView=adminView;editing=false;
 app.innerHTML=bar()+`<div class="card"><h2>${t('usersRoles')}</h2><div class="mut">${t('rolesNote')}</div></div>`+Object.values(users).map(u=>`<div class="card"><div class="top"><b>${esc(u.full_name)}</b><span class="pill">${t('role_'+u.role)}</span></div><div class="mut" dir="ltr" style="text-align:start">${esc(u.email)}</div><div class="fg"><div><label>${t('thJob')}</label><input id="j_${u.id}" value="${esc(u.job_title)}"></div><div><label>${t('thRole')}</label><select id="r_${u.id}">${['pm','pmo','sponsor','admin'].map(r=>`<option value="${r}" ${u.role==r?'selected':''}>${t('role_'+r)}</option>`).join('')}</select></div></div><div class="row"><button class="p" onclick="saveU('${u.id}')">${t('save')}</button></div></div>`).join('')}
async function saveU(id){const {error}=await sb.from('profiles').update({role:$('r_'+id).value,job_title:$('j_'+id).value}).eq('id',id);error?msg(error.message):(msg(t('saved')),start())}
applyStatic();start();
</script></body></html>
