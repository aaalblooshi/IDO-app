<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#23272b">
<title>خدمات مكتب التطوير المؤسسي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1d1f;--mut:#6b6f76;--line:#e4dfd4;--bg:#f4f2ec;--card:#fff;--g:#0a6b3d;--g2:#e5f2ea;--r:#d1101d;--r2:#fdecee;--am:#b7791f;--am2:#fdf3df;--ch:#23272b;--fnt:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.65 var(--fnt);background:radial-gradient(800px 380px at 100% -60px,#dcefe3 0,transparent 62%),radial-gradient(700px 340px at 0 -80px,#fbe4e6 0,transparent 58%),var(--bg);background-attachment:fixed;min-height:100vh}
#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1000px;margin:0 auto;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}
.stripe{display:flex;height:4px}.stripe i{flex:1}.stripe i:nth-child(1){background:#d1101d}.stripe i:nth-child(2){background:#0a6b3d}.stripe i:nth-child(3){background:#1b1d1f}.stripe i:nth-child(4){background:#a8a7a7}
button{font:inherit;font-weight:700;cursor:pointer}
#lb{padding:7px 16px;border-radius:99px;border:0;background:var(--ch);color:#fff;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px 22px;color:#fff;background:linear-gradient(135deg,#1b1d1f 0%,#2a3036 55%,#0a6b3d 170%);border-inline-start:7px solid var(--r);box-shadow:0 12px 32px rgba(35,39,43,.22);margin-bottom:16px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:260px;height:260px;inset-inline-end:-80px;top:-110px;background:radial-gradient(circle,rgba(10,107,61,.55),transparent 70%);animation:float 9s ease-in-out infinite}
.hero:after{width:200px;height:200px;inset-inline-end:90px;bottom:-120px;background:radial-gradient(circle,rgba(209,16,29,.35),transparent 70%);animation:float 11s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.hero h1{position:relative;margin:0 0 4px;font-size:clamp(23px,5.5vw,34px);font-weight:800;line-height:1.3}
.hero p{position:relative;margin:0;color:#c9cdd2;font-size:15px;max-width:560px}
.stats{position:relative;display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;backdrop-filter:blur(4px)}
.stat b{display:block;font-size:24px;line-height:1.2;font-weight:800}.stat span{font-size:12.5px;color:#c9cdd2}
.mine{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(35,39,43,.04),0 8px 24px rgba(35,39,43,.06)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mh h2{margin:0;font-size:18px;font-weight:800}.mh small{color:var(--mut);font-size:13px}
.pan{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}
.pan:last-child{margin-bottom:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:inherit;text-decoration:none}
.ph .ico{width:38px;height:38px;border-radius:12px}.ph .ico svg{width:20px;height:20px}
.ph b{flex:1;font-size:15.5px;line-height:1.4}.ph .go{width:20px;height:20px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;display:block;text-decoration:none;color:inherit;border:1.5px solid var(--line);border-top:5px solid var(--tc);border-radius:14px;padding:10px 11px 9px;background:#fff;transition:transform .18s,box-shadow .18s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 10px 22px rgba(35,39,43,.12);outline:0}
.tile b{display:block;font-size:30px;line-height:1.15;font-weight:800;color:var(--tc)}
.tile span{display:block;font-size:12.8px;color:var(--mut);line-height:1.4;margin-top:2px}
.tile.hot{background:var(--r2);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(209,16,29,.28)}50%{box-shadow:0 0 0 6px rgba(209,16,29,0)}}
.sk{height:84px;border-radius:14px;background:linear-gradient(90deg,#f1efe8 0,#faf9f5 50%,#f1efe8 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.login{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--mut)}
.login a{padding:9px 18px;border-radius:12px;background:var(--g);color:#fff;text-decoration:none;font-weight:700}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sbox{flex:1 1 220px;position:relative}
.sbox input{width:100%;font:inherit;padding:11px 42px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:0;transition:border-color .15s,box-shadow .15s}
.sbox input:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(10,107,61,.12)}
.sbox svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--mut)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 1px;flex:1 1 100%}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;transition:all .15s}
.chip.on{background:var(--ch);color:#fff;border-color:var(--ch);box-shadow:0 4px 12px rgba(35,39,43,.25)}
.axis{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(35,39,43,.04),0 8px 24px rgba(35,39,43,.06);overflow:hidden}
.axis.anim{opacity:0;transform:translateY(14px);animation:up .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes up{to{opacity:1;transform:none}}
.axh{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;border:0;background:transparent;text-align:start;color:var(--ink);position:relative}
.axh:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--ac)}
.ico{flex:0 0 auto;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac)}
.ico svg{width:25px;height:25px}
.axh .tt{flex:1;min-width:0}.axh h2{margin:0;font-size:19px;font-weight:800;line-height:1.35}.axh small{color:var(--mut);font-size:13px}
.cnt{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac)}
.chev{flex:0 0 auto;width:22px;height:22px;stroke:var(--mut);transition:transform .3s}
.axis.closed .chev{transform:rotate(-90deg)}[dir=rtl] .axis.closed .chev{transform:rotate(90deg)}
.body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease}.axis.closed .body{grid-template-rows:0fr}
.body>div{overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:4px 16px 16px}
.svc{position:relative;display:flex;flex-direction:column;gap:8px;padding:15px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.svc.live{cursor:pointer}
.svc.live:hover,.svc.live:focus-visible{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 14px 30px rgba(35,39,43,.13);outline:0}
.svc.live:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 9%,transparent),transparent 60%);opacity:0;transition:opacity .2s}
.svc.live:hover:before{opacity:1}
.svc .ico{width:42px;height:42px;border-radius:13px}.svc .ico svg{width:22px;height:22px}
.svc h3{margin:0;font-size:16.5px;font-weight:800;line-height:1.4;position:relative}
.svc p{margin:0;color:var(--mut);font-size:13.5px;flex:1;position:relative}
.svc .ft{display:flex;align-items:center;justify-content:space-between;position:relative;margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.badge.ok{background:var(--g2);color:var(--g)}.badge.soon{background:var(--am2);color:var(--am)}
.go{width:22px;height:22px;stroke:var(--ac);transition:transform .2s}
[dir=rtl] .go{transform:scaleX(-1)}[dir=rtl] .svc.live:hover .go{transform:scaleX(-1) translateX(5px)}[dir=ltr] .svc.live:hover .go{transform:translateX(5px)}
.svc.soon{background:repeating-linear-gradient(135deg,#fff 0 10px,#faf9f5 10px 20px);border-style:dashed;cursor:default}
.svc.soon .ico{background:#f0eee7;color:#8a8d93}.svc.soon h3{color:#4a4e55}
.empty{margin:4px 16px 16px;padding:22px;border:1.5px dashed var(--line);border-radius:16px;text-align:center;color:var(--mut);background:#faf9f5}
.empty b{display:block;color:var(--ink);font-size:16px}
.none{text-align:center;color:var(--mut);padding:26px}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:10px 0 26px}
mark{background:#fff0a8;border-radius:4px;padding:0 2px}
@media(max-width:520px){.hero{padding:22px 16px 18px}.axh{padding:13px 14px}.grid{padding:2px 12px 14px}.ico{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.axis{opacity:1;transform:none}}
.hb{display:inline-block;margin-inline-end:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}#hx{display:flex;flex-wrap:wrap;gap:0}.hin{flex-wrap:wrap}

/* ---- لوحتي: تصميم مضغوط ---- */
.mine{padding:12px 12px 10px;border-radius:16px;margin-bottom:12px}
.mh{margin-bottom:8px}.mh h2{font-size:16px}.mh small{font-size:12px}
.pan{padding:8px 10px 10px;margin-bottom:8px;border-radius:12px;border-width:1px}
.ph{margin-bottom:7px;gap:8px}.ph .ico{width:28px;height:28px;border-radius:9px}.ph .ico svg{width:15px;height:15px}.ph b{font-size:13.5px}.ph .go{width:16px;height:16px}
.tl{grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 4px;min-height:56px;border-width:1px;border-top-width:3px;border-radius:10px}
.tile b{font-size:20px;line-height:1.1}.tile span{font-size:11.5px;line-height:1.25;margin-top:2px}
.tile:hover,.tile:focus-visible{transform:none;box-shadow:0 3px 8px rgba(35,39,43,.12)}
.cust{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.ovb{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 22px}@media(min-width:700px){.ov{align-items:center}.ovb{border-radius:18px}}
.ovb h3{margin:12px 0 4px;font-size:15px}.ovr{display:flex;gap:6px;align-items:center;padding:4px 0}.ovr label{flex:1;display:flex;gap:8px;align-items:center;font-weight:600}.ovr input{width:20px;height:20px;accent-color:var(--g)}.ovr button,.ovb .bt{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-weight:700;cursor:pointer}.ovb .bt.p{background:var(--g);border-color:var(--g);color:#fff}
.ovr button{width:34px!important;height:30px!important;min-height:0!important;padding:0!important;font-size:12px!important;flex:none}.ovb .mh{display:flex;justify-content:space-between;align-items:flex-start}.ovb .mh .bt{width:34px;height:30px;padding:0}</style></head><body>
