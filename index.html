function tab(m){mode=m;$('pd').style.display=m=='d'?'':'none';$('pu').style.display=m=='u'?'':'none';$('td').className=m=='d'?'p':'';$('tu').className=m=='u'?'p':''}

const clr=()=>{ctx.clearRect(0,0,$('cv').width,$('cv').height);drawn=false};
const pos=e=>{const r=$('cv').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const cv=$('cv');cv.onpointerdown=e=>{down=true;const p=pos(e);ctx.beginPath();ctx.moveTo(...p);cv.setPointerCapture(e.pointerId)};

async function confirmSign(){
 let img;if(mode=='d'){if(!drawn)return msg(t('drawFirst'));img=$('cv').toDataURL('image/png')}else{if(!upImg)return msg(t('uploadFirst'));img=upImg}
 if(cr.created_by==me.id&&pend.stage=='created')await save(false);
 await sb.from('signatories').update({status:'signed',signature_img:img,signed_at:new Date().toISOString()}).eq('id',pend.id);
 await lg(cr.id,'signed|'+pend.stage);
 const {data}=await sb.from('signatories').select('*').eq('cr_id',cr.id);
 const all=s=>{const a=data.filter(x=>x.stage==s);return a.length&&a.every(x=>x.status=='signed')};
 if(cr.status=='PMO Review'&&all('reviewed'))await setStatus('Reviewed');
 else if(cr.status=='Awaiting Approval'&&all('approved'))await setStatus('Approved');
 $('modal').classList.remove('on');openCR(cr.id)}
