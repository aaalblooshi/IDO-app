 out.filter(x=>!x._par).forEach(rollup);
 out.forEach(x=>{const done=x._pc>=100,late=!done&&x._e!=null&&x._e<td;x._st=done?'done':late?'late':(x._s!=null&&x._s<=td&&x._pc>0)||x._pc>0?'prog':x._s!=null&&x._s<=td?'due':'todo';

  q('change_requests','id,code,status,archived,pc:data->>pcode'),q('closure_reports','id,code,status,archived,pc:data->>pcode'),
  sb.rpc('my_plans').then(r=>r.data||[],()=>[]),sb.rpc('my_links').then(r=>r.data||[],()=>[])]);
 LK=lk;
 await Promise.all(Object.keys(SVC).map(async k=>{const s=SVC[k];SG[k]=await sb.from(s.sg).select('cr_id,stage,status').eq('user_id',me.id).eq('status','pending').then(x=>x.data||[],()=>[])}));
 const by={},idc={};

function enrich(p){const live=p.pls,act=live.filter(x=>x.status=='Approved').sort((a,b)=>b.id-a.id)[0]||live.filter(x=>x.act=='true').sort((a,b)=>b.id-a.id)[0]||live.sort((a,b)=>b.id-a.id)[0]||null;
 p.pl=act;p.name=(p.ch&&p.ch.pn)||(act&&act.pn)||p.code;p.M=planModel(act&&act.tasks||[],me.id);
 const r=[];const c=p.ch;if((c&&(c.created_by==me.id||c.pm==me.full_name))||(act&&act.created_by==me.id))r.push('pm');if(c&&c.sp&&c.sp==me.full_name)r.push('ow');if(p.M.mine)r.push('tk');
 if(LK.some(l=>l.kind=='follower'&&((l.svc=='charter'&&c&&l.id==c.id)||(l.svc=='plan'&&p.pls.some(x=>x.id==l.id)))))r.push('fl');

function stageOf(p){const cl=p.cls[0],pl=p.pl,c=p.ch;if(cl&&cl.status=='Approved')return 4;if(pl&&(pl.status=='Approved'||pl.act=='true'))return 2;if(c&&c.status=='Approved')return 1;return 0}
function attOf(p){const out=[];const chk=(k,r,mine)=>{const sg=(SG[k]||[]).filter(s=>s.cr_id==r.id);
  if(r.status=='Awaiting Approval'&&sg.some(s=>s.stage=='approved'))out.push({c:'#2e8b57',l:['اعتماد','Approve']});
  else if(r.status=='PMO Review'&&sg.some(s=>s.stage=='reviewed'))out.push({c:'#3EA3DC',l:['مراجعة','Review']});
  else if(r.created_by==me.id&&r.status=='Draft')out.push({c:'#7a6740',l:['إكمال وتقديم','Complete & submit']});
  else if(r.created_by==me.id&&r.status=='Returned to PM')out.push({c:'#d9534f',l:['تعديل وإعادة إرسال','Edit & resubmit']})};
 if(p.ch)chk('charter',p.ch);p.pls.forEach(x=>{if(!x.restricted)chk('plan',x)});p.crs.forEach(x=>chk('cr',x));p.cls.forEach(x=>chk('closure',x));
 if(p.M.mineLate)out.push({c:'#d9534f',l:['مهام متأخرة ('+p.M.mineLate+')','Late tasks ('+p.M.mineLate+')']});
 return out}
const isLate=p=>p.M.late>0&&(p.roles.some(r=>r=='pm'||r=='ow'||r=='of')||p.M.mineLate>0);
function match(p){const q=Q.trim().toLowerCase();if(q&&!((p.name||'')+' '+p.code).toLowerCase().includes(q))return false;
 if(FLT=='all')return true;if(FLT=='act')return p.att.length>0;if(FLT=='late')return isLate(p);return p.roles.includes(FLT)}
function jr(p){const S=[[P(['ميثاق','Charter']),p.ch?(p.ch.status=='Approved'?'d':''):'n'],[P(['خطة','Plan']),p.stage>=2?'d':''],[P(['تنفيذ','Execution']),p.stage>=4?'d':''],[P(['إغلاق','Closure']),p.stage>=4?'d':'']];
 const vis=p.ch?S:S.slice(1,3);let c=vis.findIndex(x=>x[1]=='');if(p.stage>=2&&p.stage<4&&p.ch)c=2;else if(p.stage>=2&&p.stage<4&&!p.ch)c=1;
 return '<div class="jr">'+vis.map((x,i)=>'<div class="st '+(x[1]=='d'?'d':i==c?'c':'')+'"><i></i>'+esc(x[0])+'</div>').join('')+'</div>'}
function card(p){const M=p.M,hasT=M.leaves.length,late=isLate(p),cls=late?'l':p.att.length?'a':p.stage>=4?'d':'';
 const st=p.ch?stN(p.ch.status):(p.pl?stN(p.pl.status):'');
 const prog=hasT?'<div class="bar"><i style="width:'+Math.round(M.pct)+'%'+(M.late?';background:var(--r)':'')+'"></i><u style="inset-inline-start:'+Math.round(M.exp)+'%"></u></div><small style="'+(M.pct+1<M.exp?'color:var(--r);font-weight:700':'color:var(--ok);font-weight:700')+'">'+P(['إنجاز ','Progress '])+Math.round(M.pct)+'%'+(M.exp-M.pct>=1?P([' · متأخر ',' · behind '])+Math.round(M.exp-M.pct)+'%':M.pct-M.exp>=1?P([' · متقدّم ',' · ahead '])+Math.round(M.pct-M.exp)+'%':'')+(M.late?' · '+M.late+' '+P(['مهام متأخرة','late']):'')+'</small>':'<div class="bar"><i style="width:0"></i></div><small>'+P(['لم يبدأ التنفيذ بعد','Execution not started'])+'</small>';
 const nxt=M.mine?M.leaves.filter(x=>x._me&&x._st!='done'&&x._e!=null).sort((a,b)=>a._e-b._e)[0]:null;
 return '<div class="pc '+cls+'"><a class="tt" href="project.html?pc='+encodeURIComponent(p.code)+'"><h4>'+esc(p.name)+'</h4></a><small><span dir="ltr">'+esc(p.code)+'</span>'+(st?' · '+esc(st):'')+'</small>'+
 '<div class="row" style="margin-top:7px">'+p.roles.map(r=>'<span class="pill" style="background:'+RC[r]+'">'+esc(P(RL[r]))+(r=='tk'?' ('+M.mine+')':'')+'</span>').join('')+p.att.map(a=>'<span class="pill" style="background:'+a.c+'">⏳ '+esc(P(a.l))+'</span>').join('')+'</div>'+
 jr(p)+prog+(nxt?'<small>'+P(['أقرب مهامك: ','Next task of yours: '])+(p.pl&&p.pl.restricted?esc(nxt.n):esc(nxt.n))+' · '+fd(nxt._e)+'</small>':'')+
 '<div class="row" style="margin-top:auto;padding-top:10px"><a class="btn p" href="project.html?pc='+encodeURIComponent(p.code)+'#plan">'+P(['عرض الخطة','View plan'])+'</a>'+(M.mine?'<a class="btn" href="project.html?pc='+encodeURIComponent(p.code)+'#tasks">'+P(['مهامي','My tasks'])+'</a>':'')+(p.ch?'<a class="btn" href="project.html?pc='+encodeURIComponent(p.code)+'#req">'+P(['الطلبات','Requests'])+'</a>':'')+'</div></div>'}
function listV(L){return '<div class="tw"><table><thead><tr><th>'+P(['المشروع','Project'])+'</th><th>'+P(['الحالة','Status'])+'</th><th>'+P(['دوري','My role'])+'</th><th>'+P(['الإنجاز','Progress'])+'</th><th>'+P(['متأخرة','Late'])+'</th><th>'+P(['بانتظار إجرائي','Awaiting me'])+'</th><th></th></tr></thead><tbody>'+L.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="mut" dir="ltr" style="text-align:start">'+esc(p.code)+'</div></td><td>'+esc(p.ch?stN(p.ch.status):'')+'</td><td>'+p.roles.map(r=>'<span class="pill" style="background:'+RC[r]+'">'+esc(P(RL[r]))+'</span>').join(' ')+'</td><td>'+(p.M.leaves.length?Math.round(p.M.pct)+'% <span class="mut">/ '+Math.round(p.M.exp)+'%</span>':'—')+'</td><td>'+(p.M.late?'<b style="color:var(--r)">'+p.M.late+'</b>':'0')+'</td><td>'+(p.att.map(a=>'<span class="pill" style="background:'+a.c+'">'+esc(P(a.l))+'</span>').join(' ')||'—')+'</td><td><a class="btn p" href="project.html?pc='+encodeURIComponent(p.code)+'">'+P(['فتح','Open'])+'</a></td></tr>').join('')+'</tbody></table></div>'}
function timeV(L){const R=L.filter(p=>p.M.start!=null);if(!R.length)return '<div class="card"><div class="none">'+P(['لا توجد خطط بتواريخ.','No plans with dates.'])+'</div></div>';
 const td=today(),s0=Math.min.apply(0,R.map(p=>p.M.start))-5,e0=Math.max(Math.max.apply(0,R.map(p=>p.M.end)),td)+5,tot=e0-s0,pct=d=>(d-s0)/tot*100,side='inset-inline-start';
 const mo=[];{const t=new Date(s0*DAY);let d=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),1));while(Math.floor(d.getTime()/DAY)<e0){mo.push({a:Math.floor(d.getTime()/DAY),l:new Intl.DateTimeFormat(LOC(),{month:'short',year:'2-digit',timeZone:'UTC'}).format(d)});d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1))}}
 const mh=mo.map((m,i)=>{const nx=mo[i+1]?mo[i+1].a:e0,wd=(nx-Math.max(m.a,s0))/tot*100;return '<div class="mo" style="'+side+':'+pct(Math.max(m.a,s0))+'%">'+(wd>4?esc(m.l):'')+'</div>'}).join(''),grid=mo.map(m=>'<div class="mo" style="'+side+':'+pct(Math.max(m.a,s0))+'%"></div>').join('');
 const tl='<i class="tdl" style="'+side+':'+pct(td)+'%"></i>';
 return '<div class="gw"><div class="gi" style="min-width:'+Math.max(900,tot*1.6+250)+'px"><div class="gr h"><div class="gl">'+P(['المشروع','Project'])+'</div><div class="gt">'+mh+'</div></div>'+R.map(p=>{const c=p.M.late?'var(--r)':'var(--b)',M=p.M;return '<div class="gr"><div class="gl"><span class="nm"><a href="project.html?pc='+encodeURIComponent(p.code)+'#plan" style="text-decoration:none">'+esc(p.name)+'</a></span></div><div class="gt">'+grid+tl+'<div class="bk" style="'+side+':'+pct(M.start)+'%;width:'+Math.max(.8,(M.end-M.start+1)/tot*100)+'%;background:'+c+'33;border:1.5px solid '+c+'"><i style="width:'+Math.round(M.pct)+'%;background:'+c+'"></i></div></div></div>'}).join('')+'</div></div><div class="lg"><span><b style="background:var(--b)"></b>'+P(['في المسار','On track'])+'</span><span><b style="background:var(--r)"></b>'+P(['فيه مهام متأخرة','Has late tasks'])+'</span><span style="margin-inline-start:auto">│ '+P(['الخط الأحمر = اليوم','Red line = today'])+'</span></div>'}
function draw(){applyLang();document.title=P(['مشاريعي','My projects']);$('ttl').textContent=P(['مشاريعي','My projects']);$('bk').textContent='⬅ '+P(['الرئيسية','Home']);

 const CH=[['all',['الكل','All']],['pm',RN.pm],['ow',RN.ow],['tk',RN.tk],['fl',RN.fl],['pt',RN.pt],['act',['تحتاج إجرائي','Need my action']],['late',['متأخرة','Late']]].filter(c=>c[0]=='all'||c[0]=='act'||c[0]=='late'||cnt(c[0])>0);
