 $('body').innerHTML=`<div class="card"><div class="kp"><div><b>${A.n}</b><span>${t('kP')}</span></div><div><b class="${h}">${pct(A.a)}</b><span>${t('kA')}</span></div><div><b>${pct(A.ex)}</b><span>${t('kE')}</span></div><div><b class="${A.late?'bad':'ok'}">${A.late}</b><span>${t('kL')}</span></div></div>${pbar(A.a,A.ex)}<div class="mut">${t('legend')}</div></div>
 ${A.rows.map(r=>{const g=hl(r.ex-r.a,r.late);return `<div class="card"><div class="tp" style="display:flex;justify-content:space-between;gap:8px"><b>${dot(g)} ${esc(secN(r.sc))}</b><span class="mut"><span class="num">${r.L.length}</span> ${t('cnt')} · ${t('h_'+g)}</span></div>
 <div class="mut">${t('act')} <b class="num">${pct(r.a)}</b> · ${t('exp')} <span class="num">${pct(r.ex)}</span> · ${t('late')} <b class="num ${r.late?'bad':''}">${r.late}</b></div>${pbar(r.a,r.ex)}
 ${r.L.map(p=>{const q=hl(p.gap,p.lateN);return `<div style="padding:6px 0;border-top:1px dashed var(--line)"><a href="#" onclick="FP='${esc(p.k)}';FS='${p.sc}';TAB='tree';EXP.add('p:${esc(p.k)}');draw();return false" style="color:inherit;text-decoration:none">${dot(q)} <b>${esc(p.name)}</b></a> <span class="mut"><span class="num">${pct(p.a)}</span> / <span class="num">${pct(p.ex)}</span>${p.lateN?` · <span class="bad num">${p.lateN}</span> ${t('late')}`:''}</span>${pbar(p.a,p.ex)}</div>`}).join('')}</div>`}).join('')}`}
/* ---- portfolio tree ---- */
const tg=k=>{EXP.has(k)?EXP.delete(k):EXP.add(k);vTree()};
function trow(task,an,lv,pk,kids){const a=an.t[task.id]||{a:0,ex:0,late:0},k='t:'+pk+':'+task.id,has=(kids[task.id]||[]).length,op=EXP.has(k),g=hl(a.ex-a.a,a.late?1:0);
 let h=`<div class="pr" style="padding-inline-start:${lv*16}px"><span class="tgl" onclick="${has?`tg('${k}')`:''}">${has?(op?'▾':'▸'):'·'}</span> ${dot(a.late?'bad':a.ex-a.a>=8?'wa':'ok')} <span class="nm" ${has?`onclick="tg('${k}')"`:''}>${task.ms?'◆ ':''}${esc(task.n)}</span>
 <span class="mut mt"> ${task.w&&UN[task.w]?esc(UN[task.w])+' · ':''}<span class="num">${fd(task.s)}${task.e&&task.e!=task.s?' → '+fd(task.e):''}</span></span> <b class="num">${pct(a.a)}</b>${a.late?` <span class="bad num">${a.late} ${t('lateD')}</span>`:''}</div>`;
 if(has&&op)h+=(kids[task.id]).map(c=>trow(c,an,lv+1,pk,kids)).join('');return h}
function vTree(){const L=scoped(),A=agg(L);
 const body=A.rows.map(r=>{const sk='s:'+r.sc,so=!EXP.has('x'+sk),g=hl(r.ex-r.a,r.late);
  return `<div class="card"><div class="tp sh" onclick="EXP.has('x${sk}')?EXP.delete('x${sk}'):EXP.add('x${sk}');vTree()">${so?'▾':'▸'} ${dot(g)} <b>${esc(secN(r.sc))}</b> <span class="mut"><span class="num">${pct(r.a)}</span> / <span class="num">${pct(r.ex)}</span> · <span class="num">${r.L.length}</span> ${t('cnt')}</span></div>
  ${so?r.L.map(p=>{const pk='p:'+p.k,po=EXP.has(pk),q=hl(p.gap,p.lateN);return `<div class="pjr"><div class="pr ph2" onclick="tg('${esc(pk)}')"><span class="tgl">${po?'▾':'▸'}</span> ${dot(q)} <b>${esc(p.name)}</b> <span class="mut"><span class="num">${esc(p.k)}</span>${p.pm?' · '+esc(p.pm):''}</span> <b class="num">${pct(p.a)}</b> <span class="mut num">/ ${pct(p.ex)}</span>${p.lateN?` <span class="bad num">${p.lateN} ${t('late')}</span>`:''}</div>${pbar(p.a,p.ex)}
   ${po?(p.an.kids['']||[]).map(c=>trow(c,p.an,1,p.k,p.an.kids)).join(''):''}</div>`}).join(''):''}</div>`}).join('');
 $('body').innerHTML=`<div class="row" style="margin:0 0 8px"><button onclick="expAll(1)">${t('expAll')}</button><button onclick="expAll(0)">${t('colAll')}</button><span class="mut">${t('legend')}</span></div>${body}
 <style>.pr{padding-block:5px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.tgl{cursor:pointer;width:16px;display:inline-block;color:var(--mut)}.nm{cursor:pointer;font-weight:600;overflow-wrap:anywhere}.ph2{cursor:pointer;border-top:0}.sh{cursor:pointer;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pjr{margin:8px 0;padding:6px 8px;border:1px solid var(--line);border-radius:12px}</style>`}

/* ---- gantt ---- */
function vGantt(){const L=scoped(),us=new Map();L.forEach(p=>p.tasks.forEach(x=>{if(x.w)us.set(x.w,UN[x.w]||x.w)}));
 let rows=[];
 L.forEach(p=>{const kids=p.an.kids,pk='g:'+p.k,open=FP||FU||EXP.has(pk);
  const a=p.an;let items=[];
  if(FU){p.tasks.filter(x=>x.w==FU&&!(kids[x.id]||[]).length).forEach(x=>items.push({x,lv:1}))}
  else if(open){const walk=(pid,lv)=>(kids[pid]||[]).forEach(x=>{items.push({x,lv});if((kids[x.id]||[]).length&&(EXP.has('gt:'+p.k+':'+x.id)||FP))walk(x.id,lv+1)});walk('',1)}
  if(FU&&!items.length)return;
  rows.push({proj:p,s:a.s,e:a.e,a:p.a,ex:p.ex,n:p.name,pk,open});
  items.forEach(it=>{const r=p.an.t[it.x.id]||{};rows.push({x:it.x,lv:it.lv,s:r.s,e:r.e,a:r.a,ex:r.ex,late:r.late,n:it.x.n,leaf:r.leaf,tk:'gt:'+p.k+':'+it.x.id,k:p.k})})});
 const ss=rows.map(r=>r.s).filter(v=>v!=null),ee=rows.map(r=>r.e).filter(v=>v!=null);
 const ctrl=`<div class="row noprint" style="margin:0 0 8px"><select id="fu" style="flex:1"><option value="">${t('allU')}</option>${[...us].sort((a,b)=>String(a[1]).localeCompare(b[1],'ar')).map(([i,n])=>`<option value="${esc(i)}" ${FU==i?'selected':''}>${esc(n)}</option>`).join('')}</select><button onclick="PXD=Math.min(24,PXD*1.4);vGantt()">＋ ${t('zi')}</button><button onclick="PXD=Math.max(.8,PXD/1.4);vGantt()">－ ${t('zo')}</button></div>`;
 if(!ss.length){$('body').innerHTML=ctrl+`<div class="card mut">${t('none')}</div>`;bindU();return}
 const m0=Math.min(...ss,TODAY)-3,m1=Math.max(...ee,TODAY)+3;if(!PXD)PXD=clamp(Math.max(700,Math.min(innerWidth-260,1100))/(m1-m0+1),1.2,12);const W=Math.round((m1-m0+1)*PXD),LW=230,RH=30;
 let hd='',gl='';const d0=new Date(m0*DAY);let y=d0.getUTCFullYear(),mo=d0.getUTCMonth();
 for(;;){const st=Date.UTC(y,mo,1)/DAY;if(st>m1)break;const nx=Date.UTC(y,mo+1,1)/DAY,x=Math.round((Math.max(st,m0)-m0)*PXD),w=Math.round((Math.min(nx-1,m1)-Math.max(st,m0)+1)*PXD);
  hd+=`<div class="gm" style="left:${x}px;width:${w}px">${String(mo+1).padStart(2,'0')}/${y}</div>`;gl+=`<div class="gv" style="left:${x}px"></div>`;mo++;if(mo>11){mo=0;y++}}
 const tx=Math.round((TODAY-m0)*PXD);
 const bars=rows.map((r,i)=>{if(r.s==null||r.e==null)return '';const x=Math.round((r.s-m0)*PXD),w=Math.max(r.proj||(r.x&&r.x.ms)?6:4,Math.round((r.e-r.s+1)*PXD));
  const col=r.proj?'#23272b':(r.x.ms?LC[2]:LC[Math.min(4,(r.lv||1)-1)]),late=r.late||(r.proj&&r.proj.lateN);
  if(r.x&&r.x.ms)return `<div class="gd" style="left:${x+w/2-7}px;top:${i*RH+8}px;background:${late?'#d1101d':col}" title="${esc(r.n)}"></div>`;
  return `<div class="gb ${late?'lt':''}" style="left:${x}px;width:${w}px;top:${i*RH+7}px;background:${col}22;border-color:${col}" title="${esc(r.n)} — ${pct(r.a)}"><i style="width:${clamp(r.a,0,100)}%;background:${col}"></i></div><div class="gp" style="left:${x}px;top:${i*RH+22}px;width:${Math.round(w*clamp(r.ex,0,100)/100)}px"></div>`}).join('');
 const labs=rows.map((r,i)=>{if(r.proj)return `<div class="gl pj" style="height:${RH}px" onclick="${FP||FU?'':`tg2('${r.pk}')`}"><span class="tgl">${FP||FU?'':(r.open?'▾':'▸')}</span><b title="${esc(r.n)}">${esc(r.n)}</b></div>`;
  const has=(r.proj?0:(scoped().find(p=>p.k==r.k).an.kids[r.x.id]||[]).length);
  return `<div class="gl" style="height:${RH}px;padding-inline-start:${8+(r.lv-1)*12}px" title="${esc(r.n)}${r.x.w&&UN[r.x.w]?' — '+esc(UN[r.x.w]):''}"><span class="tgl" onclick="${has&&!FP?`tg2('${r.tk}')`:''}">${has&&!FP?(EXP.has(r.tk)?'▾':'▸'):''}</span><span>${esc(r.n)}</span></div>`}).join('');
 $('body').innerHTML=ctrl+`<div class="card" style="padding:0;overflow:hidden"><div class="gwrap" dir="ltr"><div class="gl0" style="width:${LW}px"><div class="gh0" style="height:26px"></div>${labs}</div>
 <div class="gcan" style="width:${W}px;height:${rows.length*RH+26}px"><div class="gh" style="width:${W}px">${hd}</div><div class="gg" style="top:26px">${gl}</div><div class="gt" style="left:${tx}px;top:0;height:${rows.length*RH+26}px"></div><div style="position:absolute;inset:26px 0 0 0">${bars}</div></div></div></div>
 <div class="mut">${t('legend')}</div>
 <style>.gwrap{display:flex;overflow-x:auto;direction:ltr}.gl0{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line);flex:none}.gl{display:flex;gap:4px;align-items:center;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #f0ede4;direction:auto;padding-inline-end:6px}.gl.pj{background:#f7f5ee;cursor:pointer}.gcan{position:relative;flex:none}.gh{position:absolute;top:0;height:26px;border-bottom:1px solid var(--line);background:#faf8f2}.gm{position:absolute;top:0;height:26px;border-left:1px solid var(--line);font-size:11.5px;padding:3px 5px;color:var(--mut);overflow:hidden}.gg{position:absolute;bottom:0;left:0;right:0}.gv{position:absolute;top:0;bottom:0;border-left:1px solid #f0ede4}.gt{position:absolute;width:2px;background:#d1101d;z-index:2}.gb{position:absolute;height:14px;border:1px solid;border-radius:5px;overflow:hidden}.gb.lt{box-shadow:0 0 0 2px #d1101d55}.gb i{position:absolute;inset-block:0;left:0}.gp{position:absolute;height:3px;background:#B39A6B}.gd{position:absolute;width:14px;height:14px;transform:rotate(45deg)}.tgl{width:14px;display:inline-block;flex:none;cursor:pointer;color:var(--mut)}</style>`;
 bindU()}
const bindU=()=>{const e=$('fu');if(e)e.onchange=ev=>{FU=ev.target.value;vGantt()}};
function tg2(k){EXP.has(k)?EXP.delete(k):EXP.add(k);vGantt()}
/* ---- reports ---- */
function vRep(){const d1=ds(TODAY),d0=d1.slice(0,8)+'01';
 $('body').innerHTML=`<div class="card noprint"><div class="g2"><div><label>${t('rFrom')}</label><input type="date" id="rf" value="${RP?RP.f:d0}"></div><div><label>${t('rTo')}</label><input type="date" id="rt" value="${RP?RP.t:d1}"></div></div>
 <label class="ck"><span style="display:flex;gap:6px;align-items:center;font-weight:700"><input type="checkbox" id="rpl" ${RP&&RP.pl?'checked':''}> ${t('rPlan')}</span></label>
 <div class="row"><button class="p" onclick="genRep()">${t('rGen')}</button>${RP?`<button onclick="window.print()">${t('rPrint')}</button>`:''}</div></div><div id="rep"></div>`;
 if(RP)showRep()}
function genRep(){RP={f:$('rf').value,t:$('rt').value,pl:$('rpl').checked};showRep()}
function showRep(){const L=scoped(),A=agg(L),f=dn(RP.f),e=dn(RP.t),scope=FP?t('rByP')+((L[0]||{}).name||''):FS?t('rBySec')+secN(FS):t('rAllS');
 const inP=(s)=>{const n=dn(s);return n!=null&&n>=f&&n<=e};
 const doneIn=p=>p.tasks.filter(x=>inP(x.ae)).length;
 const crs=CRS.filter(c=>L.some(p=>p.k==c.pc)&&c.created_at&&(()=>{const n=dn(String(c.created_at).slice(0,10));return n>=f&&n<=e})());
 const crBy={};crs.forEach(c=>crBy[c.status]=(crBy[c.status]||0)+1);
 const rowsP=L.map(p=>{const g=hl(p.gap,p.lateN);return `<tr><td>${esc(p.name)}<br><small dir="ltr">${esc(p.k)}</small></td><td>${esc(secN(p.sc))}</td><td>${esc(p.pm||'')}</td><td class="n">${pct(p.ex)}</td><td class="n"><b>${pct(p.a)}</b></td><td class="n">${p.gap>0?'-':'+'}${Math.abs(Math.round(p.gap))}</td><td class="n">${doneIn(p)}</td><td class="n">${p.lateN}</td><td style="color:${hCol[g]}">● ${t('h_'+g)}</td></tr>`}).join('');
 const sec=A.rows.length>1?`<h3>${t('sec')}</h3><table class="rt"><tr><th>${t('sec')}</th><th>${t('pj')}</th><th>${t('exp')}</th><th>${t('act')}</th><th>${t('late')}</th></tr>${A.rows.map(r=>`<tr><td>${esc(secN(r.sc))}</td><td class="n">${r.L.length}</td><td class="n">${pct(r.ex)}</td><td class="n"><b>${pct(r.a)}</b></td><td class="n">${r.late}</td></tr>`).join('')}</table>`:'';
 let det='';
 if(RP.pl)det=L.map(p=>{const walk=(pid,lv)=>(p.an.kids[pid]||[]).map(x=>{const a=p.an.t[x.id]||{};return `<tr><td style="padding-inline-start:${6+(lv-1)*14}px">${x.ms?'◆ ':''}${(p.an.kids[x.id]||[]).length?'<b>'+esc(x.n)+'</b>':esc(x.n)}</td><td>${esc(UN[x.w]||'')}</td><td class="n">${fd(x.s)}</td><td class="n">${fd(x.e)}</td><td class="n">${pct(a.a||0)}</td><td class="n">${a.late?a.late:''}</td></tr>`+walk(x.id,lv+1)}).join('');
  return `<h3>${esc(p.name)} <small dir="ltr">${esc(p.k)}</small></h3><table class="rt"><tr><th>${t('task')}</th><th>${t('who')}</th><th>${lang=='ar'?'البداية':'Start'}</th><th>${lang=='ar'?'النهاية':'End'}</th><th>${t('prog')}</th><th>${t('lateD')}</th></tr>${walk('',1)}</table>`}).join('');
 $('rep').innerHTML=`<div class="card rp"><h2 style="font-size:20px">${t('rTitle')}<small>${esc(scope)} · <span class="num">${fd(RP.f)}</span> → <span class="num">${fd(RP.t)}</span> · ${t('rGen2')} <span class="num">${fd(ds(TODAY))}</span></small></h2>
 <div class="kp" style="margin:10px 0"><div><b>${A.n}</b><span>${t('kP')}</span></div><div><b>${pct(A.a)}</b><span>${t('kA')}</span></div><div><b>${pct(A.ex)}</b><span>${t('kE')}</span></div><div><b>${A.late}</b><span>${t('kL')}</span></div></div>${pbar(A.a,A.ex)}
 ${sec}<h3>${t('pj')}</h3><div style="overflow-x:auto"><table class="rt"><tr><th>${t('pj')}</th><th>${t('sec')}</th><th>${t('pm')}</th><th>${t('exp')}</th><th>${t('act')}</th><th>${t('gap')}</th><th>${t('rDone')}</th><th>${t('late')}</th><th>${t('st')}</th></tr>${rowsP}</table></div>
 <h3>${t('rCR')}</h3>${crs.length?`<p>${Object.entries(crBy).map(([k,v])=>esc(k)+': <b class="num">'+v+'</b>').join(' · ')}</p><ul>${crs.map(c=>`<li><span dir="ltr">${esc(c.code)}</span> — ${esc(c.ti||'')}</li>`).join('')}</ul>`:`<p class="mut">${t('rNoCR')}</p>`}
 ${RP.pl?`<div class="pgb"><h2>${t('rDet')}</h2>${det}</div>`:''}</div>
 <style>.rt{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 14px}.rt th,.rt td{border:1px solid #ddd5c3;padding:4px 7px;text-align:start;vertical-align:top}.rt th{background:#f3ecdc}.rt td.n{direction:ltr;text-align:center;white-space:nowrap}.rp h3{margin:16px 0 4px;font-size:15px}</style>`}
boot();

</script><script>/*fmtfix*/
(function(){
 var AR={'٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9,'۰':0,'۱':1,'۲':2,'۳':3,'۴':4,'۵':5,'۶':6,'۷':7,'۸':8,'۹':9};
 var RA=/[٠-٩۰-۹]/g,RI=/(\d{4})-(\d{2})-(\d{2})/g;
 function fixTxt(s){if(!s)return s;var o=s.replace(RA,function(c){return AR[c]});o=o.replace(RI,function(m,y,mo,d){return (+mo>=1&&+mo<=12&&+d>=1&&+d<=31)?d+'/'+mo+'/'+y:m});return o}
 function walk(root){try{var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode;if(!p)return NodeFilter.FILTER_REJECT;var g=p.nodeName;return(g=='SCRIPT'||g=='STYLE'||g=='TEXTAREA'||g=='OPTION'&&0)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),n,L=[];while(n=w.nextNode())L.push(n);L.forEach(function(n){var v=n.nodeValue,f=fixTxt(v);if(f!==v)n.nodeValue=f})}catch(e){}}
 function ph(){return document.documentElement.lang=='ar'?'يوم/شهر/سنة':'dd/mm/yyyy'}
 function dfmt(v){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''}
 function enh(i){if(i._dt)return;i._dt=1;var w=document.createElement('span');w.className='dtw';var s=document.createElement('span');s.className='dtv';i.parentNode.insertBefore(w,i);w.appendChild(s);w.appendChild(i);i.classList.add('dtx');i._s=s;sync(i);
  var f=function(){sync(i)};i.addEventListener('input',f);i.addEventListener('change',f)}
 function sync(i){var s=i._s;if(!s)return;var t=dfmt(i.value);if(s.textContent!==(t||ph()))s.textContent=t||ph();s.classList.toggle('em',!t);s.classList.toggle('ds',!!i.disabled)}
 function scan(r){(r.querySelectorAll?r.querySelectorAll('input[type=date]'):[]).forEach(enh);if(r.nodeName=='INPUT'&&r.type=='date')enh(r)}
 var st=document.createElement('style');st.textContent='.dtw{position:relative;display:block;min-width:0}.dtv{display:block;box-sizing:border-box;width:100%;padding:9px 11px;border:1px solid var(--line,#ddd);border-radius:10px;background:#fff;color:var(--ink,#111);font:inherit;direction:ltr;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.4em}.dtv.em{color:#999;font-size:.85em}.dtv.ds{background:#f1efe8;color:#777}input.dtx{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0;margin:0!important;padding:0!important;border:0!important;cursor:pointer}';document.head.appendChild(st);
 var q=0;function run(){q=0;walk(document.body);scan(document.body);document.querySelectorAll('input.dtx').forEach(sync)}
 new MutationObserver(function(){if(!q)q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true,characterData:true});
 setInterval(function(){document.querySelectorAll('input.dtx').forEach(sync)},700);
 run();
})();
</script>
