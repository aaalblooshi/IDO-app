.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}

async function uploadAtt(f,title){
 const ext=(f.name.match(/\.[A-Za-z0-9]{1,8}$/)||[''])[0].toLowerCase();
 const path=cr.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+ext;
 const up=await sb.storage.from('rp-attachments').upload(path,f,{contentType:f.type||'application/octet-stream'});
 if(up.error)throw up.error;
 const ins=await sb.from('closure_attachments').insert({cr_id:cr.id,title:title,path:path,size:f.size,mime:f.type||'',uploaded_by:me.id});
 if(ins.error){await sb.storage.from('rp-attachments').remove([path]);throw ins.error}
 await lg(cr.id,'attached|'+title)}

 try{await save(false);await uploadAtt(f,title);openCR(cr.id)}
 catch(err){b.disabled=false;b.textContent=t('attAdd');msg(err.message||String(err))}}
async function flushAtt(){const fi=$('at_f'),f=fi&&fi.files[0];if(!f)return;if(f.size>ATTMAX())throw new Error(t('attBig'));
