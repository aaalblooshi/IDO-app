function stBadge(x){return '<span class="dot" style="background:'+clr[x._st]+'"></span>'+esc(P(stT[x._st]))}
function wbs(){const vs=visSet();const rows=M.tasks.filter(x=>(!vs||vs.has(x.id))).filter(x=>{let c=x;while(c._par){if(COLL[c._par])return false;c=M.by[c._par]}return true});
 return '<div class="tw"><table><thead><tr><th>WBS</th><th>'+P(['المهمة','Task'])+'</th><th>'+P(['المكلّف','Assignee'])+'</th><th>'+P(['البداية','Start'])+'</th><th>'+P(['النهاية','End'])+'</th><th>%</th><th>'+P(['الحالة','Status'])+'</th></tr></thead><tbody>'+rows.map(x=>'<tr style="'+(x._k?'background:#f7fafc;font-weight:700':'')+'"><td class="mut" style="white-space:nowrap">'+x._w+'</td><td style="padding-inline-start:'+(8+x._d*16)+'px">'+(x._k?'<button class="tg" onclick="tgl(\''+esc(x.id)+'\')">'+(COLL[x.id]?'▸':'▾')+'</button>':'<span class="ind" style="width:22px"></span>')+(x.ms?'◆ ':'')+nm(x)+'</td><td>'+(x._k?'':who(x))+'</td><td>'+fd(x._s)+'</td><td>'+fd(x._e)+'</td><td>'+Math.round(x._pc)+'</td><td>'+stBadge(x)+'</td></tr>').join('')+'</tbody></table></div>'}
function listV(rows){const L=(rows||M.leaves).filter(passes).sort((a,b)=>(a._e==null)-(b._e==null)||a._e-b._e);
 return '<div class="tw"><table><thead><tr><th>#</th><th>'+P(['المهمة','Task'])+'</th><th>'+P(['المرحلة','Phase'])+'</th><th>'+P(['المكلّف','Assignee'])+'</th><th>'+P(['البداية','Start'])+'</th><th>'+P(['النهاية','End'])+'</th><th>%</th><th>'+P(['الحالة','Status'])+'</th></tr></thead><tbody>'+(L.length?L.map(x=>{const ph=M.by[x._top];return '<tr><td class="mut">'+x._w+'</td><td>'+(x._me?'⭐ ':'')+nm(x)+(x._crit?' <span class="pill" style="background:#181C32">'+P(['حرجة','critical'])+'</span>':'')+'</td><td class="mut">'+(ph&&!ph._m?esc(ph.n):'')+'</td><td>'+who(x)+'</td><td>'+fd(x._s)+'</td><td>'+fd(x._e)+'</td><td>'+Math.round(x._pc)+'</td><td>'+stBadge(x)+'</td></tr>'}).join(''):'<tr><td colspan="8" class="none">'+P(['لا مهام مطابقة','No matching tasks'])+'</td></tr>')+'</tbody></table></div>'}
function whoV(){const g={},L=M.leaves.filter(passes);L.forEach(x=>{const k=x._m?'__mask':(x.w||'__none');(g[k]=g[k]||{n:x._m?P(['مكلّفون آخرون (مخفي)','Other assignees (hidden)']):(x.wn||x.w||P(['بلا مكلّف','Unassigned'])),a:[]}).a.push(x)});
 const ks=Object.keys(g).sort((a,b)=>(a==me.id?-1:b==me.id?1:g[b].a.length-g[a].a.length));
 return ks.length?ks.map(k=>{const G=g[k],tw=G.a.reduce((s,x)=>s+x._dur,0)||1,pc=G.a.reduce((s,x)=>s+x._pc*x._dur,0)/tw,lt=G.a.filter(x=>x._st=='late').length;
  return '<div class="card ag"><h4>'+(k=='__mask'?'<span class="mk">████ ███</span>':esc(G.n))+(k==me.id?' <span class="pill" style="background:var(--gold)">'+P(['أنا','Me'])+'</span>':'')+'<span class="mut">'+G.a.length+' '+P(['مهمة','tasks'])+(lt?' · <b style="color:var(--r)">'+lt+' '+P(['متأخرة','late'])+'</b>':'')+' · '+Math.round(pc)+'%</span></h4><div class="bar"><i style="width:'+Math.round(pc)+'%"></i></div>'+listV(G.a).replace('<div class="tw">','<div class="tw" style="margin-top:8px">')+'</div>'}).join(''):'<div class="none">'+P(['لا مهام مطابقة','No matching tasks'])+'</div>'}
function kbV(){const L=M.leaves.filter(passes),cols=[['late',stT.late],['prog',['جارية','In progress']],['todo',stT.todo],['done',stT.done]];
 return '<div class="kb">'+cols.map(c=>{const a=L.filter(x=>c[0]=='prog'?(x._st=='prog'||x._st=='due'):x._st==c[0]).sort((a,b)=>(a._e||0)-(b._e||0));return '<div><h4>'+P(c[1])+'<span>'+a.length+'</span></h4>'+a.slice(0,40).map(x=>'<div class="kc" style="border-color:'+clr[x._st]+'"><b>'+nm(x)+'</b><small>'+who(x)+' · '+fd(x._e)+' · '+Math.round(x._pc)+'%</small></div>').join('')+(a.length>40?'<div class="mut">+'+(a.length-40)+'</div>':'')+'</div>'}).join('')+'</div>'}
/* ---------- تبويب الخطة ---------- */
function planTab(){if(!PLR||!M.tasks.length)return '<div class="card"><div class="none">'+P(['لا توجد خطة بمهام لهذا المشروع بعد.','This project has no plan with tasks yet.'])+'</div>'+(CH&&CH.created_by==me.id?'<div style="text-align:center"><a class="btn p" href="plan.html">'+P(['إعداد خطة','Prepare a plan'])+'</a></div>':'')+'</div>';
 const d=PLR.data,sub=[PLR.status=='Approved'?P(['معتمدة','Approved']):stN(PLR.status),M.tasks.filter(x=>!x._par).length+' '+P(['مراحل','phases']),M.leaves.length+' '+P(['مهمة','tasks']),new Set(M.leaves.filter(x=>x.w).map(x=>x.w)).size+' '+P(['مكلّفين','assignees'])].join(' · ');
 const bnr=PLR.restricted?'<div class="mkb">🔒 '+P(['هذا المشروع سري: تظهر لك المهام المكلّف بها فقط، وباقي الخانات مموّهة (تبقى تواريخها ونسبها).','This project is confidential: you only see the tasks assigned to you; the other rows are blurred (dates and progress remain).'])+'</div>':'';
 let body=VIEW=='gantt'?gantt(M.tasks):VIEW=='wbs'?wbs():VIEW=='who'?whoV():VIEW=='list'?listV():kbV();
 const crit=M.hasDeps?(M.crit.length?M.crit.slice(0,5).map(x=>'<div class="att"><div class="t">'+nm(x)+'<small>'+who(x)+' · '+fd(x._e)+'</small></div></div>').join(''):'<div class="none">'+P(['لا مسار حرج محدد.','No critical path found.'])+'</div>'):'<div class="none">'+P(['لم تُحدَّد اعتماديات بين المهام.','No task dependencies defined.'])+'</div>';
 const imp=M.leaves.filter(x=>x._st=='late'&&x._imp>0).sort((a,b)=>b._imp-a._imp).slice(0,3).map(x=>'<div class="mut" style="padding:3px 0">⏱ '+nm(x)+' → '+P(['يؤخّر ','delays '])+x._imp+' '+P(['مهمة لاحقة','later task(s)'])+'</div>').join('');
 const ld={};M.leaves.filter(x=>!x._m&&x.w).forEach(x=>{const k=x.wn||x.w;(ld[k]=ld[k]||{n:0,l:0}).n++;if(x._st=='late')ld[k].l++});
 const lds=Object.entries(ld).sort((a,b)=>b[1].n-a[1].n).slice(0,5).map(([k,v])=>'<div class="att"><div class="t">'+esc(k)+'</div><span class="mut">'+v.n+' '+P(['مهام','tasks'])+(v.l?' · <b style="color:var(--r)">'+v.l+' '+P(['متأخرة','late'])+'</b>':'')+'</span></div>').join('')||'<div class="none">—</div>';
 const base=d._base,bm={};(base||[]).forEach(b=>bm[b.id]=b);let bend=null,shift=0;if(base&&base.length){const be=base.map(b=>dn(b.e)).filter(v=>v!=null);bend=be.length?Math.max.apply(0,be):null;shift=M.leaves.filter(x=>bm[x.id]&&bm[x.id].e&&dn(bm[x.id].e)!=x._e).length}
 const bcard=bend!=null&&M.end!=null?'<div class="mut" style="line-height:2">'+P(['نهاية المشروع عند الاعتماد: ','End at approval: '])+'<b>'+fd(bend)+'</b><br>'+P(['النهاية الحالية: ','Current end: '])+'<b>'+fd(M.end)+'</b><br>'+P(['الانحراف: ','Variance: '])+'<b style="color:'+(M.end>bend?'var(--r)':'var(--ok)')+'">'+(M.end-bend>0?'+':'')+(M.end-bend)+' '+P(['يوم','d'])+'</b><br>'+shift+' '+P(['مهمة تغيّرت نهايتها','task(s) with changed end date'])+'</div>':'<div class="none">'+P(['لا خط أساسي بعد (يُحفظ عند الاعتماد).','No baseline yet (saved at approval).'])+'</div>';
 return '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><div style="font-size:19px;font-weight:800">'+P(['خطة: ','Plan: '])+esc(pName())+'</div><div class="mut">'+esc(sub)+'</div></div><div class="row noprint"><button onclick="window.print()">🖨 '+P(['طباعة','Print'])+'</button><button onclick="expCsv()">⬇ '+P(['تصدير','Export'])+'</button><button onclick="shareLink()">🔗 '+P(['مشاركة رابط','Share link'])+'</button>'+(PLR.id?'<a class="btn" href="plan.html#o='+PLR.id+'">✎ '+P(['محرر الخطة','Plan editor'])+'</a>':'')+'</div></div>'+bnr+
 '<div class="row noprint" style="margin-top:10px"><span class="seg">'+VIEWS.map(v=>'<button class="'+(VIEW==v[0]?'on':'')+'" onclick="VIEW=\''+v[0]+'\';draw()">'+P(v[1])+'</button>').join('')+'</span>'+(VIEW=='gantt'?'<span class="row"><button onclick="ZOOM=Math.max(.5,ZOOM/1.3);draw()">－</button><button onclick="ZOOM=Math.min(4,ZOOM*1.3);draw()">＋</button></span>':'')+'</div>'+filters()+body+'</div>'+
 '<div class="g3"><div class="card"><h3 class="h">'+P(['الاعتماديات والمسار الحرج','Dependencies & critical path'])+'</h3>'+crit+imp+'</div><div class="card"><h3 class="h">'+P(['حمل المكلّفين','Assignee load'])+'</h3>'+lds+'</div><div class="card"><h3 class="h">'+P(['مقارنة بالخط الأساسي','Baseline comparison'])+'</h3>'+bcard+'</div></div>'}
function shareLink(){const u=location.origin+location.pathname+'?pc='+encodeURIComponent(PC)+'#plan';(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(P(['تم نسخ الرابط','Link copied'])),()=>toast(u))}
function expCsv(){const L=M.leaves.filter(passes),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['WBS',P(['المهمة','Task']),P(['المكلّف','Assignee']),P(['البداية','Start']),P(['النهاية','End']),'%',P(['الحالة','Status'])]].concat(L.map(x=>[x._w,x._m?'***':x.n,x._m?'***':(x.wn||x.w||''),x.s||'',x.e||'',Math.round(x._pc),P(stT[x._st])]));
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(PC||'plan')+'-plan.csv';a.click()}
/* ---------- المهام / الطلبات / السجل ---------- */
function tasksTab(){if(!M||!M.leaves.length)return '<div class="card"><div class="none">'+P(['لا مهام بعد.','No tasks yet.'])+'</div></div>';
 return '<div class="card"><div class="row noprint"><span class="seg"><button class="'+(F.mine?'on':'')+'" onclick="F.mine=true;draw()">'+P(['مهامي','My tasks'])+' ('+M.mine+')</button><button class="'+(!F.mine?'on':'')+'" onclick="F.mine=false;draw()">'+P(['كل المهام','All tasks'])+'</button></span><a class="btn p" href="tasks.html" style="margin-inline-start:auto">'+P(['تحديث الإنجاز في «مهامي»','Update progress in “My tasks”'])+'</a></div>'+filters()+listV()+'</div>'}
function reqTab(){const R=[];const add=(k,r)=>R.push({k,r,pc:null});if(CH)add('charter',CH);PLS.forEach(r=>add('plan',r));CRS.forEach(r=>add('cr',r));CLS.forEach(r=>add('closure',r));
 return '<div class="card"><div class="tw"><table><thead><tr><th>'+P(['الخدمة','Service'])+'</th><th>'+P(['الرمز','Code'])+'</th><th>'+P(['الحالة','Status'])+'</th><th>'+P(['آخر تحديث','Updated'])+'</th><th></th></tr></thead><tbody>'+(R.length?R.sort((a,b)=>b.r.id-a.r.id).map(x=>'<tr style="'+(x.r.archived?'opacity:.55':'')+'"><td><b>'+esc(P(SVC[x.k].t))+'</b>'+(x.r.version>1?' <span class="mut">v'+x.r.version+'</span>':'')+'</td><td dir="ltr" style="text-align:start">'+esc(x.r.code||'')+'</td><td><span class="pill" style="background:'+stCol(x.r.status)+'">'+esc(stN(x.r.status))+'</span></td><td class="mut">'+fdl(String(x.r.stage_at||x.r.created_at||'').slice(0,10))+'</td><td><a class="btn" href="'+SVC[x.k].p+'#o='+x.r.id+'">'+P(['فتح','Open'])+'</a></td></tr>').join(''):'<tr><td colspan="5" class="none">'+P(['لا طلبات.','No requests.'])+'</td></tr>')+'</tbody></table></div>'+(CH&&CH.created_by==me.id?'<div class="row noprint" style="margin-top:12px"><a class="btn p" href="cr.html">＋ '+P(['طلب تغيير','Change request'])+'</a><a class="btn" href="closure.html">＋ '+P(['تقرير ختامي','Closure report'])+'</a></div>':'')+'</div>'}
function logTab(){const ev=[];const add=(k,r)=>{ev.push({d:String(r.created_at||'').slice(0,10),t:P(SVC[k].t)+' '+(r.code||'')+' · '+P(['أُنشئ','created'])});if(r.stage_at&&String(r.stage_at).slice(0,10)!=String(r.created_at||'').slice(0,10)||r.status!='Draft')ev.push({d:String(r.stage_at||r.created_at||'').slice(0,10),t:P(SVC[k].t)+' '+(r.code||'')+' · '+stN(r.status),h:SVC[k].p+'#o='+r.id})};
 if(CH)add('charter',CH);PLS.forEach(r=>add('plan',r));CRS.forEach(r=>add('cr',r));CLS.forEach(r=>add('closure',r));ev.sort((a,b)=>a.d<b.d?1:-1);
 return '<div class="card"><h3 class="h">'+P(['السجل الزمني للوثائق','Documents timeline'])+'</h3>'+(ev.length?ev.map(e=>'<div class="att"><span class="mut" style="width:96px;flex:none">'+fdl(e.d)+'</span><div class="t">'+esc(e.t)+'</div>'+(e.h?'<a class="btn" href="'+e.h+'">'+P(['فتح','Open'])+'</a>':'')+'</div>').join(''):'<div class="none">—</div>')+'</div>'}
function draw(){applyLang();document.title=pName()+' — '+P(['ملف المشروع','Project file']);$('ttl').textContent=pName();$('bk').textContent='⬅ '+P(['مشاريعي','My projects']);
 const body=TAB=='ov'?overview():TAB=='plan'?planTab():TAB=='tasks'?tasksTab():TAB=='req'?reqTab():logTab();
 $('app').innerHTML=head()+body}
window.addEventListener('hashchange',()=>{const t=(location.hash||'').replace('#','');if(M&&tabsOn().some(x=>x[0]==t)&&t!=TAB){TAB=t;draw()}});
load();

</script></body></html>
