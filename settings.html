 return arr.map((it,i)=>{const o=keyed(k)?1:0,lock=keyed(k)&&(LOCK[k]||[]).includes(it[0]);
  return `<div class="gl" style="align-items:end"><div><label>${t('ar')}</label><input value="${esc(it[o])}" oninput="${path}[${i}][${o}]=this.value"></div><div><label>${t('en')}</label><input dir="ltr" value="${esc(it[o+1])}" oninput="${path}[${i}][${o+1}]=this.value"></div>
  <div class="row" style="margin:0 0 2px;grid-column:1/-1;gap:6px"><button onclick="mv('${path}',${i},-1)">▲</button><button onclick="mv('${path}',${i},1)">▼</button>${lock?`<span class="mut">${t('lock')}</span>`:`<button class="r" onclick="rm('${path}',${i})">✕</button>`}</div></div>`}).join('')}
function ref(p){return Function('EL','return '+p)(EL)}
function mv(p,i,d){const a=ref(p),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];drawLists()}
function rm(p,i){const a=ref(p);if(a.length<=1)return toast(t('keep1'));a.splice(i,1);
 if(p=='EL.sectors'||p==='sectors'){}drawLists()}
function addI(p,k){const a=ref(p);a.push(keyed(k)?['c'+Date.now().toString(36),'','']:['','']);if(p=='EL.sectors')EL.depts.push([['','']]);drawLists()}
function tgl(id){OPENL[id]=!OPENL[id];drawLists()}
function drawLists(){const el=$('lists');if(!el)return;if(!EL)initLists();
 const sec=(k,body)=>`<details ${OPENL[k]?'open':''} style="border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin:8px 0"><summary style="font-weight:700;cursor:pointer" onclick="event.preventDefault();tgl('${k}')">${t('l_'+k)} <span class="mut">(${k=='depts'?EL.depts.reduce((n,x)=>n+x.length,0):EL[k].length})</span></summary>${OPENL[k]?body:''}</details>`;
 el.innerHTML=['sectors','goals','ptype','prio','pstat'].map(k=>sec(k,rowsH(EL[k],'EL.'+k,k)+`<div class="row"><button onclick="addI('EL.${k}','${k}')">${t('addi')}</button></div>`)).join('')
 +sec('depts',EL.sectors.map((s,si)=>`<div style="margin:8px 0"><b>${esc(s[0]||t('sector')+' '+(si+1))}</b>${rowsH(EL.depts[si],'EL.depts['+si+']','depts')}<div class="row"><button onclick="addI('EL.depts[${si}]','depts')">${t('addi')}</button></div></div>`).join(''))}
// عند إضافة/حذف قطاع نُبقي عدد مصفوفات الإدارات مطابقًا
const _rm=rm;rm=function(p,i){if(p=='EL.sectors'){if(EL.sectors.length<=1)return toast(t('keep1'));EL.sectors.splice(i,1);EL.depts.splice(i,1);return drawLists()}_rm(p,i)};
const _mv=mv;mv=function(p,i,d){if(p=='EL.sectors'){const j=i+d;if(j<0||j>=EL.sectors.length)return;[EL.sectors[i],EL.sectors[j]]=[EL.sectors[j],EL.sectors[i]];[EL.depts[i],EL.depts[j]]=[EL.depts[j],EL.depts[i]];return drawLists()}_mv(p,i,d)};
const saveLists=()=>run(async()=>{const out={};
 for(const k of LK){const a=k=='depts'?EL.depts:EL[k];
  if(k=='depts'){out.depts=EL.depts.map((l,si)=>l.map((it,i)=>{if(!String(it[0]).trim())throw new Error(t('l_depts')+' '+(si+1)+'/'+(i+1));return[it[0].trim(),(it[1]||'').trim()||it[0].trim()]}))}
  else if(keyed(k)){out[k]=a.map((it,i)=>{if(!String(it[1]).trim())throw new Error(t('l_'+k)+' '+(i+1));return[it[0],it[1].trim(),(it[2]||'').trim()||it[1].trim()]});
   for(const L of (LOCK[k]||[]))if(!out[k].some(x=>x[0]==L))throw new Error(t('lock'))}
  else out[k]=a.map((it,i)=>{if(!String(it[0]).trim())throw new Error(t('l_'+k)+' '+(i+1));return[it[0].trim(),(it[1]||'').trim()||it[0].trim()]})}
 const j=JSON.stringify(out);await setS('opt_lists',j);SET.opt_lists=j});
const resetLists=()=>{if(!confirm(t('askR')))return;run(async()=>{await setS('opt_lists','');SET.opt_lists='';EL=null;drawLists()})};
/* ---------- أيام العمل والإجازات ---------- */
let CAL=null;
function initCal(){let off=[0,6];if(SET.wk_off!=null&&String(SET.wk_off)!==''){off=String(SET.wk_off).split(',').map(Number).filter(x=>x>=0&&x<=6)}let hol=[];try{hol=JSON.parse(SET.holidays||'[]')||[]}catch(_){}CAL={off,hol:hol.map(h=>({d:h.d||'',d2:h.d2||'',n:h.n||''}))}}
function drawCal(){const el=$('cal');if(!el)return;if(!CAL)initCal();
 el.innerHTML=`<label style="margin-top:4px">${t('wk')}</label><div class="row" style="gap:6px">${[0,1,2,3,4,5,6].map(i=>`<label class="tg" style="padding:6px 10px;border:1px solid var(--line);border-radius:99px;margin:0"><input type="checkbox" ${CAL.off.includes(i)?'checked':''} onchange="calWk(${i},this.checked)" style="width:18px;height:18px"><span>${t('d'+i)}</span></label>`).join('')}</div>
 <label style="margin-top:12px">${t('hol')}</label>${CAL.hol.map((h,i)=>`<div class="gl" style="grid-template-columns:1fr 1fr;align-items:end"><div><label>${t('holFrom')}</label><input type="date" value="${esc(h.d)}" onchange="CAL.hol[${i}].d=this.value"></div><div><label>${t('holTo')}</label><input type="date" value="${esc(h.d2)}" onchange="CAL.hol[${i}].d2=this.value"></div><div style="grid-column:1/-1;display:flex;gap:8px"><input style="flex:1" placeholder="${t('holN')}" value="${esc(h.n)}" oninput="CAL.hol[${i}].n=this.value"><button class="r" onclick="CAL.hol.splice(${i},1);drawCal()">✕</button></div></div>`).join('')}<div class="row"><button onclick="CAL.hol.push({d:'',d2:'',n:''});drawCal()">${t('holAdd')}</button></div>`}
function calWk(i,on){const s=new Set(CAL.off);on?s.add(i):s.delete(i);CAL.off=[...s].sort()}
const saveCal=()=>run(async()=>{if(CAL.off.length>=7)throw new Error('7');const hol=CAL.hol.filter(h=>h.d).map(h=>{const o={d:h.d,n:h.n.trim()};if(h.d2&&h.d2>=h.d)o.d2=h.d2;return o});
 const wk=CAL.off.length?CAL.off.join(','):'-';await setS('wk_off',wk);SET.wk_off=wk;const j=JSON.stringify(hol);await setS('holidays',j);SET.holidays=j});
/* ---------- ترتيب الصفحة الرئيسية والمؤشرات ---------- */
const AXI=[{id:'projects',s:[['charter.html','sv_charter'],['plan.html','sv_plan'],['cr.html','sv_cr'],['closure.html','sv_closure']]},{id:'quality',s:[]},{id:'strategy',s:[]}];
const TILES=['created','action','done','del'];
let HC=null;
function initHome(){let c={};try{c=JSON.parse(SET.home_cfg||'{}')||{}}catch(_){}
 const ordered=(all,sel)=>{const o=Array.isArray(sel)?sel:all;return[...o.filter(x=>all.includes(x)).map(x=>({k:x,on:true})),...all.filter(x=>!o.includes(x)).map(x=>({k:x,on:false}))]};
 HC={mine:c.mine!==0,first:c.order!='axes',axes:ordered(AXI.map(a=>a.id),c.axes),tiles:ordered(TILES,c.tiles||['created','action','done','del']),svc:{}};
 AXI.forEach(a=>HC.svc[a.id]=ordered(a.s.map(x=>x[0]),c.svc&&c.svc[a.id]))}
function hrows(list,path,lbl){return list.map((x,i)=>`<div class="row" style="margin:4px 0;gap:6px;flex-wrap:nowrap"><label class="tg" style="flex:1;margin:0;min-width:0"><input type="checkbox" ${x.on?'checked':''} onchange="${path}[${i}].on=this.checked"><span>${esc(lbl(x.k))}</span></label><button onclick="hm('${path}',${i},-1)">▲</button><button onclick="hm('${path}',${i},1)">▼</button></div>`).join('')}
function hm(p,i,d){const a=Function('HC','return '+p)(HC),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];drawHome()}
function drawHome(){const el=$('home');if(!el)return;if(!HC)initHome();
 const svName=h=>{for(const a of AXI)for(const s of a.s)if(s[0]==h)return t(s[1]);return h};
 el.innerHTML=`<label class="tg"><input type="checkbox" ${HC.mine?'checked':''} onchange="HC.mine=this.checked"><span>${t('h_mine')}</span></label>
 <label class="tg"><input type="checkbox" ${HC.first?'checked':''} onchange="HC.first=this.checked"><span>${t('h_first')}</span></label>
 <h2 style="margin-top:12px;font-size:15px">${t('h_axes')}</h2>${hrows(HC.axes,'HC.axes',k=>t('ax_'+k))}
 <h2 style="margin-top:12px;font-size:15px">${t('h_svcs')}</h2>${AXI.filter(a=>a.s.length).map(a=>`<div class="mut" style="margin-top:6px">${t('ax_'+a.id)}</div>`+hrows(HC.svc[a.id],'HC.svc.'+a.id,svName)).join('')}
 <h2 style="margin-top:12px;font-size:15px">${t('h_tiles')}</h2>${hrows(HC.tiles,'HC.tiles',k=>t('t_'+k))}`}
const saveHome=()=>run(async()=>{const on=l=>l.filter(x=>x.on).map(x=>x.k),off=l=>l.filter(x=>!x.on).map(x=>x.k);const svc={},svcOff={};AXI.forEach(a=>{svc[a.id]=on(HC.svc[a.id]);svcOff[a.id]=off(HC.svc[a.id])});
 const c={mine:HC.mine?1:0,order:HC.first?'mine':'axes',axes:on(HC.axes),axesOff:off(HC.axes),tiles:on(HC.tiles),tilesOff:off(HC.tiles),svc,svcOff};const j=JSON.stringify(c);await setS('home_cfg',j);SET.home_cfg=j});
const resetHome=()=>run(async()=>{await setS('home_cfg','');SET.home_cfg='';HC=null;drawHome()});
load();
</script></body></html>
